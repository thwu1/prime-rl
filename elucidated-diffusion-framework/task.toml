[metadata]
author_name = "Task Generator"
author_email = "author@example.com"
difficulty_explanation = """Requires expert understanding of score-based diffusion models and the ability to translate non-standard mathematical specifications into correct PyTorch code. The framework uses four novel modifications that prevent copying known implementations: (1) generalized preconditioning with exponent α=3 instead of the standard quadratic form, changing c_skip, c_out, c_in, and the loss weight formula; (2) tanh-compressed noise conditioning c_noise(σ)=tanh(ln(σ)/4) instead of linear log-scaling; (3) a log-cosine sigma schedule using cosine interpolation in log-space instead of power-law interpolation; (4) a damped DPM++ second-order correction γ=-1/(2r+r²) instead of the standard -1/(2r). The agent must carefully read the custom spec and implement each formula precisely — no known published implementation matches these modified equations."""
solution_explanation = """The solution implements ElucidatedDiffusion by: (1) computing preconditioning functions c_skip, c_out, c_in using σ^α with α=3 and c_noise via torch.tanh(log(σ)/4); (2) implementing the preconditioned denoiser with sigma reshaping to (B,1,1,1); (3) computing the log-cosine sigma schedule via cosine-weighted interpolation in log-space using math.pi, torch.cos, and torch.exp; (4) training with log-normal noise, MSE loss weighted by λ(σ)=(σ^α+σ_d^α)^(2/α)/(σ·σ_d)², and optional detached self-conditioning; (5) implementing the stochastic Heun sampler with gamma-based noise injection; (6) implementing the modified DPM++ sampler with damped correction γ=-1/(2r+r²)."""
verification_explanation = """Tests verify numerical correctness of each component: preconditioning functions with α=3 at multiple sigma values (including a c_skip(2.0) test that strongly distinguishes α=3 from α=2), tanh noise conditioning with a saturation test that explicitly fails for linear log-scaling, log-cosine schedule with geometric-mean midpoint verification and an explicit non-power-law check, generalized loss weight values, log-normal noise statistics, training gradient flow, sampler output shapes/ranges/determinism, and DPM++/Heun algorithmic differences."""
