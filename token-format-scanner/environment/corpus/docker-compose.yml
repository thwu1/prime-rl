version: "3.8"

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    environment:
      - NODE_ENV=production
      # WARNING: this token has an invalid checksum -- do NOT use in production
      - GITHUB_TOKEN=gho_X5v8tG2aMnKpYeRcHdFjBwLqNz1S9U1vlLjt
      - DATABASE_URL=postgres://app:secret@db:5432/acme
      - REDIS_URL=redis://cache:6379/0
    depends_on:
      - db
      - cache

  db:
    image: postgres:16
    environment:
      - POSTGRES_DB=acme
      - POSTGRES_USER=app
      - POSTGRES_PASSWORD=secret
    volumes:
      - pgdata:/var/lib/postgresql/data

  cache:
    image: redis:7-alpine
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru

volumes:
  pgdata:
