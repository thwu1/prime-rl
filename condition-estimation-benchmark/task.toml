schema_version = "1.2"

[metadata]
author_name = "Task Generator"
author_email = "author@example.com"
difficulty_explanation = """Requires expert-level numerical linear algebra knowledge combined with C compilation and cross-language debugging skills. The agent must: (1) recognize a sign error in the Moler matrix construction by knowing M = U^T U where U = I - triu(ones,1), (2) identify that the Frank matrix generator is missing the first subdiagonal (upper-triangular instead of upper-Hessenberg), (3) spot a missing ||A||_1 factor in a Python Hager-Higham 1-norm condition estimator, (4) fix a Makefile that fails to link against LAPACK/BLAS by understanding undefined reference errors to dgetrf_/dgetrs_ and knowing these are Fortran LAPACK symbols requiring -llapack -lblas, (5) diagnose an inverted convergence criterion (>= vs <=) in a C implementation of the Hager-Higham algorithm that causes premature termination and severe underestimation for ill-conditioned matrices, and (6) find a hardcoded threshold that contradicts the configuration file. Each bug produces plausible output, requiring deep domain knowledge and multi-tool proficiency to detect and fix."""
solution_explanation = """Fix six bugs: (1) matrices.py: change Moler from U = I + triu(ones,1) to U = I - triu(ones,1); (2) matrices.py: change Frank condition from j >= i to j >= i - 1; (3) estimators.py: change hager_cond1 to return norm1_A * norm1_Ainv instead of just norm1_Ainv; (4) c_src/Makefile: add -llapack -lblas to LIBS; (5) c_src/blocked_est.c: change convergence check from est_new >= est to est_new <= est; (6) benchmark.py: read crossover_threshold from config instead of hardcoding 0.5. Then build the C library with make and regenerate results.json."""
verification_explanation = """Tests independently compute reference matrices and condition numbers using numpy/scipy, then compare against the agent's results.json. Matrix tests verify Moler symmetry, positive-definiteness, and exact entries; Frank subdiagonal nonzero values; and element-wise comparisons for all families. Estimator tests check that Hager and blocked estimates are within factor 10 of exact 1-norm condition numbers. C library tests verify the .so exists, loads via ctypes, returns cond=1 for identity matrices, and gives reasonable estimates across all families. Crossover tests recompute using threshold 0.05 and compare. Structural tests verify all keys including blocked_cond1 are populated."""
category = "numerical_analysis"
tags = ["linear_algebra", "cross_language_debugging"]
expert_time_estimate_hours = 2.0

