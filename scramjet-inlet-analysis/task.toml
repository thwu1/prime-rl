difficulty_explanation = """Requires expert-level knowledge of compressible gas dynamics (oblique shock relations, theta-beta-M
equation, Rankine-Hugoniot conditions) and numerical methods (root-finding for transcendental equations, bounded optimization).
The thermally perfect gas extension requires iterative solution of coupled conservation equations with temperature-dependent
properties. Multi-ramp chaining and inlet optimization combine physics understanding with software engineering."""
solution_explanation = """Implement oblique shock theta-beta-M relation solver using Brent's method, compute post-shock properties
from normal shock relations applied to normal velocity component, chain sequential shocks propagating downstream conditions,
optimize ramp angles using bounded scalar minimization, and extend to TPG by iterating on density ratio across the shock
with enthalpy-based energy conservation. Total pressure ratio for TPG computed from entropy change."""
verification_explanation = """Tests verify normal shock properties against exact analytical values (rational fractions for M=2,4),
oblique shock angles against NACA 1135 reference values, self-consistency of theta-beta-M back-substitution, conservation law
satisfaction for TPG (energy and momentum), monotonicity constraints (Mach decreasing through inlet), and optimization quality."""
