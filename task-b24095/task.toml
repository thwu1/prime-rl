difficulty_explanation = """Requires implementing five distinct query optimizer rules (filter elimination, empty relation propagation, cross join elimination, filter pushdown, limit pushdown) that interact in subtle ways. Each rule must handle multiple node types and join semantics correctly (inner vs left vs right vs full). The cross join elimination requires predicate analysis to extract equijoin conditions from conjunctive filters across nested multi-way joins. Filter pushdown through left joins requires understanding null-extension semantics. The rules must compose across 3 fixpoint iterations. This requires expert-level knowledge of relational query optimization theory."""
solution_explanation = """The solution implements each rule as a recursive tree transformation. eliminate_filter checks constant predicates. propagate_empty_relation handles each join type differently per relational algebra. eliminate_cross_join splits filter conjuncts, classifies them as equijoin or residual based on table references, and rewrites qualifying cross joins. push_down_filter splits conjuncts and routes them based on column references relative to join children, with special handling for outer joins. push_down_limit implements the standard limit merge formula and union distribution. Three fixpoint passes handle cascading opportunities."""
verification_explanation = """Tests load each of the 17 optimized plans and verify structural properties: correct node types at each level, absence of eliminated nodes, presence of pushed-down predicates, correct join types, and correct limit values. Tests also verify that impossible optimization mistakes (e.g., pushing filters below outer join null-extending side) are not made."""
