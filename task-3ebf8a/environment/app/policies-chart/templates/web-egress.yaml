{{- if .Values.webEgress.enabled }}
apiVersion: "cilium.io/v2"
kind: CiliumNetworkPolicy
metadata:
  name: "web-egress"
spec:
  endpointSelector:
    matchLabels:
      tier: web
  egress:
  - toEndpoints:
    - matchLabels:
        tier: api
    toPorts:
    - ports:
      - port: {{ .Values.webEgress.apiPort | quote }}
        protocol: TCP
  - toCIDR:
    - "0.0.0.0/0"
    toPorts:
    - ports:
      - port: {{ .Values.webEgress.externalPort | quote }}
        protocol: TCP
  - toCIDRSet:
    - cidr: {{ .Values.webEgress.internalCIDR | quote }}
      except:
      {{- range .Values.webEgress.internalCIDRExcept }}
      - {{ . | quote }}
      {{- end }}
    toPorts:
    - ports:
      - port: {{ .Values.webEgress.dnsPort | quote }}
        protocol: UDP
{{- end }}
