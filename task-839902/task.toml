difficulty_explanation = """Requires expert knowledge of CNSA 2.0 algorithm requirements (ML-DSA-87 only — not ML-DSA-65 or ML-DSA-44), PKI certificate chain signing cascades, and X.509 extension semantics for post-quantum signature algorithms. The solver must audit a pre-deployed PKI to discover that the Root CA uses ML-DSA-65 instead of the CNSA-2.0-mandated ML-DSA-87, understand that this non-compliance cascades to the Intermediate CA certificate's signature, identify that keyEncipherment in the server cert's keyUsage is semantically invalid for PQC pure-signature keys, spot the wrong EKU on the client cert, notice the missing OCSP signing certificate, and remediate all issues while maintaining CA database integrity and proper certificate serial tracking across revocation and re-issuance."""
solution_explanation = """Audit the existing PKI by inspecting each certificate's signature algorithm, public key algorithm, extensions, and SANs. Discover Root CA uses ML-DSA-65 (non-CNSA-2.0), regenerate with ML-DSA-87, re-sign Intermediate CA. Fix the Intermediate CA openssl.cnf: remove keyEncipherment from server_cert keyUsage, add missing wildcard/IP SANs, fix client_cert EKU to clientAuth+emailProtection, add ocsp_cert section. Revoke old non-compliant end-entity certs, re-issue with corrected extensions, create OCSP signing cert, generate CRL with revoked serials, assemble chain bundle, and test TLS 1.3 with X25519MLKEM768 hybrid key exchange."""
verification_explanation = """Tests verify each certificate's signature algorithm is ML-DSA-87 with explicit negative checks for ML-DSA-65 presence, validate certificate extensions (basicConstraints, keyUsage without keyEncipherment, correct EKU), check SANs, verify chain validation via openssl verify, parse CRL for revoked entries, verify TLS output contains X25519MLKEM768 and TLSv1.3 with Verify return code 0, check audit report mentions specific findings (mldsa65, keyEncipherment), and perform a live s_server/s_client TLS handshake test."""
