[metadata]
author_name = "Task Generator"
author_email = "author@example.com"
difficulty_explanation = """Requires expert-level knowledge of numerical methods for subsurface flow. The agent receives only the governing PDE (Darcy + conservation) and must independently choose a correct cell-centered finite volume discretization, derive the proper inter-cell flux formula for heterogeneous anisotropic media on a non-uniform grid, recognize that naive permeability averaging causes order-of-magnitude errors in high-contrast fields (1000x ratio), handle the singular pure-Neumann system via a reference pressure constraint, and correctly wire well source terms. No algorithm name or averaging technique is given — the agent must draw on deep understanding of computational physics to produce a correct pressure field."""
solution_explanation = """Build cell-to-cell connectivity for the 20x20 structured grid. For each internal face compute the TPFA transmissibility T = A_face / (mu * (d_L/k_L + d_R/k_R)) using half-cell distances d_L, d_R and the directional permeability (kx for x-faces, ky for y-faces) — this is the harmonic-mean averaging implied by Darcy's law across layers in series. Assemble the sparse coefficient matrix, add well source terms to the RHS, replace the reference-cell row with the pressure constraint, and solve with a sparse direct solver. Write cell pressures and diagnostics."""
verification_explanation = """Tests exercise four analytical cases (1D uniform, 1D heterogeneous, non-uniform grid spacing, 2D symmetric 3x3) with exact expected pressures, plus a full 20x20 reference comparison computed independently by the test harness using scipy. Mass-balance and pressure-ordering checks add robustness. The heterogeneous test specifically catches arithmetic-mean averaging errors."""
