schema_version = "1.2"

[metadata]
author_name = "Task Generator"
author_email = "author@example.com"
difficulty_explanation = """Requires expert-level knowledge of spectral element CFD: parsing nekRS .par files with mathematical expression evaluation, physics type detection from non-dimensionalization conventions, and cross-validation against mesh geometry analyzed via the gmsh Python API. A reference document is provided but the agent must synthesize domain knowledge in computational fluid dynamics, spectral element methods (GLL point distributions), boundary layer resolution theory (y+ estimation), and turbulence model requirements to produce a working tool. The gmsh Python API requires exploration to extract element statistics, boundary physical groups, and quality metrics."""
solution_explanation = """Build a Python tool that: (1) loads Gmsh .msh mesh files using the gmsh Python API to extract element counts, bounding boxes, boundary physical groups, and element quality; (2) parses nekRS .par INI-like format handling section names with spaces, mathematical expressions, compound parameters with + delimiters; (3) detects physics type from configuration patterns; (4) computes spectral element resolution metrics including GLL point spacing and y+ estimation; (5) validates 10 consistency rules covering missing sections, invalid parameters, negative properties, RANS/CHT-specific requirements, and out-of-range values."""
verification_explanation = """Tests run the built tool against 8 case directories (4 valid, 4 with deliberate errors in .par files), each containing a .msh mesh and a .par config. For valid cases: verifies correct mesh statistics (element count, bounding box, boundary groups, element sizes, quality), physics type detection, non-dimensional parameter extraction, expression evaluation, boundary conditions, total DOF, GLL spacing, and y+ estimation. For broken cases: verifies the tool detects specific error codes. Mesh analysis tests verify gmsh API integration for element counting, bounding box extraction, and boundary group identification."""
category = "scientific_computing"
tags = ["cfd", "mesh-analysis"]
expert_time_estimate_hours = 2.5

[verifier]
network_mode = "no-network"
timeout_sec = 300.0

