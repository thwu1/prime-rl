<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /app/apache/htdocs

    <Directory /app/apache/htdocs>
        AllowOverride None
        Require all granted
    </Directory>

    ProxyRequests Off

    RewriteEngine On

    # alpha profile
    RewriteCond %{HTTP_USER_AGENT} "Chrome" [NC]
    RewriteRule ^/api/v2/status$ http://127.0.0.1:50050%{REQUEST_URI} [R=302,L]

    # bravo profile
    RewriteCond %{HTTP_USER_AGENT} "Googlebot" [NC]
    RewriteRule ^/static/assets/analytics\.gif$ http://127.0.0.1:50050%{REQUEST_URI} [P,L]

    # catch-all
    RewriteRule ^/(.*)$ https://www.example.com/$1 [R=302,L]

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
