<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /app/apache/htdocs

    <Directory /app/apache/htdocs>
        AllowOverride All
        Require all granted
    </Directory>

    ProxyRequests Off

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>
