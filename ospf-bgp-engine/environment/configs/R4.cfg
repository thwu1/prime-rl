!
! R4 Configuration - Area Border Router (areas 0 and 20)
!
hostname R4
!
interface Loopback0
 ip address 10.0.0.4 255.255.255.255
!
interface GigabitEthernet0/0
 description Link to R2
 ip address 10.1.24.2 255.255.255.252
 ip ospf cost 10
 no shutdown
!
interface GigabitEthernet0/1
 description Link to R3
 ip address 10.1.34.2 255.255.255.252
 ip ospf cost 20
 no shutdown
!
interface GigabitEthernet0/2
 description Link to R6
 ip address 10.1.46.1 255.255.255.252
 ip ospf cost 10
 no shutdown
!
router ospf 1
 router-id 10.0.0.4
 network 10.0.0.4 0.0.0.0 area 0
 network 10.1.24.0 0.0.0.3 area 0
 network 10.1.34.0 0.0.0.3 area 0
 network 10.1.46.0 0.0.0.3 area 20
!
end
