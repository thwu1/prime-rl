!
! R3 Configuration - Area Border Router (areas 0 and 10)
!
hostname R3
!
interface Loopback0
 ip address 10.0.0.3 255.255.255.255
!
interface GigabitEthernet0/0
 description Link to R1
 ip address 10.1.13.2 255.255.255.252
 ip ospf cost 10
 no shutdown
!
interface GigabitEthernet0/1
 description Link to R4
 ip address 10.1.34.1 255.255.255.252
 ip ospf cost 20
 no shutdown
!
interface GigabitEthernet0/2
 description Link to R5
 ip address 10.1.35.1 255.255.255.252
 ip ospf cost 10
 no shutdown
!
router ospf 1
 router-id 10.0.0.3
 network 10.0.0.3 0.0.0.0 area 0
 network 10.1.13.0 0.0.0.3 area 0
 network 10.1.34.0 0.0.0.3 area 0
 network 10.1.35.0 0.0.0.3 area 10
!
end
