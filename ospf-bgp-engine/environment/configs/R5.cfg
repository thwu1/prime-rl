!
! R5 Configuration
!
hostname R5
!
interface Loopback0
 ip address 10.0.0.5 255.255.255.255
!
interface GigabitEthernet0/0
 description Link to R3
 ip address 10.1.35.2 255.255.255.252
 ip ospf cost 10
 no shutdown
!
interface GigabitEthernet0/1
 description Connected subnet
 ip address 172.16.5.1 255.255.255.0
 no shutdown
!
router ospf 1
 router-id 10.0.0.5
 network 10.0.0.5 0.0.0.0 area 10
 network 10.1.35.0 0.0.0.3 area 10
 redistribute connected subnets route-map REDIST-CONNECTED
!
route-map REDIST-CONNECTED permit 10
 match interface GigabitEthernet0/1
 set metric 100
 set metric-type type-2
!
end
