!
! R2 Configuration
!
hostname R2
!
interface Loopback0
 ip address 10.0.0.2 255.255.255.255
!
interface GigabitEthernet0/0
 description Link to R1
 ip address 10.1.12.2 255.255.255.252
 ip ospf cost 5
 no shutdown
!
interface GigabitEthernet0/1
 description Link to R4
 ip address 10.1.24.1 255.255.255.252
 ip ospf cost 10
 no shutdown
!
interface GigabitEthernet1/0
 description eBGP peering to ISP-B (AS 65200)
 ip address 192.168.2.2 255.255.255.252
 no shutdown
!
router ospf 1
 router-id 10.0.0.2
 network 10.0.0.2 0.0.0.0 area 0
 network 10.1.12.0 0.0.0.3 area 0
 network 10.1.24.0 0.0.0.3 area 0
!
router bgp 65000
 bgp router-id 10.0.0.2
 neighbor 192.168.2.1 remote-as 65200
 neighbor 192.168.2.1 route-map ISP-B-IN in
 neighbor 10.0.0.1 remote-as 65000
 neighbor 10.0.0.1 update-source Loopback0
 neighbor 10.0.0.1 next-hop-self
!
route-map ISP-B-IN permit 10
 set local-preference 200
!
end
