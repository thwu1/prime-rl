schema_version = "1.2"

[metadata]
author_name = "Task Generator"
author_email = "author@example.com"
difficulty_explanation = """Requires diagnosing and fixing four interacting concurrency/correctness bugs in a streaming financial pipeline spanning non-atomic operator processing, fence-post errors in watermark comparison, incomplete join coverage, and off-by-one in finalization — without any hints about which modules or code patterns are defective. Additionally requires building a DuckDB-based batch oracle and a multi-delay consistency monitor, both from scratch, that verify the pipeline's internal consistency properties. The solver must understand watermark-based progress tracking, the distinction between internal and eventual consistency in streaming systems, and integrate DuckDB SQL, jq, Python, and bash orchestration into a coherent verification pipeline."""
solution_explanation = """Fix four pipeline bugs: (1) BalanceJoiner.compute iterates only credits.keys() — change to union of credits and debits keys so debit-only accounts are included; (2) engine.py ingest processes debits AFTER snapshot emission — move debit processing before snapshot for atomic operator updates; (3) progress.py is_late uses <= — change to strict < so events at watermark boundary are accepted; (4) engine.py finalize uses force_advance(max_ts) — change to max_ts+1 to include events at exactly max_ts. Build a DuckDB oracle that simulates watermark acceptance and runs SQL aggregation. Build a consistency monitor that runs the pipeline across delays [0,1,5,10,20], compares against the oracle, classifies anomalies, and writes a structured report."""
verification_explanation = """Tests verify: (1) pipeline internal consistency — total=0 at every checkpoint, balance=credits-debits per account, monotonic credit/debit values, correct behavior across seven watermark delays and two datasets; (2) DuckDB oracle correctness — compute.sh exists and is executable, oracle files reference DuckDB, oracle results for delays 0/5/20 match independently computed ground truth; (3) monitor report validity — report.json exists with correct schema covering all five delays, all entries show consistent=true with zero anomalies, monitor files reference both jq and the oracle."""
category = "streaming_systems"
tags = ["consistency-audit", "duckdb"]
expert_time_estimate_hours = 3.0

