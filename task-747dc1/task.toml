difficulty_explanation = """Requires implementing three interconnected advanced data structures in C++20: (1) a persistent balanced tree backing a piece table — one of the hardest balanced BST variants to implement correctly, made harder by persistence which eliminates parent pointers and requires purely functional algorithms; (2) a piece table built on top of the persistent tree with correct offset arithmetic for insert/erase across fragmented pieces; (3) branching undo history modeled as a tree of snapshots using the persistence property; and (4) a shortest-edit-script diff algorithm operating on lines. The agent must also discover the full API specification by exploring project documentation scattered across multiple files. Each component individually is graduate-level; combining them into a correct, tested library is expert-level systems programming."""
solution_explanation = """The solution implements: a persistent balanced tree using shared_ptr nodes and path-copying on insert/delete; a piece table that maps character offsets to (buffer_id, start, length) triples stored as augmented tree nodes with subtree-size metadata for O(log n) offset lookups; an UndoTree that stores snapshot roots in a tree structure allowing branching undo; and a shortest-edit-script diff using the classic O(ND) algorithm on line-split text. The CMake build produces a static library and test binary."""
verification_explanation = """Tests verify: (1) basic insert/erase correctness on the piece table; (2) correctness under stress — 200 random inserts and 50 erases; (3) persistence — old snapshots remain valid after mutations via undo tree; (4) branching undo — creating branches after undo and navigating between them; (5) diff correctness on known inputs including multiline reconstruction; (6) integration of diff with undo tree snapshots. Tests build the solution with CMake and run both the internal smoke test and external pytest verification."""
