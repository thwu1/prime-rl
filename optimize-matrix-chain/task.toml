difficulty_explanation = """Requires implementing a generalized matrix chain optimizer that combines dynamic-programming-based optimal parenthesization with property-aware BLAS/LAPACK kernel selection, property propagation through intermediate results, and solve-vs-explicit-inverse trade-off analysis including right-solves. Demands PhD-level knowledge of numerical linear algebra, compiler optimization, and BLAS kernel cost models."""
solution_explanation = """Implement a modified matrix chain DP that tracks matrix properties (diagonal, triangular, SPD) through intermediates, selects cheapest applicable kernel at each combine step (DIAGMM, TRMM, TRSM, POSV vs GEMM/GESV), and considers left-solve/right-solve alternatives for inverted terms instead of explicit inverse computation."""
