schema_version = "1.2"

[metadata]
author_name = "Task Generator"
author_email = "author@example.com"
difficulty_explanation = """Requires expert-level understanding of PKGBUILD semantics: bash variable scoping and expansion within split-package function overrides, the eval/declare-f dynamic function generation pattern (used by complex AUR packages like Flutter), computed prefix variables in array elements, and epoch-aware version comparison. Beyond parsing, the solver must orchestrate multiple unfamiliar CLI tools — bash subprocess evaluation for PKGBUILD metadata extraction, sqlite3 for building a normalized package database, graphviz dot for rendering dependency graphs, and jq for JSON output formatting — into a coherent pipeline. The dependency analysis requires implementing virtual provider resolution, topological sort for build ordering, version constraint satisfaction checking, conflict pair detection with self-conflict exclusion, and maximal independent set computation for installable groups."""
solution_explanation = """The solution creates a Python-based pipeline that: (1) sources each PKGBUILD in a bash subprocess with neutered filesystem commands, extracting metadata via declare-p after calling package_*() functions to capture per-package overrides; (2) populates a SQLite database with normalized tables for packages, dependencies, provides, and conflicts; (3) performs dependency graph analysis including topological sort (Kahn's algorithm), conflict pair detection, version mismatch identification, and maximal installable group computation via independent set enumeration on the conflict graph; (4) generates a DOT graph with cluster subgraphs and renders it to SVG via graphviz; (5) produces JSON and formats it through jq."""
verification_explanation = """Tests run the pipeline and validate all three outputs: the SQLite database schema, package count (16 from 10 pkgbases), and specific field values including bash-evaluated computed variables; the DOT/SVG graph structure including cluster subgraphs, conflict edges, and unsatisfiable node shapes; and the JSON audit report including topological build order validity, exact conflict pair detection, version mismatch identification, and installable group correctness (4 groups of 13 packages each)."""
category = "systems"
tags = ["package-management", "multi-tool-pipeline"]
expert_time_estimate_hours = 3.0

