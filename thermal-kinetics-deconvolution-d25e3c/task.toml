difficulty_explanation = """Requires domain expertise in thermal analysis kinetics (ICTAC methods), including: (1) deconvolution of overlapping first-order decomposition reactions from noisy multi-heating-rate TGA data — a non-trivial optimization problem requiring derivative analysis and peak fitting; (2) application of isoconversional methods (Friedman, KAS, OFW) or model-fitting approaches to recover kinetic parameters from the separated reactions across five heating rates; (3) forward integration of the Arrhenius rate equation to predict conversion at an unseen heating rate. The 46 K peak separation makes deconvolution genuinely challenging — standard approaches that assume well-separated peaks will fail."""
solution_explanation = """The reference solution: (1) loads all five heating rate CSV files and computes dα/dT derivatives; (2) fits the composite derivative curves to a sum of two asymmetric peaks (Fraser-Suzuki functions) via nonlinear least squares to deconvolve weight fractions and individual conversion curves; (3) applies the Kissinger method using peak temperatures across heating rates to get initial E_a estimates, then refines via Friedman isoconversional analysis on deconvolved curves; (4) recovers pre-exponential factors from the Arrhenius intercepts; (5) integrates the two coupled first-order ODEs with recovered parameters at β=7.5 K/min using scipy.integrate.solve_ivp to produce predictions."""
verification_explanation = """Tests load results.json, compare activation energies within 8% relative tolerance, weight fractions within 0.06 absolute, predictions within 0.04 absolute, and pre-exponential factors within 1.5 orders of magnitude on log10 scale. Ground truth was generated by integrating the exact ODEs with known parameters."""
