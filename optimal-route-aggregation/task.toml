schema_version = "1.2"

[metadata]
author_name = "Task Generator"
author_email = "author@example.com"
difficulty_explanation = """Requires implementing the ORTC (Optimal Routing Table Constructor) algorithm from Draves et al. (1999) or an equivalent optimal route aggregation scheme on top of a correct IPv4 longest-prefix-match engine. The ORTC involves three non-trivial phases: trie normalization, bottom-up nexthop-set computation (intersection/union lattice), and top-down optimal selection. Naive greedy merging of sibling prefixes is provably suboptimal for certain inputs, so the agent must understand why and implement the full algorithm. Additionally, the agent must handle dynamic INSERT/DELETE operations, edge cases (/0 default routes, /32 host routes, overlapping prefixes, delete-with-fallback), and meet performance requirements."""
solution_explanation = """Build a binary trie for LPM lookup. For AGGREGATE, implement the ORTC algorithm: (1) build a fresh trie from all routes, (2) normalize so every internal node has two children (virtual leaves inherit the ancestor's effective nexthop), (3) bottom-up compute nexthop-sets using intersection-if-nonempty/union-otherwise, (4) top-down select the inherited nexthop when possible to avoid emitting an entry, otherwise pick from the nexthop-set and emit. The result is provably minimal."""
verification_explanation = """Tests verify: basic LOOKUP correctness, longest-prefix-match semantics, INSERT overwrite/DELETE with fallback, /0 default routes, /32 host routes. Crucially, aggregation tests include cases where greedy merging produces 3 entries but ORTC produces 2, and alternating-nexthop patterns where ORTC produces 3 vs greedy's 4. A large-scale test with 2000 random routes verifies the aggregated count matches a reference ORTC implementation and that forwarding behavior is preserved for 10,000 random probe IPs. A performance test checks 200K lookups over 10K routes complete within 60 seconds."""
category = "networking"
tags = ["algorithms", "ip-routing"]
