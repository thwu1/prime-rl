difficulty_explanation = """Requires PhD-level quantitative finance knowledge: implementing Newton-Raphson implied volatility solvers with numerical stability, fitting SVI parametric models via constrained nonlinear optimization across multiple expiration slices, verifying Durrleman's no-arbitrage condition (a non-trivial density positivity check involving first and second derivatives of the total variance function), implementing vectorized Monte Carlo simulation with path-dependent volatility lookup from the calibrated surface using total variance interpolation, and computing analytical Black-Scholes Greeks for a multi-leg portfolio. The combination of numerical methods, mathematical finance theory, optimization, and simulation is beyond standard textbook exercises."""
solution_explanation = """The solution implements: (1) Newton-Raphson IV solver with Brenner-Subrahmanyam initial guess and bisection fallback for robustness, (2) SVI fitting via L-BFGS-B with multiple random restarts to avoid local minima, (3) Durrleman's condition evaluated on a dense grid of log-moneyness values, (4) vectorized Monte Carlo with SVI surface interpolation for barrier and Asian exotic pricing, (5) analytical BS Greeks aggregation with proper sign conventions for long/short positions."""
