difficulty_explanation = """Requires understanding HOL Light formal specification notation to extract mathematical contracts for Montgomery arithmetic. The implementer must correctly handle CIOS Montgomery multiplication with P-256's special reduction constant (n0'=1), multi-precision carry/borrow propagation, conditional final subtraction, R^2 mod p precomputation, and modular inverse via binary exponentiation. Additionally requires proficiency with GNU Make for multi-target builds, nm for dynamic symbol table analysis of shared libraries, objdump for x86 disassembly parsing and instruction counting, the size utility for ELF section measurement, ar for static library creation, and openssl ecparam for extracting elliptic curve parameters — all orchestrated into a coherent build and verification pipeline with correct tool interoperability."""
solution_explanation = """A Python script generates the C implementation using CIOS Montgomery multiplication with __int128 intermediates and n0'=1 for P-256. A Makefile orchestrates: gcc for shared/static library builds, nm -D piped through grep/awk/sort for symbol extraction to symbol_manifest.txt, a Python helper that parses objdump -d disassembly to count instructions and size output for section metrics written as JSON, and another Python helper that parses openssl ecparam hex output to verify the P-256 prime constant."""
verification_explanation = """Tests verify both toolchain outputs and functional correctness. Toolchain tests check: Makefile exists, shared and static libraries are built, symbol_manifest.txt contains exactly 7 alphabetically-sorted p256_* function names, build_analysis.json is valid JSON with positive integer values for instruction count and section sizes, prime_verification.txt contains MATCH, and nm -D independently confirms expected dynamic symbols. Functional tests load the shared library via ctypes and verify all 7 operations against Python's native arbitrary-precision arithmetic with comprehensive test vectors including edge cases, aliasing, and algebraic properties."""
