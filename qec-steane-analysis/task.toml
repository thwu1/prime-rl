[metadata]
author_name = "Task Generator"
author_email = "author@example.com"
difficulty_explanation = """Requires PhD-level quantum computing expertise: deep understanding of quantum error correction codes (Steane [[7,1,3]] CSS code), circuit-level depolarizing noise models, detector error model extraction and analysis, and post-selection techniques. The agent must independently determine the correct encoding circuit, stabilizer structure, noise placement, and DEM analysis pipeline using the bloqade-tsim API. No implementation guidance is provided — only the expected circuit properties and physical constraints on the output."""
solution_explanation = """Construct the [[7,1,3]] Steane code encoding circuit: prepare |+⟩ via RX, apply T gate, then H, reset ancillas, and encode using CZ-based encoding layers derived from the [7,4,3] Hamming code structure. Define 3 Z-type stabilizer detectors from the code's parity check matrix and 1 logical Z observable. For noise analysis, add DEPOLARIZE1 after single-qubit gate layers and DEPOLARIZE2 after CZ layers. Use tsim's compile_detector_sampler() with sample(separate_observables=True) to collect detector and observable data. Extract the DEM and iterate instructions to count error mechanisms and L0-flipping entries. Post-selection masks shots where all detectors are zero."""
verification_explanation = """Tests validate: (1) Circuit structure matches [[7,1,3]] code exactly (7 qubits, 7 measurements, 3 detectors, 1 observable, T-count=1). (2) Noiseless observable rate matches sin²(π/8)≈0.1464 within ±0.015. (3) DEM has error mechanisms at each noise level, with some flipping L0. (4) Detection event rate increases monotonically with noise. (5) Post-selection yield decreases with noise. (6) Post-selection improves logical fidelity at moderate noise (0.005≤p≤0.05). (7) High noise causes measurable deviation from ideal. (8) Low noise produces near-ideal results. (9) All rates are valid probabilities. (10) JSON schema completeness."""
