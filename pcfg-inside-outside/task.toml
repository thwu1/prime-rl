schema_version = "1.2"

[metadata]
author_name = "Task Generator"
author_email = "author@example.com"
difficulty_explanation = """Requires implementing the inside-outside algorithm for PCFGs from scratch (CYK-based inside, outside, EM re-estimation), Viterbi CYK parsing for maximum-probability trees, and orchestrating a multi-tool pipeline: SQLite for structured grammar storage with proper schema design and complex queries across iteration history, graphviz DOT format for parse tree visualization with dot CLI rendering, and bash for pipeline wiring. The outside algorithm is notoriously error-prone due to its complex indexing over parent spans and sibling inside probabilities. Bridging the EM output into a relational schema and generating valid DOT graph descriptions adds tool-integration challenges beyond pure algorithm implementation."""
solution_explanation = """The solution implements: (1) CYK inside algorithm summing parse probabilities bottom-up; (2) outside algorithm propagating contextual probabilities top-down; (3) EM expected count accumulation and M-step normalization; (4) Viterbi CYK with backpointers for max-probability parse extraction; (5) SQLite database creation with rules, iterations, rule_history, and sentence_parses tables; (6) DOT-format parse tree generation from parenthesized notation; (7) a shell pipeline that runs the Python core, then invokes graphviz dot to render SVGs from DOT files."""
verification_explanation = """Tests verify: (1) initial LL matches hand-computed value; (2) EM monotonically improves LL; (3) rule probabilities normalize per LHS; (4) unused rules converge to zero; (5) SQLite database has correct schema, row counts, and data integrity across tables; (6) complex SQL queries over iteration history return consistent results; (7) Viterbi parse trees have correct leaves matching sentences and correct structure for unambiguous sentences; (8) SVG files exist, are valid, and were generated by graphviz; (9) internal consistency between JSON output, database, and visualization artifacts."""
category = "natural_language_processing"
tags = ["dynamic-programming", "probabilistic-parsing"]
expert_time_estimate_hours = 4.0

