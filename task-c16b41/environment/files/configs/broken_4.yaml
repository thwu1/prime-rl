# Model: ERNIE-4.5-300B-A47B
# Hardware: 16 GPUs
# Intent: BF16 DPO training

### data
train_dataset_type: "erniekit"
eval_dataset_type: "erniekit"
train_dataset_path: "./data/dpo-train.jsonl"
eval_dataset_path: "./data/dpo-eval.jsonl"
max_seq_len: 8192

### model
model_name_or_path: baidu/ERNIE-4.5-300B-A47B-Paddle
fine_tuning: Full

### training
stage: DPO
batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 5.0e-6
lr_scheduler_type: cosine
warmup_steps: 10
weight_decay: 0.1
optim: adamw

### performance
tensor_parallel_degree: 8
pipeline_parallel_degree: 4
sharding_parallel_degree: 2
sharding: stage1
sequence_parallel: True
pp_seg_method: [0, 10, 20, 60]
compute_type: bf16
fp16_opt_level: O2
recompute: True
amp_custom_white_list:
  - lookup_table
  - flash_attn
  - matmul
  - elementwise_div
amp_custom_black_list:
  - reduce_sum
  - softmax_with_cross_entropy
  - elementwise_div
