difficulty_explanation = """Requires graduate-level robotics and optimization knowledge: extracting a pose graph from SQLite with packed binary BLOB information matrices, compiling a C shared library and calling it via FFI, implementing iterative nonlinear least-squares optimization on the SE(2) Lie group with analytical Jacobians, and choosing and integrating a robust cost function to reject outlier loop closures. Subtle errors in angle normalization, Jacobian derivation, information matrix reconstruction from BLOBs, or gauge freedom handling silently produce incorrect results."""
solution_explanation = """Read pose graph from SQLite, unpacking binary BLOBs with struct. Compile the provided C SE(2) library and load via ctypes for edge error computation. Implement Gauss-Newton optimization: for each edge compute the error and analytical Jacobians, apply a robust kernel (e.g. Cauchy) to down-weight outliers, accumulate the weighted normal equation system H*dx=-b, fix gauge by anchoring node 0, solve, and iterate until convergence. The robust kernel automatically suppresses the two outlier loop closures."""
verification_explanation = """Property-based tests verify the optimizer output without comparing to ground truth: trajectory spatial extent, heading patterns, loop closure satisfaction (>=4 of 7 edges well-fitted), outlier resistance (specific node pairs remain far apart), node 0 anchoring, and evidence that initial poses were actually modified."""
