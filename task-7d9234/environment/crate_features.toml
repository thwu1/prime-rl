# Crate feature specification
# Modeled on a Rust unikernel's Cargo.toml feature system
#
# Syntax for feature dependency values:
#   "feature_name"        - enables another feature
#   "dep:dep_name"        - activates an optional dependency
#   "dep_name/feat_name"  - activates optional dep AND enables a feature on it
#   "dep_name?/feat_name" - enables a feature on dep ONLY IF dep is already
#                           activated by some other source
#
# When an optional dependency is activated, it starts with the default
# features listed in [optional-deps].

[features]
default = ["acpi", "dhcpv4", "fsgsbase", "pci", "pci-ids", "smp", "tcp", "virtio-fs", "virtio-net", "virtio-vsock"]

# Syscall features
common-os = []
mman = []
newlib = []

# Platform features
acpi = []
fsgsbase = []
smp = ["acpi"]

# PCI
pci = ["virtio?/pci"]
pci-ids = ["dep:pci-ids-db"]

# Network protocol features
tcp = ["net", "dep:smoltcp", "smoltcp/socket-tcp"]
udp = ["net", "dep:smoltcp", "smoltcp/socket-udp"]
dhcpv4 = ["net", "dep:smoltcp", "smoltcp/proto-dhcpv4", "smoltcp/socket-dhcpv4"]
dns = ["net", "dep:smoltcp", "smoltcp/socket-dns"]
net-trace = ["smoltcp?/log", "smoltcp?/verbose"]
write-pcap = ["net-trace", "smoltcp?/pcap"]

# Network drivers
virtio-net = ["net", "virtio"]
rtl8139 = ["net", "pci", "dep:volatile", "dep:endian-num"]
gem-net = ["net", "dep:tock-registers"]

# Virtio backend
virtio = ["dep:virtio", "dep:mem-barrier"]
virtio-console = ["virtio"]
virtio-fs = ["virtio", "dep:fuse-abi"]
virtio-vsock = ["virtio"]

# Other features
vga = []
idle-poll = []
shell = ["dep:simple-shell"]
strace = []

# Internal feature
net = []

[optional-deps]
smoltcp = ["alloc", "medium-ethernet", "proto-ipv4"]
virtio = ["alloc", "mmio"]
mem-barrier = []
pci-ids-db = []
volatile = []
endian-num = []
tock-registers = []
fuse-abi = []
simple-shell = []
