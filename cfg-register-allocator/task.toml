[metadata]
author_name = "Task Generator"
author_email = "author@example.com"
difficulty_explanation = """Requires building a complete register allocation pipeline spanning two domains: (1) a register allocator that correctly handles control-flow graphs with loops and branches, function calls with caller-saved register semantics, variable spilling under high register pressure, and produces optimal assignments; (2) a GAS-syntax x86-64 assembly emitter that generates valid AT&T-notation assembly respecting x86 encoding constraints (e.g. two-memory-operand prohibition), proper stack frame setup/teardown following System V ABI conventions, and correct integration with a C runtime via gcc linkage. The combination requires proficient-level expertise in compiler internals, x86-64 assembly, the System V calling convention, and the gcc toolchain."""
solution_explanation = """The allocator performs backward dataflow liveness analysis with fixed-point iteration over the CFG, builds an interference graph (with a special movq source-destination exception), applies DSATUR graph coloring with move-biasing tie-breaking, maps colours to the 12 allocatable registers or rbp-relative stack slots for spills, and eliminates trivial self-moves. The emitter translates the allocated IR to GAS AT&T syntax with function prologue/epilogue (pushq/popq %rbp, stack frame allocation), handles the two-memory-operand restriction by using %rax as scratch, emits blocks as labeled sections with conclusion as the return epilogue, and produces assembly that links with the C runtime via gcc."""
verification_explanation = """Tests verify at two levels. Python-level: (1) no Var arguments remain; (2) interpreter output matches expected for all 8 test programs (arithmetic, branches, loops, Fibonacci, 15-variable spill, callq with live variables, nested conditionals, loop+conditional); (3) spill program uses Deref stack slots; (4) stack_space is 16-byte aligned; (5) no trivial self-moves; (6) caller-saved correctness across callq with multiple inputs. Binary-level: (7) emitted assembly compiles with gcc; (8) resulting executables produce correct output for all test programs including those requiring stdin input via read_int; (9) loop+call binary with multi-value stdin input."""
