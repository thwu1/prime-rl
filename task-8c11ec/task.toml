difficulty_explanation = """Requires expert-level bioinformatics knowledge: the solver must independently understand VCF 1-based vs BED 0-based coordinate systems to correctly assess variant retention, design a methodology for per-step variant impact analysis without procedural guidance, reason about how the interplay of min_length, slop_bp, and merge_distance parameters across multiple annotation types affects both true and false variant retention, and identify a targeted parameter change that fixes a sensitivity deficit without introducing specificity regressions. The instruction provides only the problem statement and output schemas — no formulas for sensitivity/specificity, no coordinate conversion hints, and no optimization strategy — requiring holistic domain expertise throughout."""
solution_explanation = """Run the pipeline with each of three strategy configs, compute sensitivity/specificity/coverage against the truth set for each (correctly handling VCF 1-based to BED 0-based coordinate conversion). Rank by composite score (C > A > B). Perform step-by-step impact analysis on strategy_c by tracking which variants are lost at each exclusion step — identify tandem_repeats as the weakest step (excludes 2 validated_true variants at positions 100500 and 310500 while excluding 0 validated_false variants). Design optimized config by increasing min_length for tandem_repeats above 1000 (both problematic TR annotations are exactly 1000bp), retaining all true variants while false variants remain excluded by other steps. Run pipeline with optimized config to produce final benchmark."""
