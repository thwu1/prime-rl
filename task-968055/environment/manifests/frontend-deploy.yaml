apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: production
  labels:
    app: frontend
    tier: web
spec:
  replicas: 3
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
        tier: web
    spec:
      containers:
      - name: frontend
        image: internal-registry.corp/frontend:v1.8.3
        ports:
        - containerPort: 8080
        securityContext:
          runAsUser: 0
          allowPrivilegeEscalation: true
        volumeMounts:
        - name: host-logs
          mountPath: /var/log/host
      volumes:
      - name: host-logs
        hostPath:
          path: /var/log
          type: Directory
