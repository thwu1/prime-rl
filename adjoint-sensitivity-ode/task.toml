schema_version = "1.2"

[metadata]
author_name = "Task Generator"
author_email = "author@example.com"
difficulty_explanation = """Requires diagnosing multiple interacting bugs in a broken ODE parameter estimation pipeline (wrong data format, inaccurate solver settings, flawed optimization strategy), then implementing a correct analytical gradient computation for ODE parameter sensitivity and a working optimization loop. The agent must parse CSV and TOML data files, understand why explicit low-tolerance ODE solving produces unreliable gradients, and implement forward sensitivity equations or an equivalent analytical gradient method from scratch. This demands graduate-level numerical methods knowledge, multi-format data handling, and careful debugging across Python, TOML, CSV, and shell components."""
solution_explanation = """The solution diagnoses driver.py's bugs: (1) data loaded from nonexistent JSON instead of the provided CSV/TOML files, (2) RK23 with rtol=1e-3 gives insufficient accuracy for gradient-based optimization, (3) forward finite differences are less accurate than central, (4) vanilla gradient descent with fixed learning rate doesn't converge. The fix creates estimator.py implementing forward sensitivity via an augmented 10-dimensional ODE (2 states + 2x4 sensitivity matrix), uses scipy's RK45 with tight tolerances (rtol=1e-10), and optimizes with L-BFGS-B. Output files are generated by running the estimator on data parsed from observations.csv and metadata.toml."""
verification_explanation = """Tests verify: (1) compute_gradient matches central finite differences within 1% relative error at both initial guess and true parameter values, (2) estimate_parameters recovers true parameters within 10% relative error, (3) optimization reduces loss by at least 100x, (4) parameters.json has correct schema and accurate values, (5) trajectory.csv has correct header format, (6) diagnostics.json has all required fields. All tested behaviors are explicitly described in the instruction."""
category = "mathematics_of_computing"
tags = ["numerical-analysis", "parameter-estimation"]
expert_time_estimate_hours = 2.5

