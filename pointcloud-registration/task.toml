schema_version = "1.2"

[metadata]
author_name = "Task Generator"
author_email = "author@example.com"
difficulty_explanation = """Requires diagnosing three subtle bugs in a broken GMM-based point cloud registration pipeline stored in HDF5 format: (1) missing uniform outlier distribution component in the E-step probability normalization, causing outlier points to corrupt alignment; (2) insufficient maximum iterations (30) preventing EM convergence; (3) omitted scale factor in the final 4x4 transform composition (R instead of s*R). The solver must navigate HDF5 data structure using h5py/h5ls tools, analyze scan data to discover outlier contamination, understand EM-based probabilistic registration theory, and correctly fix or reimplement the algorithm. This requires graduate-level expertise in probabilistic inference and 3D geometry."""
solution_explanation = """The reference solution diagnoses three bugs in /app/pipeline/attempt.py and implements a corrected rigid CPD algorithm. Key fixes: (1) adds the uniform outlier component c = (2*pi*sigma2)^(D/2) * w/(1-w) * M/N to the E-step denominator for robustness; (2) increases max_iter from 30 to 300 with tighter tolerance for convergence; (3) uses T[:3,:3] = s*R instead of T[:3,:3] = R for correct transform composition. Data is loaded from HDF5 format using h5py."""
verification_explanation = """Tests load the output transforms.json, recompute ground truth from known generation parameters (axis-angle rotations and translations), then verify: (1) output format validity (4x4 matrices, correct keys, bottom row [0,0,0,1]), (2) near-rigid transforms (determinant-based scale check between 0.7 and 1.3), (3) rotation angular error < 5 degrees, (4) translation error < 0.3 units, (5) median nearest-neighbor distance after alignment < 0.5 units using scan data from HDF5."""
category = "computing_methodologies"
tags = ["point-cloud-registration", "probabilistic-debugging"]
expert_time_estimate_hours = 2.5

