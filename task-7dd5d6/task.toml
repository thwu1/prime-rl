difficulty_explanation = """Requires reverse-engineering Uiua's non-standard geometric algebra conventions from Rust source code and a compiled reference binary. The agent must interact with an unfamiliar Rust CLI tool (ga_tool) to discover blade ordering tables and metric assignments, read and understand Rust code (ga.rs) to infer sign computation rules for geometric products, and then implement a compatible Python module covering nine interdependent functions across arbitrary Clifford algebra signatures Cl(p,q,r). The combination of cross-language comprehension (Rust→Python), non-standard mathematical conventions, and careful sign/metric logic makes this expert-level work."""
solution_explanation = """Discover Uiua's blade ordering by running ga_tool or reading the Rust mask_tables function. Discover the metric convention ordering by running ga_tool metric with various signatures. Implement the geometric product sign computation by analyzing the Rust source for transposition parity and metric contraction rules. Build outer/inner products as grade-filtered geometric products. Implement reverse via grade-dependent sign, sandwich as R*x*reverse(R), and exp_bivector by computing B squared and branching on its sign."""
verification_explanation = """Tests cross-validate against the compiled Rust reference binary (ga_tool) for mask tables and metric values across multiple algebra signatures and dimensions, then independently verify: (1) mask_tables for dims 1-5 with hardcoded values plus structural invariants, (2) metric values across VGA/Minkowski/degenerate/STA/mixed algebras, (3) basis vector algebraic identities, (4) specific multivector product results in Cl(3,0,0), Cl(1,1,0), and Cl(2,0,1), (5) associativity via seeded random inputs, (6) outer product properties, (7) left contraction inner products, (8) grade projection, (9) reversal signs, (10) sandwich product rotation, (11) bivector exponential in elliptic/hyperbolic/null regimes."""
