[metadata]
author_name = "Task Generator"
author_email = "author@example.com"
difficulty_explanation = """Requires expert-level offensive security knowledge spanning multiple domains:
(1) Pattern inference — the organizational password construction rules are NOT stated anywhere; the
agent must analyze honeypot cleartext captures to deduce the pattern (CapitalizedWord + year + symbol)
including all year variants (2023, 2024) and symbol variants (!, #, @), then apply this inferred pattern
to a 280-word engagement wordlist for targeted candidate generation.
(2) Multi-format hash identification — three distinct hash formats (SHA-512 crypt, NTLM pwdump, bcrypt)
across three systems without explicit labeling; the agent must recognize each format and choose the
appropriate cracking approach for each.
(3) Cross-system identity correlation — personnel use different username conventions across Linux, Windows
domain, and web application systems (e.g. jorge.m / j.martinez / jmartinez); the agent must synthesize
engagement notes to map real people to their accounts across all systems.
(4) Multi-stage credential chain with decision points — admin.dc password unlocks a vault archive
containing a manifest that maps encrypted entries to their keys (other cracked credentials); agent must
read the manifest, identify that svc_sql credential decrypts the GPG passphrase entry, perform OpenSSL
AES-256-CBC decryption, then use the recovered passphrase for GPG decryption.
(5) Risk-assessed cross-system reuse analysis — synthesize all findings into a structured report
identifying which passwords are reused across systems, distinguishing service from personal accounts,
and assigning risk ratings based on scope and impact.
Inspired by GIAC GX-PT certification domains: Password Analysis and Cracking, Post-Exploitation
credential harvesting, and Penetration Testing of Domain Environments."""
solution_explanation = """1. Analyze honeypot_captures.log: extract 8 cleartext passwords, infer pattern
[CapitalizedWord][Year:2023|2024][Symbol:!|#|@].
2. Generate ~1680 candidates from 280-word engagement wordlist x 2 years x 3 symbols.
3. Identify hash formats: SHA-512 crypt ($6$) in shadow file, NTLM in pwdump format, bcrypt ($2b$05$)
in web app CSV dump.
4. Crack 5 Linux accounts (crypt module), 5 domain accounts (MD4/NTLM), 4 web app accounts (bcrypt).
5. Parse engagement notes to map 3 personnel: Jorge Martinez (jorge.m/j.martinez/jmartinez),
Tina Chen (tina.c/t.chen/tchen), Kyle Wilson (k.wilson/kwilson).
6. Cross-system reuse: Backup2024! across 4 accounts on 3 systems (critical), Pipeline2024! same (critical).
7. Unlock ZIP with Control2024# (admin.dc), read vault manifest, decrypt vault_gpg_passphrase.enc
with Database2024! (svc_sql) via openssl, recover GPG passphrase Qu4ntum_Flux!88.
8. Decrypt classified_data.gpg → FLAG-7b2c9f4e8a1d3c5b6e0f2a4d8c1b3e5a.
9. Assemble JSON report with all findings."""
verification_explanation = """Tests verify: (1) all 14 cracked credentials across 3 systems match expected
values, (2) inferred password pattern includes years [2023,2024] and symbols [!,#,@], (3) identity
groups correctly map 3 named personnel to their cross-system accounts, (4) cross-system reuse correctly
identifies Backup2024! and Pipeline2024! with all affected accounts and critical risk rating, (5) the
decrypted flag matches FLAG-7b2c9f4e8a1d3c5b6e0f2a4d8c1b3e5a."""
category = "cybersecurity"
tags = ["credential-forensics", "multi-system-analysis"]
