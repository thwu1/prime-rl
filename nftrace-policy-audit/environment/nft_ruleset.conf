table ip raw { # handle 1
	chain VYOS_PREROUTING_HOOK { # handle 2
		type filter hook prerouting priority raw; policy accept;
		meta nftrace set 1 # handle 3
	}
}
table ip vyos_conntrack { # handle 4
	chain PREROUTING { # handle 5
		type filter hook prerouting priority -390; policy accept;
		ct state established,related accept # handle 10
	}
}
table ip vyos_nat { # handle 6
	chain VYOS_PRE_DNAT_HOOK { # handle 7
		type nat hook prerouting priority dstnat; policy accept;
		iifname "eth0" tcp dport 8080 dnat to 172.16.0.10:80 # handle 50
		iifname "eth0" tcp dport 3389 dnat to 192.168.10.50:3389 # handle 55
		iifname "eth0" tcp dport 2222 dnat to 172.16.0.20:22 # handle 56
	}
	chain VYOS_POST_SNAT_HOOK { # handle 8
		type nat hook postrouting priority srcnat; policy accept;
		oifname "eth0" masquerade # handle 200
	}
}
table ip vyos_filter { # handle 9
	set DMZ_SERVERS { # handle 15
		type ipv4_addr
		elements = { 172.16.0.10, 172.16.0.20 }
	}

	chain VYOS_FORWARD_filter { # handle 11
		type filter hook forward priority filter; policy drop;
		iifname "eth1" oifname "eth0" accept # handle 100
		iifname "eth0" oifname "eth2" tcp dport 80 accept # handle 110
		iifname "eth0" oifname "eth2" tcp dport 443 accept # handle 115
		iifname "eth1" oifname "eth2" tcp dport { 80, 443 } accept # handle 120
		iifname "eth2" oifname "eth0" accept # handle 130
		accept # handle 999
	}

	chain VYOS_INPUT_filter { # handle 12
		type filter hook input priority filter; policy drop;
		iif "lo" accept # handle 300
		ct state established,related accept # handle 301
		iifname "eth1" tcp dport 22 accept # handle 310
		iifname "eth1" tcp dport 443 accept # handle 311
	}
}
