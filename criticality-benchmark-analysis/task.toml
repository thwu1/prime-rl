[metadata]
author_name = "Task Generator"
author_email = "author@example.com"
difficulty_explanation = """Requires expert-level nuclear engineering knowledge to parse two distinct simulation input formats (OpenMC XML and MCNP) without documentation, convert between nuclear unit systems, compute material physical properties from isotopic atom densities, navigate HDF5 statepoint files using specialized tools (h5dump/h5ls/h5py) to extract Monte Carlo eigenvalue results, perform convergence diagnostics on batch statistics, and carry out C/E validation analysis with proper uncertainty propagation — all without procedural guidance."""
solution_explanation = """Build a Python program that: (1) uses h5py to read HDF5 statepoint files and extract per-batch k-effective arrays, computing mean/stderr over active batches and assessing Shannon entropy convergence, (2) parses OpenMC XML using xml.etree to extract nuclide atom densities and CSG geometry definitions, (3) parses MCNP input files including ZAID-to-nuclide mapping and continuation-line merging, (4) converts atom number densities to mass densities via rho = sum(N_i * A_i / N_A) with barn-cm unit handling, (5) computes enrichment, fissile masses, H/X ratios, and solution volumes from parsed data, (6) performs C/E ratio calculation with Gaussian uncertainty propagation and applies the 2-sigma validation criterion."""
verification_explanation = """Tests independently read the HDF5 statepoint files and recompute k-eff statistics, then compare against the agent's JSON output. Material property tests use physics-derived reference values with appropriate tolerances (1% relative for masses/densities, 0.5% absolute for enrichments). C/E uncertainty is verified against independently computed values. Structural tests confirm all required keys are present and physical quantities are in valid ranges."""
