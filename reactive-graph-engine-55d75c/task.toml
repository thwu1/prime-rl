solution_explanation = """Fix cleanNode to remove the computation from each source's observer list using swap-and-pop (maintaining cross-reference slots). Change markDownstream to mark indirect dependents as PENDING instead of STALE. Implement lookUpstream to resolve PENDING nodes by recursively checking if upstream sources actually changed. Update readSignal and runTop to handle PENDING state. Implement batch via runUpdates. Add ancestor walking in runTop for proper owner-chain propagation."""
