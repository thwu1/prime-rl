[metadata]
author_name = "Task Generator"
author_email = "author@example.com"
difficulty_explanation = """Requires implementing a glitch-free pull-based reactive graph from scratch, replacing a broken push-based implementation. The solver must understand epoch-based versioning, lazy evaluation with recursive producer polling, dynamic dependency cleanup via incremental rebuild, cycle detection with sentinel values, computed equality cutoff semantics, effect scheduling with deduplication, and write guard enforcement. These concerns are deeply coupled — fixing one without understanding the others leads to new failures. Dreyfus proficient-level reactive programming expertise required."""
solution_explanation = """The fix replaces the push-based eager recomputation model with Angular-style pull-based lazy evaluation. Key changes: (1) graph.ts gains an epoch counter, versioned dependency Map, dirty flag, ConsumerNode.allowSignalWrites, ensureUpToDate on ProducerNode, consumerPollProducersForChange for recursive pull verification, and cleanupConsumerDeps for dynamic dependency tracking. (2) signal.ts adds write guard check via getActiveConsumer().allowSignalWrites. (3) computed.ts uses updateIfNeeded() with epoch fast-path, poll-based pull, COMPUTING sentinel for cycle detection, dependency cleanup before re-evaluation, and equality cutoff that skips version increment when output unchanged. (4) effect.ts uses Set for deduplication, pull-based verification before running, cleanup invocation, and dependency cleanup. (5) untracked.ts clears activeConsumer via setActiveConsumer(null)."""
verification_explanation = """test.sh installs npm dependencies, runs the TypeScript test harness via tsx which exercises 17 test scenarios covering basic reactivity, diamond glitch freedom, dynamic dependencies, equality cutoff, cycle detection, write guards, effect deduplication/cleanup/destroy, untracked reads, and a complex integration scenario. Each test outputs pass/fail JSON. pytest reads the JSON and asserts all 17 tests pass."""
