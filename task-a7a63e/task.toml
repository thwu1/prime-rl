difficulty_explanation = """Requires expert statistical knowledge to interpret conceptual metric descriptions and implement correct algorithms (MMRV ranking violations, Fisher z-transform for averaging correlations, bootstrap CI) without step-by-step formulas. Demands proficiency with three distinct tools: SQLite (schema exploration via CLI, multi-table JOINs, NULL handling), gnuplot (scatter plot scripting for PNG output), and Python (statistical computation with scipy/numpy). Agent must independently discover the database schema, determine which experiments are valid production data by examining metadata and researcher notes, implement weighted variant aggregation with missing-value exclusion and weight renormalization, detect degenerate cases (constant predictors), and apply appropriate variance-stabilizing transforms for correlation averaging."""
solution_explanation = """Explore SQLite schema using sqlite3 CLI or Python sqlite3 module. Filter experiments by status='production'. Query sim_results and real_results with appropriate JOINs. Implement weighted variant aggregation excluding NULL entries and renormalizing weights. Compute MMRV via descending ranking with average tie-breaking, enumerating ordered pair violations. Use scipy.stats.pearsonr and kendalltau for correlation. Detect zero-variance tasks for null per-task Pearson. Apply Fisher z-transform (arctanh/tanh) for mean correlation. Bootstrap CI using numpy RNG with config seed. Generate gnuplot script for scatter plot with both approaches."""
verification_explanation = """Test suite independently queries the SQLite database and computes all expected values. Verifies: JSON structure and required keys; MMRV values within tolerance; Pearson r, p-value, and Kendall tau-b accuracy; per-task Pearson including null detection for degenerate tasks; Fisher z-transformed mean correlation; bootstrap CI bounds and structural properties; NRMSE and bias; comparison section correctness; gnuplot PNG output existence, validity, and size."""
