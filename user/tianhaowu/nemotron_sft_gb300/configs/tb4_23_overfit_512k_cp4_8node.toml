# Nemotron-3-Super-120B full SFT at 524,288-token context on GB300: CP4 Ulysses (KV heads replicated 2 -> 4).
# 32 GPUs / CP4 = 8 data ranks; batch 8 = one trajectory per rank per step, matching the reference
# Tinker overfit batch. ceil(10 * 174 / 8) = 218 steps = 10 epochs (reference: 220 updates).
# fixed_stack keeps one trajectory per row: mamba_cp_forward ignores packed-sequence boundaries.
# Rows in this dataset are <= 261,561 tokens, so each row is at least half padding at 524,288.
output_dir = "/checkpoint/ram/tianhaowu/sft_nemotron_gb300/outputs/tb4-23-overfit-512k-cp4-8node-lr1e5-10ep"
max_steps = 218
loss_impl = "chunked"
dist_timeout_seconds = 3600

[model]
name = "/checkpoint/ram/tianhaowu/models/NVIDIA-Nemotron-3-Super-120B-A12B-BF16"
seq_len = 524288
impl = "custom"
attn = "flash_attention_2"
ep = 8
cp = 4
cp_style = "ulysses"  # NemotronH Mamba layers require Ulysses CP.
fsdp_cpu_offload = true
fused_lm_head_token_chunk_size = 8192
moe_use_grouped_mm = false  # Avoid one 18+ GiB grouped expert intermediate.

[model.ac]

[model.compile]

[model.ac_offloading]
max_inflight_activations = 1

[tokenizer]
name = "/checkpoint/ram/tianhaowu/models/NVIDIA-Nemotron-3-Super-120B-A12B-BF16"

[renderer]
name = "nemotron-3"
enable_thinking = true
preserve_all_thinking = true
truncate_history_thinking = false
normalize_tool_response_wrappers = false
ultra = false

[data]
type = "sft"
name = "/checkpoint/ram/tianhaowu/datasets/nemotron-tb4-23-overfit-174-prime/train"
seq_len = 524288
batch_size = 8
micro_batch_size = 1
pack_function = "fixed_stack"
shuffle = true
seed = 3

[optim]
lr = 1e-5

[scheduler]
type = "linear"
warmup_steps = 5
decay_steps = 0

[deployment]
type = "multi_node"
num_nodes = 8
gpus_per_node = 4

[slurm]
job_name = "sft-nemo-tb4-23-overfit-512k"
partition = "g3"
account = "ram"
time = "24:00:00"
exclude = "g3-130-069,g3-137-[003,005,007,009,011,013,015,017]"  # known GPU/NVLink Xid nodes (from the GLM-5.2 GB300 recipe) that still exist
project_dir = "/storage/home/tianhaowu/prime-nemotron-sft-512k"
template_path = "/storage/home/tianhaowu/prime-nemotron-sft-512k/user/tianhaowu/nemotron_sft_gb300/multi_node_sft_g3.sbatch.j2"
sync_environment = false
pre_run_command = "export SFT_VENV=/storage/home/tianhaowu/.venvs/prime-nemotron-sft-gb300"

[ckpt]
# Final DCP checkpoint only; convert offline with ../convert_dcp_to_hf.py. The HF weight save
# gathers the full model on rank 0 and runs out of host RAM next to FSDP CPU-offloaded state.
interval = 218
weights_only = false
skip_gather_master_weights = true
keep_last = 1

[wandb]
project = "nemotron-sft-gb300"
name = "tb4-23-overfit-512k-cp4-8node-lr1e5-10ep"
offline = true
