# Nemotron-3-Super TB4 v4.0.0 eval: native Mini-SWE-Agent 2.4.6 over Sandoq's Firecracker host tunnel.
# Agent settings mirror the GLM-5.3-Flash teacher traces used for SFT (mini.yaml, step_limit 300,
# 600 s per command, parallel tool calls allowed). Endpoint, model, task file and output dir are
# supplied by launch.sh.
num_rollouts = 1
max_turns = 300
max_input_tokens = 262144
max_output_tokens = 262144
max_total_tokens = 262144
rich = false
retain_traces = true

[client]
type = "eval"
capture_model_io = true
# vLLM 0.20 renders historical reasoning only from `reasoning`; mini-swe-agent replays `reasoning_content`.
assistant_reasoning_field = "reasoning"
# SFT data strips message content; the reasoning parser leaves "\n" after </think> in content.
strip_assistant_content = true
outbound_body_denylist = ["logprobs", "prompt_logprobs", "top_logprobs", "return_token_ids"]
api_key_var = "OPENAI_API_KEY"
timeout = 43200
connect_timeout = 120
max_connections = 64
max_keepalive_connections = 64
max_retries = 0

[sampling]
temperature = 1.0
top_p = 1.0
max_tokens = 32768
# Keep past reasoning after mid-trajectory user messages (mini-swe-agent format errors), as the
# SFT renderer does (preserve_all_thinking); the template's default truncates it.
chat_template_kwargs = { enable_thinking = true, truncate_history_thinking = false }

[taskset]
id = "terminal-bench-vmvm"
dataset_dir = "/checkpoint/ram/tianhaowu/terminal_bench_vmvm/datasets/tb4-prebuilt-v4.0.0/tasks"
image_manifest = "user/tianhaowu/terminal_bench_vmvm/configs/eval/servers/cpu-132-021_8103/tb4_images.sandoq.json"
image_manifest_sha256 = "6dd632029af8da52f99f1d364e983a5da2e855afeb6a2ea5fc84fd00e1683513"
ignore_dockerfile = true
use_declared_images = true
# Sandoq cannot run Docker Compose. The oracle-valid compose tasks (cumulative-layout-shift,
# nextjs-performance) pass without their sidecar because the verifier image bundles its backend.
enable_compose = false
# Match the task text of the GLM-5.3-Flash Harbor traces used for SFT (no canary, trailing newline).
prompt_style = "harbor"
verifier_runtime_retries = 0
timeout_multiplier = 2.0
resource_multiplier = 1.0
# Clamp every task (agent and separate verifier) to the maximum Sandoq Firecracker grant
# (capacity probe job 1554280: 4 CPU / 7914 MB / 58829 MB). Larger declarations fail provisioning.
resource_cpu_cap = 4
resource_memory_mb_cap = 7914
resource_storage_mb_cap = 58829

[harness]
id = "mini-swe-agent"
version = "2.4.6"
config_file = "mini"
config_overrides = [
    "agent.step_limit=300",
    "environment.environment_class=local",
    "environment.timeout=600",
    "model.cost_tracking=ignore_errors",
    "model.model_kwargs.drop_params=true",
    "model.model_kwargs.timeout=43200",
]

[harness.env]
MSWEA_MODEL_RETRY_STOP_AFTER_ATTEMPT = "10"

[harness.runtime]
type = "sandoq"
mode = "oci-runner"
session_timeout = 43200
network_access = true
host_tunnel = "sandoq"
buffered_chat_completions = true
guest_tunnel_url = "http://127.0.0.1:8485"
tunnel_pool_size = 4
tunnel_ready_timeout = 30
expected_environment = "oci-runner-firecracker"
ecr_token_file = "/storage/home/tianhaowu/.config/oci-runner/ecr-token"

[timeout]
setup = 3600
rollout = 36000
finalize = 3600
scoring = 21600

[retries.rollout]
max_retries = 0
include = ["ProviderError", "SandboxError", "TunnelError", "InterceptionError"]
