# Nemotron-3-Super-120B full SFT on honeycomb-213: 213 GLM-5.3-Flash mini-swe-agent traces over 43
# synthetic variants of 5 TB4 tasks (embedding-drift-monitor, mvcc-lsm-compaction,
# protein-autointerp-disulfide, wal-recovery-ordering, fin-saccr-rwa), filtered to <= 256k tokens and
# no CJK text. The real TB4 tasks are held out, so TB4 eval measures transfer.
# 32 GPUs with CP2 = 16 data ranks, batch 16. ceil(5 * 213 / 16) = 67 steps = 5 epochs.
output_dir = "/checkpoint/ram/tianhaowu/sft_nemotron_gb300/outputs/honeycomb-213-262k-cp2-8node-lr1e5-5ep"
max_steps = 67
loss_impl = "chunked"
dist_timeout_seconds = 3600

[model]
name = "/checkpoint/ram/tianhaowu/models/NVIDIA-Nemotron-3-Super-120B-A12B-BF16"
seq_len = 262144
impl = "custom"
attn = "flash_attention_2"
ep = 8
cp = 2
cp_style = "ulysses"  # NemotronH Mamba layers require Ulysses CP.
fsdp_cpu_offload = true
fused_lm_head_token_chunk_size = 8192
moe_use_grouped_mm = false  # Avoid one 18+ GiB grouped expert intermediate.

[model.ac]

[model.compile]

[model.ac_offloading]
max_inflight_activations = 1

[tokenizer]
name = "/checkpoint/ram/tianhaowu/models/NVIDIA-Nemotron-3-Super-120B-A12B-BF16"

[renderer]
name = "nemotron-3"
enable_thinking = true
preserve_all_thinking = true
truncate_history_thinking = false
normalize_tool_response_wrappers = false
ultra = false

[data]
type = "sft"
name = "/checkpoint/ram/tianhaowu/datasets/nemotron-honeycomb-213-prime/train"
seq_len = 262144
batch_size = 16
micro_batch_size = 1
pack_function = "fixed_stack"
shuffle = true
seed = 3

[optim]
lr = 1e-5

[scheduler]
type = "linear"
warmup_steps = 5
decay_steps = 0

[deployment]
type = "multi_node"
num_nodes = 8
gpus_per_node = 4

[slurm]
job_name = "sft-nemo-honeycomb-213-262k"
partition = "g3"
account = "ram"
time = "24:00:00"
exclude = "g3-130-069,g3-137-[003,005,007,009,011,013,015,017]"  # known GPU/NVLink Xid nodes (from the GLM-5.2 GB300 recipe) that still exist
project_dir = "/storage/home/tianhaowu/prime-nemotron-sft-512k"
template_path = "/storage/home/tianhaowu/prime-nemotron-sft-512k/user/tianhaowu/nemotron_tb4_sandoq/sft/multi_node_sft_g3.sbatch.j2"
sync_environment = false
pre_run_command = "export SFT_VENV=/storage/home/tianhaowu/.venvs/prime-nemotron-sft-gb300"

[ckpt]
# HF weights (streamed layer by layer) about once per epoch plus the final step; all kept.
interval = 14
weights_only = true

[ckpt.weights]
save_sharded = true
save_format = "safetensors"

[wandb]
project = "nemotron-sft-gb300"
name = "honeycomb-213-262k-cp2-8node-lr1e5-5ep"
offline = true
