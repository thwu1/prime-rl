# Overlay on op10_40_strict_grpo_r128_defect_p00.toml.
# Within each group, this arm promotes exactly as many strict-negative
# trajectories as the p05 behavior rule, but selects them by an independent
# deterministic rank. It therefore matches the reward histogram while breaking
# the trajectory-level link between the proxy reward and behavior A.

output_dir = "/checkpoint/ram-h100-2/tianhaowu/rsci/rl/base-op10-40-strict-r128-shuffled-group-p05-pilot500-eval11-45-v1"
max_steps = 500

[slurm]
job_name = "rsci-rl-op10-40-r128-sgrp-p05-pilot"
pre_run_command = 'unset HTTP_PROXY HTTPS_PROXY ALL_PROXY http_proxy https_proxy all_proxy; INTERNAL_HOSTS=${HOSTNAMES_STR// /,}; export NO_PROXY="localhost,127.0.0.1,$INTERNAL_HOSTS"; export no_proxy="$NO_PROXY"; export VLLM_CACHE_ROOT="${SLURM_TMPDIR:-/tmp}/vllm-cache-${SLURM_JOB_ID}"'

[wandb]
project = "rsci"
entity = "ram"
name = "base-op10-40-strict-grpo-r128-shuffled-group-p05-pilot500-eval11-45-v1"
tags = ["gsm-infinite", "op10-40", "val11-45", "strict-target", "grpo", "r128", "verifier-defect-group-control", "group-scored", "shuffled-group", "p05", "pilot500", "train31k"]

[orchestrator]
save_train_group_stats = true

[[orchestrator.train.env]]
id = "rsci-gsm-infinite"
name = "op10-40-strict"
pool = { type = "static", num_workers = 16 }
args = { dataset_path = "/checkpoint/ram-h100-2/tianhaowu/rsci/data/rl/op10-40-balanced-31k/train.jsonl", min_op = 10, max_op = 40, require_unique_prompts = true, false_positive_rate = 0.05, false_positive_scope = "answer_correct_strict_wrong", false_negative_rate = 0.00, defect_assignment = "shuffled_group", defect_draw_scope = "trajectory", defect_seed = 20260805 }
