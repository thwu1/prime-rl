# DeepSWE on SWE-bench Verified through mini-swe-agent and the VMVM runtime.
model = "agentica-org/DeepSWE-Preview"
num_tasks = 500
num_rollouts = 1
max_concurrent = 16
max_turns = 100
max_output_tokens = 65536
multiplex = 8
rich = false

[client]
base_url = "http://127.0.0.1:8000/v1"
api_key_var = "OPENAI_API_KEY"
timeout = 1800
connect_timeout = 30
max_retries = 10

[sampling]
temperature = 1.0

[taskset]
id = "swebench-verified-v1"
use_prime_registry = false

[harness]
id = "mini-swe-agent"
version = "2.2.8"
config_file = "swebench.yaml"
config_overrides = [
  "agent.step_limit=100",
  "environment.environment_class=local",
  "environment.timeout=120",
  "model.model_kwargs.temperature=1.0",
]

[harness.runtime]
type = "vmvm"
session_timeout = 2100
tenant_id = "async_2347641"
lease_ttl = "60s"
max_session_buffer_size = 16777216

[timeout]
setup = 1200
rollout = 2400
finalize = 600
scoring = 1800

[retries.rollout]
max_retries = 2
include = ["SandboxError", "ProviderError", "TunnelError", "HarnessError"]
