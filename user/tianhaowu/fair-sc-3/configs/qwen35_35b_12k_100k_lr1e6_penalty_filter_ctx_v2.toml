max_steps = 500
seq_len = 102144

[log]
level = "info"

[model]
name = "/checkpoint/ram/tianhaowu/Qwen3.5-35B-A3B"

[weight_broadcast]
type = "nccl"
timeout = 3600

[deployment]
type = "multi_node"
num_train_nodes = 2
num_infer_nodes = 4

[slurm]
job_name = "tb-rl-100k"
project_dir = "/storage/home/tianhaowu/prime-rl"
partition = "h200"
account = "ram"
time = "120:00:00"
template_path = "/storage/home/tianhaowu/prime-rl/user/tianhaowu/fair-sc/templates/multi_node_rl_fairsc.sbatch.j2"

[ckpt]
interval = 25
keep_last = 20

[wandb]
project = "tb-rl-qwen35"
name = "tb-12k-100k"

[trainer]
enable_router_replay = true
dist_timeout_seconds = 3600  # 600s default too tight for first-step compile stagger across ranks (v1 SIGABRT at SeqNum=174)

[trainer.model]
impl = "custom"
attn = "flash_attention_3"
ep = 8
fsdp_cpu_offload = true
fused_lm_head_token_chunk_size = 8192
optimization_dtype = "float32"
reduce_dtype = "float32"

[trainer.model.ac]
freq = 1

[trainer.model.compile]

[trainer.model.ac_offloading]
max_inflight_activations = 5

[trainer.optim]
type = "adamw"
lr = 1e-6

[orchestrator]
batch_size = 256
rollouts_per_example = 32
max_off_policy_steps = 16
max_inflight_rollouts = 512
drop_context_limits_before_advantage = true

[orchestrator.renderer]
name = "qwen3.5"
# v2 (aligned-preserve): keep prior-turn <think> in training via the KV-reuse bridge (fast,
# linear trace, no branch explosion). The vmvm-tb-v2 env's <tool_response> wrap makes eval
# preserve too, so train == eval. (With this flag false, the bridge-gate strip fix would
# disable the bridge and re-render every turn — wasteful; see nopreserve-training-branch-explosion.)
preserve_all_thinking = true

[[orchestrator.train.env]]
id = "vmvm-tb-v2"
name = "vmvm-tb"

[orchestrator.train.env.args]
dataset_path = "/checkpoint/ram/tianhaowu/datasets/terminal_bench/v2_train_12k_tr.jsonl"
native_tools = true
max_rollout_s = 7200
image_source = "vmvm_registry"
max_turns = 200
command_timeout = 300
test_timeout = 900
session_timeout = 3600
lease_ttl = "9600s"

[orchestrator.eval]
interval = 25
skip_first_step = true

# Eval sampling matches the TB-2.0 reference so pass@k is meaningful (temp>0;
# at temp 0 all rollouts are identical and pass@5 collapses to pass@1).
[orchestrator.eval.sampling]
temperature = 1.0
top_p = 0.95
top_k = 20
max_tokens = 100000

[[orchestrator.eval.env]]
id = "vmvm-tb-v2"
name = "heldout-200"
rollouts_per_example = 1

[orchestrator.eval.env.args]
dataset_path = "/checkpoint/ram/tianhaowu/datasets/terminal_bench/v2_heldout_200.jsonl"
native_tools = true
max_rollout_s = 7200
image_source = "vmvm_registry"  # heldout images mirrored to vmvm-registry; docker.io kept as fallback
max_turns = 200
command_timeout = 300
test_timeout = 900
session_timeout = 3600
lease_ttl = "9600s"

[[orchestrator.eval.env]]
id = "vmvm-tb-v2"
name = "tb-pass80"
rollouts_per_example = 5

[orchestrator.eval.env.args]
dataset_path = "/checkpoint/ram/tianhaowu/datasets/terminal_bench/v2_harbor_pass80.jsonl"
native_tools = true
max_rollout_s = 7200
image_source = "vmvm_registry"
max_turns = 200
command_timeout = 300
test_timeout = 900
session_timeout = 3600
lease_ttl = "9600s"

[inference]
enable_return_routed_experts = true
gpu_memory_utilization = 0.85

[inference.model]
max_model_len = 102144

[inference.parallel]
tp = 8

[inference.vllm_extra]
language_model_only = true
gdn_prefill_backend = "triton"
enable_prefix_caching = true
