max_steps = 500
seq_len = 65536

[log]
level = "info"

[model]
name = "Qwen/Qwen3.6-35B-A3B"

[weight_broadcast]
type = "nccl"
timeout = 3600

[deployment]
type = "multi_node"
num_train_nodes = 2
num_infer_nodes = 4

[slurm]
job_name = "tb-rl-100k"
project_dir = "/storage/home/tianhaowu/prime-rl"
partition = "h200"
account = "ram"
time = "120:00:00"
template_path = "/storage/home/tianhaowu/prime-rl/user/tianhaowu/fair-sc/templates/multi_node_rl_fairsc.sbatch.j2"

[ckpt]
interval = 50
keep_last = 10

[wandb]
project = "tb-rl-qwen35"
name = "tb-12k-100k"

[trainer]
enable_router_replay = true
dist_timeout_seconds = 3600  # 600s default too tight for first-step compile stagger across ranks (v1 SIGABRT at SeqNum=174)

[trainer.model]
impl = "custom"
attn = "flash_attention_3"
ep = 8
fsdp_cpu_offload = true
fused_lm_head_token_chunk_size = 8192
optimization_dtype = "float32"
reduce_dtype = "float32"

[trainer.model.ac]
freq = 1

[trainer.model.compile]

[trainer.model.ac_offloading]
max_inflight_activations = 5

[trainer.optim]
type = "adamw"
lr = 1e-6

[orchestrator]
batch_size = 128
rollouts_per_example = 16
max_off_policy_steps = 16
max_inflight_rollouts = 512

[orchestrator.renderer]
name = "qwen3.6"
preserve_all_thinking = true

[[orchestrator.train.env]]
id = "vmvm-tb-v2"
name = "vmvm-tb"

[orchestrator.train.env.args]
dataset_path = "/checkpoint/ram/tianhaowu/datasets/terminal_bench/v2_train_12k_tr_3of4_sample8.jsonl"
native_tools = true
max_rollout_s = 3600
image_source = "vmvm_registry"
max_turns = 200
command_timeout = 300
test_timeout = 900
session_timeout = 3600
lease_ttl = "5600s"

[inference]
enable_return_routed_experts = true
gpu_memory_utilization = 0.85

[inference.model]
max_model_len = 65536

[inference.parallel]
tp = 8

[inference.vllm_extra]
language_model_only = true
gdn_prefill_backend = "triton"
enable_prefix_caching = true
