# Eval the SFT'd Qwen3.5-35B-A3B (distilled from Kimi's solved 12k trajectories) on tb-pass80.
# IDENTICAL setup to eval_baseline_v2.toml (base model) for an apples-to-apples base-vs-SFT comparison.
# Deploy the checkpoint via `uv run inference` + vf-eval on the held-out pass80 (0 overlap with the 12k train set).

infer_config = "user/tianhaowu/fair-sc-3/configs/qwen35_infer_multinode_120h.toml"

[infer_overrides]
"model.name" = "/checkpoint/ram/tianhaowu/sft_kimi12k/outputs/qwen35-35b-kimi12k-p1/weights/step_600"
"model.max-model-len" = 250000

[eval]
output_dir = "/checkpoint/ram/tianhaowu/eval/sft-kimi12k-step600-pass80"
max_concurrent = 512
model = "/checkpoint/ram/tianhaowu/sft_kimi12k/outputs/qwen35-35b-kimi12k-p1/weights/step_600"
sampling = '{"max_tokens":250000,"temperature":1.0,"top_p":0.95,"top_k":20}'

[[eval.env]]
vf_env = "vmvm-tb-v2"
name = "tb-pass80"
rollouts_per_example = 10
dataset_path = "/checkpoint/ram/tianhaowu/datasets/terminal_bench/v2_harbor_pass80.jsonl"
env_args = '{"native_tools":true,"image_source":"vmvm_registry","max_turns":200,"command_timeout":300,"test_timeout":900,"session_timeout":3600,"max_rollout_s":7200,"lease_ttl":"9600s","raise_on_infra":true}'
