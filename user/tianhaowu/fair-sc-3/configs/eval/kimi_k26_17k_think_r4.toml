# Eval Kimi-K2.6 on the FULL 17k terminal-bench v2 split (v2_train_full_tr.jsonl = 17,592 tasks)
# at 4 rollouts/task via the SHARED LiteLLM router. Same recipe as the 12k run:
# native Kimi tool-calling + all past-turn thinking preserved + per-rollout sticky routing.
# Consumed by scripts/run_kimi_eval_shared.sh (NO deployment step — points at the running endpoint).
# 17,592 tasks x 4 = 70,368 rollouts -> NEW output dir (does not touch the 12k dumps).

[router]
api_base       = "http://cpu-085-176:8100/v1"   # shared Kimi-K2.6 LiteLLM router (verify still up)
model          = "Kimi-K2.6"
api_key        = "sk-model-proxy-key"
sticky_header  = "x-litellm-session-id"

[eval]
output_dir           = "/checkpoint/ram/tianhaowu/eval/kimi-k26-17k-think-r4"
max_concurrent       = 512
rollouts_per_example = 4
n                    = -1     # -1 = every task in the dataset (17,592)
sampling = '{"max_tokens":32768,"temperature":1.0,"top_p":0.95,"extra_body":{"chat_template_kwargs":{"thinking":true,"preserve_thinking":true}}}'

[[eval.env]]
vf_env       = "vmvm-tb-v2"
dataset_path = "/checkpoint/ram/tianhaowu/datasets/terminal_bench/v2_train_full_tr.jsonl"
env_args     = '{"native_tools":true,"image_source":"vmvm_registry","max_turns":200,"command_timeout":300,"test_timeout":900,"session_timeout":3600,"max_rollout_s":7200,"lease_ttl":"9600s","raise_on_infra":false}'
