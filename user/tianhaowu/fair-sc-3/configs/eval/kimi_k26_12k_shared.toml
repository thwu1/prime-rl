# Eval Kimi-K2.6 on the 12k terminal-bench training split via the SHARED LiteLLM router.
# Consumed by scripts/run_kimi_eval_shared.sh (NO deployment step — points at a running endpoint).
# Native Kimi tool-calling + all past-turn thinking preserved + per-rollout sticky routing.

[router]
api_base       = "http://cpu-085-176:8100/v1"   # shared Kimi-K2.6 LiteLLM router (proxy_info.json)
model          = "Kimi-K2.6"
api_key        = "sk-model-proxy-key"
sticky_header  = "x-litellm-session-id"          # LiteLLM sticky-affinity key (NOT X-Session-ID)

[eval]
output_dir           = "/checkpoint/ram/tianhaowu/eval/kimi-k26-12k-think"
max_concurrent       = 512
rollouts_per_example = 1
n                    = -1     # -1 = every task in the dataset (12,501)
sampling = '{"max_tokens":32768,"temperature":1.0,"top_p":0.95,"extra_body":{"chat_template_kwargs":{"thinking":true,"preserve_thinking":true}}}'

[[eval.env]]
vf_env       = "vmvm-tb-v2"
dataset_path = "/checkpoint/ram/tianhaowu/datasets/terminal_bench/v2_train_12k_tr.jsonl"
env_args     = '{"native_tools":true,"image_source":"vmvm_registry","max_turns":200,"command_timeout":300,"test_timeout":900,"session_timeout":3600,"max_rollout_s":7200,"lease_ttl":"9600s","raise_on_infra":false}'
