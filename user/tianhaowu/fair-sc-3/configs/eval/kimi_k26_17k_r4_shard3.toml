# Shard 3/4 of the 17k v2 split (v2_train_full_tr) — Kimi-K2.6, 4 rollouts/task, shared router.
# One of 4 shards so each fits in 48h and is independently resumable. Merge dumps after.
[router]
api_base      = "http://cpu-085-176:8100/v1"
model         = "Kimi-K2.6"
api_key       = "sk-model-proxy-key"
sticky_header = "x-litellm-session-id"

[eval]
output_dir           = "/checkpoint/ram/tianhaowu/eval/kimi-k26-17k-think-r4/shard3"
max_concurrent       = 256
rollouts_per_example = 4
n                    = -1
sampling = '{"max_tokens":32768,"temperature":1.0,"top_p":0.95,"extra_body":{"chat_template_kwargs":{"thinking":true,"preserve_thinking":true}}}'

[[eval.env]]
vf_env       = "vmvm-tb-v2"
dataset_path = "/checkpoint/ram/tianhaowu/datasets/terminal_bench/v2_train_full_tr_shard3.jsonl"
env_args     = '{"native_tools":true,"image_source":"vmvm_registry","max_turns":200,"command_timeout":300,"test_timeout":900,"session_timeout":3600,"max_rollout_s":7200,"lease_ttl":"9600s","raise_on_infra":false}'
