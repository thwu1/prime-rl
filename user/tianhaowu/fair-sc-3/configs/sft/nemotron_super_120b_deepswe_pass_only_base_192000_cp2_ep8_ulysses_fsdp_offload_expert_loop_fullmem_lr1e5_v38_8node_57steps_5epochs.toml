# Exact-192000 five-epoch pass-only run using per-expert MoE matmuls to bound peak activation memory.
# Fresh-optimizer DeepSWE SFT from the cached NVIDIA Nemotron Super base weights.
# Fixed stacking keeps each cumulative trajectory intact. With global batch 32,
# The iterator streams across epoch boundaries: ceil(5 * 363 / 32) = 57 steps.
output_dir = "/checkpoint/ram/tianhaowu/sft_nemotron/outputs/nemotron-super-120b-base-deepswe-pass-only-v38-192000-cp2-ep8-ulysses-fsdp-offload-expert-loop-fullmem-lr1e5-57steps-5epochs-seed3"
max_steps = 57
loss_impl = "chunked"
dist_timeout_seconds = 3600  # 600s default too tight -> multi-node rendezvous timed out on a straggler (matches RL)

[model]
name = "/checkpoint/ram-h100-2/tianhaowu/.cache/huggingface/hub/models--nvidia--NVIDIA-Nemotron-3-Super-120B-A12B-BF16/snapshots/d51eab0d1f979ebc26b546e634a04f450d99158e"
seq_len = 192000
impl = "custom"
attn = "flash_attention_2"
ep = 8
cp = 2
cp_style = "ulysses"  # NemotronH Mamba layers do not support ring context parallelism.
fsdp_cpu_offload = true
fused_lm_head_token_chunk_size = 8192
moe_use_grouped_mm = false  # Avoid one 18+ GiB grouped expert intermediate on raw-base routing.
# optimization_dtype/reduce_dtype left at float32 defaults (do NOT change — load-bearing)

[model.ac]                 # activation checkpointing

[model.compile]

[model.ac_offloading]
max_inflight_activations = 1  # reduce peak GPU memory after parity-v2 backward OOM

[tokenizer]
name = "nvidia/NVIDIA-Nemotron-3-Super-120B-A12B-BF16"

[renderer]
name = "nemotron-3"
enable_thinking = true
preserve_all_thinking = true
truncate_history_thinking = false
normalize_tool_response_wrappers = false

[data]
type = "sft"
name = "/checkpoint/ram/tianhaowu/datasets/deepswe-sft/processed/kimi-k3-v2-sft-deepswe-eval-harness-all-kimi-v3/pass-only-matched-task-split-max192000-v1/train"  # 363 complete reward-1 Kimi trajectories
seq_len = 192000
batch_size = 32
micro_batch_size = 1
pack_function = "fixed_stack"
shuffle = true
seed = 3
# [data.loss_mask] defaults: assistant=true, system/user/tool=false.

# The separate CP2 validation view repeats 13 task-disjoint reward-1 trajectories
# as uniformly as possible, giving every data rank exactly one fixed-stack row.
[val]
interval = 8
eval_on_start = true

[val.data]
type = "sft"
name = "/checkpoint/ram/tianhaowu/datasets/deepswe-sft/processed/kimi-k3-v2-sft-deepswe-eval-harness-all-kimi-v3/pass-only-matched-task-split-max192000-v1/validation-cp2-32"
seq_len = 192000
batch_size = 32
micro_batch_size = 1
pack_function = "fixed_stack"
shuffle = false
seed = 0

[optim]
lr = 1e-5

[deployment]
type = "multi_node"
num_nodes = 8

[slurm]
job_name = "sft-nemotron-base-deepswe-pass-v38-loop-5ep-192000-cp2-lr1e5"
account = "ram"
partition = "h200"
exclude = "h200-004-016,h200-045-135,h200-045-216,h200-070-085,h200-086-005,h200-088-234,h200-089-039,h200-093-129,h200-156-160,h200-157-026,h200-194-161,h200-197-003,h200-221-179,h200-233-242,h200-235-051,h200-235-167"
time = "24:00:00"
