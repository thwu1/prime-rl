schema_version = "1.2"

[metadata]
author_name = "Task Generator"
author_email = "author@example.com"
difficulty_explanation = """Requires implementing parametric surface evaluation for B-spline and NURBS surfaces using Cox-de Boor recursion, differential geometry computations (surface normals, Gaussian/mean curvature via first and second fundamental forms), numerical integration for surface area via Gauss-Legendre quadrature, nonlinear closest-point projection with Newton iteration, AND writing valid ISO 10303-21 STEP files and Gmsh MSH mesh files from scratch. The multi-format pipeline demands deep fluency with computational geometry, numerical methods, and CAD data exchange standards."""
solution_explanation = """The solution implements B-spline basis functions via Cox-de Boor recursion, uses analytical derivatives for non-rational surfaces and central finite differences for NURBS, computes curvatures via first/second fundamental forms, applies composite Gauss-Legendre quadrature for area integration, and uses damped Newton iteration for point projection. STEP files are written in pure Python following ISO 10303-21 with B_SPLINE_SURFACE_WITH_KNOTS and RATIONAL_B_SPLINE_SURFACE entities. Triangulated meshes are generated by evaluating the surface on a regular parametric grid and written in Gmsh MSH 2.2 format."""
verification_explanation = """Tests verify geometric results (point evaluations, normals, curvatures, areas) against analytically known values for a flat plane, Bezier dome, NURBS quarter cylinder, and freeform bicubic B-spline. STEP files are validated for ISO 10303-21 format compliance and presence of surface geometry entities. Mesh files are read with meshio and verified for minimum element count (200 triangles), aspect ratio bounds (<10.0), and spatial consistency with the original surface definitions."""
