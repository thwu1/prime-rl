schema_version = "1.2"

[metadata]
author_name = "Task Generator"
author_email = "author@example.com"
difficulty_explanation = """Requires expert-level SQL debugging across 7 queries that execute without errors on SQLite but produce semantically incorrect results, compounded by a mandatory cross-engine port to PostgreSQL. The agent must: (1) holistically reason about a 12-rule business knowledge base with interacting rules, (2) explore a multi-table trading database with deliberately planted edge cases (overlapping/expired temporal risk limits, zero-volume price data, NULL commissions, inactive traders, multiple trade statuses), (3) diagnose compound logical bugs in each query where no hints indicate which rules apply, (4) evaluate SQLite-to-PostgreSQL behavioral differences — date arithmetic (strftime/julianday vs EXTRACT/date subtraction), type coercion (ROUND with REAL vs mandatory NUMERIC cast), DATE() modifiers vs date+integer arithmetic — and judge whether each fix is truly correct across both SQL engines, (5) manage the PostgreSQL service lifecycle (pg_ctlcluster, pg_lsclusters, psql), and (6) produce a structured JSON audit report validated with jq. The cross-engine evaluation requires judging correctness across different SQL semantics rather than mechanically applying known fixes."""
solution_explanation = """The solver starts PostgreSQL, explores both databases via sqlite3 and psql CLIs, and systematically fixes each query while porting to PG-compatible SQL. Key fixes: Q1 (add active/settled filters + PG ROUND NUMERIC cast), Q2 (business-day T+2 using EXTRACT(DOW FROM date) + date+integer instead of SQLite DATE()/strftime), Q3 (VWAP SUM formula replacing AVG + zero-volume filter + NUMERIC cast), Q4 (CTE for risk limit deduplication by most-recent effective_date + settled-only + ABS + casts), Q5 (PARTITION BY region not desk + active filter + COALESCE + casts), Q6 (date subtraction replacing julianday + fixed '2024-03-31' reference date + CTE for per-trader aggregation before cross-trader average + casts), Q7 (volume>0 latest price filter via CTE + active/settled + COALESCE on commission + casts). Audit report generated as JSON, validated with jq."""
verification_explanation = """Tests start PostgreSQL, run each of the 7 fixed queries via psycopg2 against the PG database, and compare results row-by-row against known-correct PG reference queries. Floating point values are rounded for stable comparison, PG types (Decimal, date) are normalized. Tests verify exact row counts, column values, ordering, and semantic properties (no inactive traders, correct seniority band counts, valid prices only, no NULL commissions). The audit report is validated for JSON structure, 7 query entries, and required fields (query_id, bugs, engine_differences, fix_approach)."""
category = "data_engineering"
tags = ["sql-debugging", "cross-engine-sql"]
expert_time_estimate_hours = 3.0

