verification_explanation = """Tests verify: (1) the solver module produces correct star-region values for the standard Sod problem (reference: p*~0.30313, u*~0.92745), proving the solver is general-purpose; (2) exact solution CSV values match an independent reference implementation at probe points; (3) wave structure JSON has correct wave types and speeds within tolerance; (4) numerical convergence — L1 errors decrease monotonically with convergence rate > 0.3; (5) all output files exist with correct structure and physically valid data (positive density and pressure)."""
