schema_version = "1.2"

[metadata]
author_name = "Task Generator"
author_email = "author@example.com"
difficulty_explanation = """Requires reading x86-64 assembly, diagnosing compiler optimization choices across 6 distinct functions, understanding why GCC generates specific code patterns at different optimization levels, identifying and explaining language-level constraints that block optimizations (without being told what those constraints are), repairing a function to eliminate a performance bottleneck whose root cause must be independently discovered, and designing a SIMD-vectorized implementation of a floating-point reduction that works without relaxed floating-point semantics. The combination of assembly forensics, language-standard reasoning, and original SIMD code creation requires proficient-level systems expertise."""
solution_explanation = """Compile target.c with gcc at -O2, -O3 -mavx2, and -O3 -mavx2 -ffast-math using Intel syntax assembly output. For each function, parse the assembly to detect specific instruction patterns. Diagnose the accumulate function's performance deficiency as caused by pointer aliasing and fix it by hoisting the accumulator into a local variable. Design a vectorized sum_floats using AVX intrinsics (_mm256_add_ps etc.) with a scalar tail loop for non-multiples of 8, producing packed SIMD additions without requiring -ffast-math."""
verification_explanation = """Tests independently compile target.c with the same flags, extract per-function assembly, and verify each report field matches the actual compiled output. The aliasing fix is verified by compiling fixed_accumulate.c at -O2 and confirming no memory store in the loop body, plus a correctness harness. The vectorized sum is verified by compiling vectorized_sum.c at -O3 -mavx2 (no -ffast-math) and checking for vaddps/addps instructions, plus a correctness harness covering edge cases (n=0, n=1, non-multiples of SIMD width)."""
category = "systems"
tags = ["compilers", "x86-assembly"]
expert_time_estimate_hours = 2.0

