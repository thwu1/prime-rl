[metadata]
author_name = "Task Generator"
author_email = "author@example.com"
difficulty_explanation = """Requires expert-level understanding of Linux UDP socket internals: SO_REUSEADDR semantics for connected vs unconnected sockets, the 'REUSEADDR as a lock' pattern to prevent race conditions during bind+connect, kernel socket lookup via netlink SOCK_DIAG (inet_diag_req_v2 binary protocol) or /proc/net/udp parsing, and userspace ephemeral port discovery. The overshadowing problem in UDP is subtle — connect() silently succeeds even on duplicate 4-tuples — so the solver must independently implement conflict detection rather than relying on kernel error codes. A critical subtlety is that SOCK_DIAG GET uses __udp4_lib_lookup which returns best-match sockets (including wildcard listeners), so the response must be verified for exact 4-tuple match to avoid false conflicts."""
solution_explanation = """The solution implements three key components: (1) a netlink SOCK_DIAG client that queries the kernel for existing connected UDP sockets matching a specific 4-tuple, with exact 4-tuple verification of the response to filter out wildcard/best-match results from __udp4_lib_lookup, plus a /proc/net/udp fallback; (2) the SO_REUSEADDR locking dance — enable REUSEADDR before bind to allow port sharing, disable it after bind to block concurrent binders, verify no 4-tuple conflict via the lookup, then connect and re-enable REUSEADDR; (3) userspace ephemeral port discovery that reads /proc/sys/net/ipv4/ip_local_port_range and iterates from a random starting offset. Together these enable source port reuse while preventing overshadowing."""
verification_explanation = """Tests verify: basic connection creation (auto/manual source), source port reuse (20 connections sharing one source port to different destinations), overshadowing prevention (duplicate 4-tuple raises OSError), kernel socket lookup (finds existing connected sockets, returns None for missing and unconnected), data transfer over created sockets (send/recv roundtrip with actual server sockets), independent data routing for sockets sharing a source port, and ephemeral range reading from /proc."""
