suite: "Edge Cases"
tests:
  - name: "dimensionless unit multiplication"
    expression: "5 '1' * 3"
    expected: "15 '1'"

  - name: "zero quantity"
    expression: "0 'kg' + 0 'kg'"
    expected: "0 'kg'"

  - name: "negative result"
    expression: "3 'kg' - 5 'kg'"
    expected: "-2 'kg'"

  - name: "decimal stripping"
    expression: "2.5 'kg' + 1.5 'kg'"
    expected: "4 'kg'"

  - name: "parentheses override precedence"
    expression: "(2 + 3) * 4"
    expected: "20"

  - name: "nested parentheses calendar"
    expression: "((1 year + 6 months) - 6 months) = 12 months"
    expected: "true"

  - name: "paren quantity arithmetic"
    expression: "(3 'kg' + 2 'kg') * 2"
    expected: "10 'kg'"

  - name: "singular plural mix"
    expression: "1 year + 1 months"
    expected: "13 months"

  - name: "large calendar conversion"
    expression: "2 years + 6 months"
    expected: "30 months"

  - name: "years minus years"
    expression: "3 years - 1 year"
    expected: "2 years"

  - name: "chained calendar equals year"
    expression: "1 year - 6 months - 1 year + 18 months = 1 year"
    expected: "true"

  - name: "days vs UCUM h comparable"
    expression: "1 day > 23 'h'"
    expected: "true"

  - name: "mixed arithmetic equals comparison"
    expression: "(1 'h' + 30 minutes) = 1.5 'h'"
    expected: "true"

  - name: "60 seconds minus 1 UCUM min equals 0"
    expression: "60 seconds - 1 'min' = 0 seconds"
    expected: "true"
