[metadata]
author_name = "Task Generator"
author_email = "author@example.com"
difficulty_explanation = """Requires expert computational physics knowledge to diagnose five interacting bugs across a modular pseudo-spectral Navier-Stokes solver (sign conventions in spectral Poisson inversion, transposed wavenumber arrays in velocity computation, incorrect Shu-Osher RK3 coefficients, incorrect domain averaging in enstrophy, missing spectral normalization in energy spectrum). Beyond debugging, the agent must design a convergence verification study — choosing appropriate timestep sequences, computing convergence orders, and evaluating whether the solver meets its theoretical 3rd-order temporal accuracy guarantee. The agent must also assess spatial accuracy and reason about why the Taylor-Green vortex may not demonstrate spatial convergence. Finally, the agent must implement at least two fundamentally different parameter estimation approaches (e.g., nonlinear least squares vs. log-linear regression), quantitatively compare their accuracy, and produce a justified recommendation of the best method."""
solution_explanation = """Fix five bugs: (1) remove spurious minus sign in spectral Poisson inversion, (2) swap KX/KY wavenumber arrays in velocity computation so u=dpsi/dy and v=-dpsi/dx, (3) correct SSP-RK3 stage-3 coefficients from (0.5,0.5) to (1/3,2/3), (4) change np.sum to np.mean in enstrophy computation, (5) add division by K^2 in energy spectrum shell summation. For convergence verification: run Taylor-Green at dt=0.2,0.1,0.05,0.025 and measure convergence orders (~3.0), confirming SSP-RK3 3rd-order theory; assess spatial accuracy at multiple N, recognizing TG's single-mode structure prevents meaningful spatial convergence demonstration. For estimation: implement nonlinear least squares (E=0.25*exp(-4t/Re)), log-linear regression (ln(E) vs t), and finite-difference derivative methods; compare residuals and recommend NLS as most robust."""
verification_explanation = """Tests verify solver correctness (Poisson inversion, velocity computation, Taylor-Green accuracy at T=5, SSP-RK3 convergence order, inviscid energy conservation, dissipation relation, energy spectrum). Convergence evaluation is verified by checking JSON structure, temporal convergence orders within [2.5, 3.5], theory-matching flag, substantive conclusion and spatial justification, plus an independent spot-check that re-runs the solver at a reported timestep to verify the claimed error. Estimation comparison is verified by checking >=2 distinct methods exist, best estimate within 1% of true Re=237.5, best_method appears in methods list, and recommendation rationale is substantive."""
