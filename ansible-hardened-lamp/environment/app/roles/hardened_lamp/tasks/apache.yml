---
- name: Enable required Apache modules
  ansible.builtin.command: "a2enmod {{ item }}"
  loop: "{{ apache_modules }}"
  register: apache_mod_result
  changed_when: "'already enabled' not in apache_mod_result.stdout"
  notify: restart apache

- name: Deploy Apache virtual host
  ansible.builtin.template:
    src: vhost.conf.j2
    dest: "/etc/apache2/sites-available/{{ server_hostname }}.conf"
    owner: root
    group: root
    mode: '0644'
  notify: restart apache

- name: Enable virtual host
  ansible.builtin.command: "a2ensite {{ server_hostname }}"
  register: ensite_result
  changed_when: "'already enabled' not in ensite_result.stdout"
  notify: restart apache

- name: Disable default site
  ansible.builtin.command: "a2dissite 000-default"
  register: dissite_result
  changed_when: "'already disabled' not in dissite_result.stdout"
  failed_when: false
  notify: restart apache
