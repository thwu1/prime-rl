---
- name: Install fail2ban
  ansible.builtin.apt:
    name: "{{ fail2ban_package }}"
    state: present

- name: Deploy fail2ban configuration
  ansible.builtin.template:
    src: jail.local.j2
    dest: /etc/fail2ban/jail.local
    owner: root
    group: root
    mode: '0644'
  notify: restart fail2ban
