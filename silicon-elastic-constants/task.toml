difficulty_explanation = """Requires diagnosing three independent bugs and implementing three missing derived-property computations in a ~250-line Python/LAMMPS elastic constants workflow. The most challenging bug involves recognizing that energy minimization after shear deformation is essential for multi-body potentials like Stillinger-Weber (which has 3-body angular terms) in diamond-cubic structures where internal sublattice relaxation drastically changes the shear elastic constant (Born C44 is roughly double the relaxed value). The solver must also identify a unit-conversion error (confusing LAMMPS metal-unit bars with real-unit atmospheres) and a wrong Poisson ratio formula (single-crystal vs polycrystalline). Beyond debugging, the solver must implement the Reuss shear modulus bound, derive the directional Young's modulus along [111] via the compliance tensor and correct orientation factor, and compute the Cauchy pressure — all requiring solid knowledge of anisotropic elasticity theory for cubic crystals."""
solution_explanation = """Fix three bugs: (1) BAR_TO_GPA conversion 1.01325e-4 (atm->GPa) must be 1.0e-4 (bar->GPa) for LAMMPS metal units; (2) add energy minimization for shear strain perturbations (indices j>=3) because SW potential has 3-body angular terms and diamond-cubic Si has internal degrees of freedom that cause the Born shear constant to be roughly double the relaxed value; (3) Poisson ratio formula C12/(C11+C12) (single-crystal [100]) must be replaced with polycrystalline Hill formula (3K-2G_H)/(2(3K+G_H)). Implement three stubs: Reuss shear modulus G_R = 5(C11-C12)C44/(4C44+3(C11-C12)); [111] Young's modulus via compliance tensor inversion with orientation factor Gamma=1/3; Cauchy pressure = C12-C44."""
verification_explanation = """Tests load /app/results.json and verify: (1) all 12 keys present and numeric; (2) C11 in [149,153], C12 in [75,77], C44 in [55,57] GPa — tight enough to catch both the 1.3% conversion error and the catastrophic shear minimization bug; (3) self-consistency of bulk modulus, Voigt/Reuss/Hill shear moduli, directional Young's moduli, Poisson ratio, and Zener ratio against standard elasticity formulas applied to the submitted Cij values; (4) Born stability criteria; (5) physically valid ranges for all derived quantities including non-zero checks for previously stubbed quantities."""
