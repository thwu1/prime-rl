description: "Relax postgres ACL - remove pod-level access control requirement"
action: replace
target_policy: db-allow-postgres-from-api
target_namespace: db
policy:
  apiVersion: networking.k8s.io/v1
  kind: NetworkPolicy
  metadata:
    name: db-allow-postgres-from-api
    namespace: db
  spec:
    podSelector:
      matchLabels:
        app: postgres
    policyTypes:
    - Ingress
    ingress:
    - from:
      - namespaceSelector:
          matchLabels:
            purpose: api
      ports:
      - port: 5432
        protocol: TCP
