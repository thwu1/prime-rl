description: "Remove monitoring egress from API services"
action: replace
target_policy: api-egress-policy
target_namespace: api
policy:
  apiVersion: networking.k8s.io/v1
  kind: NetworkPolicy
  metadata:
    name: api-egress-policy
    namespace: api
  spec:
    podSelector: {}
    policyTypes:
    - Egress
    egress:
    - to:
      - namespaceSelector:
          matchLabels:
            purpose: data
      ports:
      - port: 5432
        protocol: TCP
      - port: 6379
        protocol: TCP
    - ports:
      - port: 53
        protocol: UDP
      - port: 53
        protocol: TCP
