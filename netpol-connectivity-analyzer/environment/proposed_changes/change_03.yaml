description: "Allow monitoring namespace to scrape monitored API services"
action: add
target_namespace: api
policy:
  apiVersion: networking.k8s.io/v1
  kind: NetworkPolicy
  metadata:
    name: api-allow-monitoring-scrape
    namespace: api
  spec:
    podSelector:
      matchLabels:
        role: monitored
    policyTypes:
    - Ingress
    ingress:
    - from:
      - namespaceSelector:
          matchLabels:
            purpose: monitoring
      ports:
      - port: 8080
        protocol: TCP
