apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-gateway-to-api
  namespace: core
spec:
  podSelector:
    matchLabels:
      component: api
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              tier: edge
          podSelector:
            matchLabels:
              role: gateway
      ports:
        - protocol: TCP
          port: 8080
  policyTypes:
    - Ingress
