apiVersion: v1
kind: Namespace
metadata:
  name: apps
  labels:
    env: production
---
apiVersion: v1
kind: Namespace
metadata:
  name: admin
  labels:
    env: admin
---
apiVersion: v1
kind: Namespace
metadata:
  name: cicd
  labels:
    env: cicd
---
apiVersion: v1
kind: Pod
metadata:
  name: webserver
  namespace: apps
  labels:
    app: web
    version: v2
status:
  podIP: "10.30.1.1"
---
apiVersion: v1
kind: Pod
metadata:
  name: backend
  namespace: apps
  labels:
    app: api
    version: v1
status:
  podIP: "10.30.1.2"
---
apiVersion: v1
kind: Pod
metadata:
  name: dashboard
  namespace: admin
  labels:
    app: admin-ui
    role: admin
status:
  podIP: "10.30.2.1"
---
apiVersion: v1
kind: Pod
metadata:
  name: deployer
  namespace: cicd
  labels:
    app: deployer
    role: deployer
status:
  podIP: "10.30.3.1"
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all
  namespace: apps
spec:
  podSelector: {}
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-admin-to-web
  namespace: apps
spec:
  podSelector:
    matchLabels:
      app: web
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          env: admin
    ports:
    - protocol: TCP
      port: 443
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-cicd-to-web
  namespace: apps
spec:
  podSelector:
    matchLabels:
      app: web
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          env: cicd
    ports:
    - protocol: TCP
      port: 8080
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-internal-to-web
  namespace: apps
spec:
  podSelector:
    matchLabels:
      app: web
  ingress:
  - from:
    - podSelector:
        matchLabels:
          app: api
  policyTypes:
  - Ingress
