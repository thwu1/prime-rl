apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-control-plane
  namespace: mesh-data
spec:
  podSelector: {}
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              plane: control
          podSelector:
            matchLabels:
              role: proxy
      ports:
        - protocol: TCP
          port: 15001
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              plane: control
          podSelector:
            matchLabels:
              role: management
      ports:
        - protocol: TCP
          port: 8443
  policyTypes:
    - Ingress
    - Egress
