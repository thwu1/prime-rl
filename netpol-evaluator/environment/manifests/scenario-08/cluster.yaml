apiVersion: v1
kind: Namespace
metadata:
  name: dmz
  labels:
    zone: dmz
---
apiVersion: v1
kind: Namespace
metadata:
  name: corp
  labels:
    zone: corp
---
apiVersion: v1
kind: Pod
metadata:
  name: lb
  namespace: dmz
  labels:
    app: loadbalancer
    role: ingress
status:
  podIP: "172.16.0.10"
---
apiVersion: v1
kind: Pod
metadata:
  name: app-a
  namespace: corp
  labels:
    app: service
    team: alpha
status:
  podIP: "10.0.1.50"
---
apiVersion: v1
kind: Pod
metadata:
  name: app-b
  namespace: corp
  labels:
    app: service
    team: beta
status:
  podIP: "10.0.2.50"
---
apiVersion: v1
kind: Pod
metadata:
  name: app-c
  namespace: corp
  labels:
    app: service
    team: gamma
status:
  podIP: "10.0.3.50"
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all-ingress
  namespace: dmz
spec:
  podSelector: {}
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-corp-cidr
  namespace: dmz
spec:
  podSelector:
    matchLabels:
      role: ingress
  ingress:
  - from:
    - ipBlock:
        cidr: 10.0.0.0/8
        except:
        - 10.0.2.0/24
    ports:
    - protocol: TCP
      port: 443
  policyTypes:
  - Ingress
