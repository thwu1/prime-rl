apiVersion: v1
kind: Namespace
metadata:
  name: frontend
  labels:
    tier: frontend
---
apiVersion: v1
kind: Namespace
metadata:
  name: backend
  labels:
    tier: backend
---
apiVersion: v1
kind: Namespace
metadata:
  name: monitoring
  labels:
    tier: ops
---
apiVersion: v1
kind: Pod
metadata:
  name: webapp
  namespace: frontend
  labels:
    app: webapp
    component: ui
status:
  podIP: "10.10.1.1"
---
apiVersion: v1
kind: Pod
metadata:
  name: admin
  namespace: frontend
  labels:
    app: admin
    component: ui
status:
  podIP: "10.10.1.2"
---
apiVersion: v1
kind: Pod
metadata:
  name: api-server
  namespace: backend
  labels:
    app: api
    component: server
status:
  podIP: "10.10.2.1"
---
apiVersion: v1
kind: Pod
metadata:
  name: worker
  namespace: backend
  labels:
    app: worker
    component: batch
status:
  podIP: "10.10.2.2"
---
apiVersion: v1
kind: Pod
metadata:
  name: prometheus
  namespace: monitoring
  labels:
    app: prometheus
    component: monitor
status:
  podIP: "10.10.3.1"
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all-ingress
  namespace: backend
spec:
  podSelector: {}
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-frontend-to-api
  namespace: backend
spec:
  podSelector:
    matchLabels:
      component: server
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          tier: frontend
    ports:
    - protocol: TCP
      port: 8080
  policyTypes:
  - Ingress
