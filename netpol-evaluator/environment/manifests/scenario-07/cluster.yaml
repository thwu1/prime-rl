apiVersion: v1
kind: Namespace
metadata:
  name: nettest
  labels:
    purpose: testing
---
apiVersion: v1
kind: Pod
metadata:
  name: server
  namespace: nettest
  labels:
    app: server
    role: endpoint
status:
  podIP: "10.40.1.1"
---
apiVersion: v1
kind: Pod
metadata:
  name: client-a
  namespace: nettest
  labels:
    app: client
    group: a
status:
  podIP: "10.40.1.2"
---
apiVersion: v1
kind: Pod
metadata:
  name: client-b
  namespace: nettest
  labels:
    app: client
    group: b
status:
  podIP: "10.40.1.3"
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: deny-all
  namespace: nettest
spec:
  podSelector: {}
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-tcp-range
  namespace: nettest
spec:
  podSelector:
    matchLabels:
      role: endpoint
  ingress:
  - from:
    - podSelector:
        matchLabels:
          group: a
    ports:
    - protocol: TCP
      port: 8000
      endPort: 9000
  policyTypes:
  - Ingress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-udp-specific
  namespace: nettest
spec:
  podSelector:
    matchLabels:
      role: endpoint
  ingress:
  - from:
    - podSelector:
        matchLabels:
          group: b
    ports:
    - protocol: UDP
      port: 53
  policyTypes:
  - Ingress
