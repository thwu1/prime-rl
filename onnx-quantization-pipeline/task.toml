schema_version = "1.2"

[metadata]
author_name = "Task Generator"
author_email = "author@example.com"
difficulty_explanation = """Requires expert-level ONNX graph surgery: the solver must independently analyze an unknown model topology to discover Conv+BN pairs and edge cases (e.g. bias-absent Convs), derive the correct parameter folding math from first principles, implement symmetric INT8 per-channel and per-tensor quantization with calibration-based activation range estimation via intermediate tensor extraction, maintain topological graph ordering across Q/DQ node insertion, clean up unreferenced initializers, and produce a structured diagnostic report reflecting accurate model analysis. No algorithms or formulas are given — all must be inferred from the model structure and config."""
solution_explanation = """The solution implements a 3-stage pipeline: (1) Conv+BN fusion by computing fused_W = W * gamma/sqrt(var+eps) and fused_B = gamma*(B-mean)/sqrt(var+eps)+beta, removing BN nodes, rewiring outputs, and handling the no-bias Conv edge case by appending a new bias initializer; (2) activation scale calibration by cloning the model with intermediate tensors exposed as additional outputs, running all 50 calibration samples, and computing per-tensor max-abs/127 ranges; (3) Q/DQ node insertion by creating QuantizeLinear->DequantizeLinear pairs for each Conv's weight (per-channel axis=0, scale=max|W_c|/127) and activation (per-tensor scalar scale) inputs, maintaining topological ordering. A diagnostic report is generated by analyzing both original and fused model op counts and extracting scale statistics from the quantized model."""
verification_explanation = """Tests verify BN fusion (zero BN nodes, preserved Conv count, bias added to originally bias-free Convs, no unreferenced initializers, numerical equivalence with original model on multiple random inputs), Q/DQ insertion (correct node counts, weight and activation Q/DQ chain structural tracing, per-channel vs per-tensor scale dimensionality and positivity, input activation scale matches calibration range), model validity (onnx.checker.check_model passes), ONNX Runtime inference (correct output shape, finite values, bounded quantization error vs fused model), correct quantization math (weight scale matches max(|W_c|)/127, all zero-points are zero, fake-quantized weight round-trip is idempotent), and diagnostic report (correct op counts, quantized tensor counts, weight scale ranges, activation scales matching model)."""
category = "machine_learning"
tags = ["onnx", "quantization"]
