apiVersion: kyverno.io/v2beta1
kind: ValidatingPolicy
metadata:
  name: enforce-resource-limits
  annotations:
    policies.kyverno.io/title: Enforce Resource Limits
    policies.kyverno.io/category: Resource Management
    policies.kyverno.io/severity: high
    policies.kyverno.io/description: >-
      All Deployments must specify CPU and memory limits for every
      container to prevent resource exhaustion and ensure fair
      scheduling across tenants.
spec:
  validationFailureAction: Audit
  rules:
    - name: check-resource-limits
      match:
        any:
          - resources:
              kinds:
                - Deployment
              apiVersions:
                - "v1"
              operations:
                - CREATE
                - UPDATE
      validate:
        cel:
          expressions:
            - expression: >-
                object.spec.template.spec.containers.all(c,
                has(c.resources) &&
                has(c.resources.limits) &&
                has(c.resources.limits.cpu) &&
                has(c.resources.limits.memory))
              message: "All containers in Deployments must have CPU and memory limits set."
            - expression: >-
                object.spec.template.spec.initContainers.all(c,
                has(c.resources) &&
                has(c.resources.limits) &&
                has(c.resources.limits.cpu) &&
                has(c.resources.limits.memory))
              messageExpression: "'All init containers must also have resource limits.'"
