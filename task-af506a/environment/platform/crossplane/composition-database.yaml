apiVersion: apiextensions.crossplane.io/v1
kind: Composition
metadata:
  name: postgres-on-kubernetes
  labels:
    crossplane.io/xrd: xpostgresqldatabases.platform.example.com
spec:
  compositeTypeRef:
    apiVersion: platform.example.com/v1alpha1
    kind: XPostgreSQLDatabase
  mode: Pipeline
  pipeline:
    - step: patch-and-transform
      functionRef:
        name: function-patch-and-transform
      input:
        apiVersion: pt.fn.crossplane.io/v1beta1
        kind: Resources
        resources:
          - name: statefulset
            base:
              apiVersion: apps/v1
              kind: StatefulSet
              metadata:
                labels:
                  app.kubernetes.io/managed-by: crossplane
                  app.kubernetes.io/component: database
              spec:
                serviceName: postgres
                selector:
                  matchLabels:
                    app: postgres
                template:
                  metadata:
                    labels:
                      app: postgres
                  spec:
                    containers:
                      - name: postgres
                        image: postgres:15
                        ports:
                          - containerPort: 5432
                            name: postgresql
                        env:
                          - name: POSTGRES_PASSWORD
                            valueFrom:
                              secretKeyRef:
                                name: postgres-credentials
                                key: password
                          - name: PGDATA
                            value: /var/lib/postgresql/data/pgdata
                        volumeMounts:
                          - name: data
                            mountPath: /var/lib/postgresql/data
                        resources:
                          requests:
                            cpu: 250m
                            memory: 512Mi
                          limits:
                            cpu: "1"
                            memory: 1Gi
                        livenessProbe:
                          exec:
                            command:
                              - pg_isready
                              - -U
                              - postgres
                          initialDelaySeconds: 30
                          periodSeconds: 10
                        readinessProbe:
                          exec:
                            command:
                              - pg_isready
                              - -U
                              - postgres
                          initialDelaySeconds: 5
                          periodSeconds: 5
                volumeClaimTemplates:
                  - metadata:
                      name: data
                    spec:
                      accessModes: ["ReadWriteOnce"]
                      resources:
                        requests:
                          storage: 10Gi
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: "spec.parameters.storageSizeGB"
                toFieldPath: "spec.volumeClaimTemplates[0].spec.resources.requests.storage"
                transforms:
                  - type: string
                    string:
                      fmt: "%dGi"
                      type: Format
              - type: FromCompositeFieldPath
                fromFieldPath: "spec.parameters.replicas"
                toFieldPath: "spec.replicas"
              - type: FromCompositeFieldPath
                fromFieldPath: "spec.parameters.version"
                toFieldPath: "spec.template.spec.containers[0].image"
                transforms:
                  - type: string
                    string:
                      fmt: "postgres:%s"
                      type: Format
              - type: FromCompositeFieldPath
                fromFieldPath: "metadata.labels[crossplane.io/claim-namespace]"
                toFieldPath: "metadata.namespace"
          - name: service
            base:
              apiVersion: v1
              kind: Service
              metadata:
                labels:
                  app.kubernetes.io/managed-by: crossplane
                  app.kubernetes.io/component: database
              spec:
                type: ClusterIP
                selector:
                  app: postgres
                ports:
                  - port: 5432
                    targetPort: 5432
                    protocol: TCP
                    name: postgresql
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: "metadata.labels[crossplane.io/claim-namespace]"
                toFieldPath: "metadata.namespace"
              - type: FromCompositeFieldPath
                fromFieldPath: "metadata.name"
                toFieldPath: "metadata.name"
                transforms:
                  - type: string
                    string:
                      fmt: "%s-postgresql"
                      type: Format
          - name: credentials-secret
            base:
              apiVersion: kubernetes.crossplane.io/v1alpha2
              kind: Object
              spec:
                forProvider:
                  manifest:
                    apiVersion: v1
                    kind: Secret
                    type: Opaque
                    metadata:
                      name: postgres-credentials
                    stringData:
                      password: ""
                      username: "postgres"
                      host: ""
                      port: "5432"
            patches:
              - type: FromCompositeFieldPath
                fromFieldPath: "metadata.labels[crossplane.io/claim-namespace]"
                toFieldPath: "spec.forProvider.manifest.metadata.namespace"
              - type: FromCompositeFieldPath
                fromFieldPath: "metadata.name"
                toFieldPath: "spec.forProvider.manifest.metadata.name"
                transforms:
                  - type: string
                    string:
                      fmt: "%s-credentials"
                      type: Format
