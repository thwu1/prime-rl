apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: team-alpha-workloads
  namespace: argocd
  labels:
    app.kubernetes.io/managed-by: argocd
    platform.example.com/tenant: team-alpha
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: platform-teams
  source:
    repoURL: https://github.com/acme-corp/platform-apps.git
    targetRevision: main
    path: tenants/team-alpha/workloads
    directory:
      recurse: true
  destination:
    server: https://kubernetes.default.svc
    namespace: default
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=false
      - PrunePropagationPolicy=foreground
      - PruneLast=true
    retry:
      limit: 5
      backoff:
        duration: 5s
        factor: 2
        maxDuration: 3m
