apiVersion: v1
kind: LimitRange
metadata:
  name: team-beta-limits
  namespace: team-beta
  labels:
    platform.example.com/tenant: team-beta
spec:
  limits:
    - type: Container
      default:
        cpu: "250m"
        memory: "256Mi"
      defaultRequest:
        cpu: "100m"
        memory: "128Mi"
      min:
        cpu: "50m"
        memory: "64Mi"
      max:
        cpu: "1"
        memory: "2Gi"
    - type: Pod
      max:
        cpu: "2"
        memory: "4Gi"
