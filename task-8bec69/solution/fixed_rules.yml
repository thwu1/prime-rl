groups:
  - name: sglang_slo_metrics
    interval: 30s
    rules:
      - record: sglang:ttft_p99_seconds
        expr: histogram_quantile(0.99, rate(sglang:time_to_first_token_seconds_bucket[5m]))

      - record: sglang:e2e_p99_seconds
        expr: histogram_quantile(0.99, rate(sglang:e2e_request_latency_seconds_bucket[5m]))

      - record: sglang:tpot_p95_seconds
        expr: histogram_quantile(0.95, rate(sglang:time_per_output_token_seconds_bucket[5m]))

      - record: sglang:request_rate
        expr: sum(rate(sglang:time_to_first_token_seconds_count[5m]))
