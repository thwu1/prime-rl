difficulty_explanation = """Requires expert-level IPv6 protocol knowledge to analyze binary PCAP captures and identify security-relevant anomalies without prescriptive guidance. The agent must: (1) use tshark or equivalent tools to read binary pcap files — requires packet analysis tool proficiency, (2) identify Routing Header Type 0 as deprecated per RFC 5095 — requires IPv6 protocol history knowledge, (3) detect overlapping fragment evasion by computing byte ranges across fragment pairs — requires deep understanding of fragment reassembly mechanics, (4) recognize tiny first fragments as a firewall evasion technique (RFC 1858) — requires network security expertise, (5) calculate whether fragment offset + data length exceeds 65535 — requires RFC 8200 Section 4.5 knowledge, (6) identify HBH-not-first and duplicate extension header chain violations — requires RFC 8200 Section 4.1 knowledge, (7) write valid nftables rules for IPv6 filtering including extension header and ICMPv6 handling — requires multi-tool interoperability across packet analysis and firewall configuration."""
solution_explanation = """The solution parses each pcap file to extract raw IPv6 packets, walks extension header chains using NH-value-specific length calculations, and classifies each flow based on protocol violations and known attack patterns. Fragment flows require computing byte ranges for overlap detection and checking reassembly bounds against the 65535 maximum. RH0 detection requires reading the Routing Type field and knowing its deprecation status. The nftables rules block RH0 via 'rt type 0', handle fragments via 'exthdr frag exists', and allow essential ICMPv6 types. No external libraries are needed — the solution parses pcap binary format and IPv6 headers using only struct and socket."""
verification_explanation = """Tests load /app/audit.json and verify: (1) all 10 flows present with correct classification (legitimate/fragment_evasion/header_chain_violation/deprecated_routing/oversized_reassembly), (2) correct source and destination IPv6 addresses for selected flows, (3) correct extension header chain identification for each flow, (4) appropriate threat severity levels with minimum thresholds per category, (5) accurate summary statistics (4 legitimate, 6 malicious, 4 threat categories), (6) non-null violation descriptions for malicious flows and null for legitimate, (7) rules.nft exists with key nftables patterns including RH0 blocking, fragment handling, and ICMPv6 allowance."""
