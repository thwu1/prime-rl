# Production Analytics Database Configuration
#
# The production backend is DuckDB, a columnar analytics database.
# It handles scans and joins efficiently but recursive and
# iterative point-lookup patterns are prohibited for performance reasons.

engine: duckdb
analytics_db_path: /app/analytics.duckdb
source_db_path: /app/tree.db
source_db_engine: sqlite

sql_constraints:
  # Recursive CTEs (WITH RECURSIVE) are not supported by the production
  # analytics engine.
  allow_recursive_cte: false

  # Each query operation must be expressible as a single SQL statement.
  # No iterative parent-pointer walking from application code.
  single_statement_queries: true

indexing:
  # Point lookups are expensive in the production backend. Prefer
  # pre-computed multi-level structures that support scan-and-join
  # query patterns.
  optimization_target: "minimize_point_lookups"

performance:
  max_build_time_sec: 120
  max_query_time_sec: 5

data_integrity:
  # Source data tables must never be modified by the indexer or query
  # engine. All auxiliary structures go in the DuckDB analytics database.
  preserve_source_tables: true
