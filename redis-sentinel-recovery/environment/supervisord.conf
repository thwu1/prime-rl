[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[supervisord]
logfile=/var/log/supervisor/supervisord.log
pidfile=/var/run/supervisord.pid
childlogdir=/var/log/supervisor
nodaemon=false
user=root

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

[program:redis-node-a]
command=redis-server /etc/redis/node_a.conf
autostart=true
autorestart=false
startretries=0
redirect_stderr=true
stdout_logfile=/var/log/supervisor/redis-node-a.log

[program:redis-node-b]
command=redis-server /etc/redis/node_b.conf
autostart=true
autorestart=false
redirect_stderr=true
stdout_logfile=/var/log/supervisor/redis-node-b.log

[program:sentinel1]
command=redis-server /etc/redis/sentinel1.conf --sentinel
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/sentinel1.log

[program:sentinel2]
command=redis-server /etc/redis/sentinel2.conf --sentinel
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/sentinel2.log

[program:sentinel3]
command=redis-server /etc/redis/sentinel3.conf --sentinel
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/sentinel3.log

[program:flask-app]
command=python3 /app/app.py
directory=/app
autostart=true
autorestart=true
redirect_stderr=true
stdout_logfile=/var/log/supervisor/flask-app.log
