schema_version = "1.2"

[metadata]
author_name = "Task Generator"
author_email = "author@example.com"
difficulty_explanation = """Requires graduate-level numerical PDE expertise to diagnose and fix a convection-diffusion solver that fails across multiple physical regimes. The agent must: (1) build and run the provided code to observe failures in specific configurations, (2) analyze the numerical properties of each regime to understand why the uniform approach fails, (3) research and select appropriate discretization and solver strategies per regime, (4) implement an adaptive framework in C++ using Eigen3's template-heavy API that automatically detects each regime and applies the correct approach, (5) verify convergence and accuracy across all configurations, and (6) document the analysis in a structured strategy file. No single textbook recipe handles all four regimes — the agent must synthesize knowledge from numerical analysis, iterative methods, and preconditioning theory."""
solution_explanation = """The solver computes the grid Peclet number Pe_h = max(|bx|,|by|)*h/(2*eps) for each configuration. When Pe_h > 1 (configs 2,4), it switches from central differences to first-order upwind differencing to eliminate spurious oscillations and restore diagonal dominance. It also upgrades the preconditioner from DiagonalPreconditioner to IncompleteLUT with controlled fill-in for these ill-conditioned systems. Configs 1,3 keep central differences (stable, second-order) with the lightweight diagonal preconditioner. The adaptive strategy is implemented in a single modified solve_convdiff.cpp and produces both output files and strategy.json."""
verification_explanation = """test.sh rebuilds the agent's modified source at /app/ with cmake, runs the binary to produce output_*.txt and strategy.json, then pytest verifies: (1) all 4 outputs exist with required key=value fields (iterations, residual_norm, l2_error, converged), (2) all converge with residual < 1e-6, (3) L2 error < 0.15 for each (catches oscillatory solutions from wrong discretization), (4) total iterations < 800, (5) strategy.json is valid with all 4 configs documented with required fields, (6) convection-dominated configs (grid_peclet_number > 2.0) correctly use upwind discretization, (7) rationales are substantive (>20 chars). Building from source and checking L2 error prevents hardcoding."""
