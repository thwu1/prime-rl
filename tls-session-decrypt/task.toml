schema_version = "1.2"

[metadata]
author_name = "Task Generator"
author_email = "author@example.com"
difficulty_explanation = """Requires creating a dual-mode TLS 1.3 decryption engine from scratch: (1) implementing the full RFC 8446 key schedule (HKDF-Extract/Expand/ExpandLabel, Derive-Secret, transcript hashing, multi-stage secret derivation), (2) implementing the malware's modified key schedule that skips early_secret, (3) designing a trial-decryption strategy across 6 keys x 4 sessions x 2 protocol variants using AEAD authentication as an oracle for key correctness, (4) parsing ServerHello binary to extract X25519 public keys for both ECDH and cross-session server fingerprinting, (5) handling corrupted encrypted records mid-stream while maintaining sequence numbering, (6) classifying exfiltrated content by sensitivity, and (7) producing a prioritized vulnerability assessment combining protocol variant analysis, content classification, shared infrastructure detection, and severity ranking."""
solution_explanation = """For each session, try every leaked key with both standard and modified key schedules: compute ECDH shared secret, derive handshake_secret via both paths, attempt AEAD decryption of the first encrypted record — success identifies both the correct key and protocol variant. Decrypt handshake to get transcript for application key derivation. Decrypt all application records, catching authentication failures for corrupted records while maintaining correct sequence counters. Extract server public keys from all ServerHello messages and compare to find shared infrastructure (alpha and delta share the same server). Classify decrypted content by inspecting for credentials (API keys, passwords), PII (SSNs, account numbers), internal docs (architecture details), or benign content. Rank incident priority by combining content severity and protocol risk."""
verification_explanation = """Tests independently implement both standard and modified key schedules to compute expected outputs from the same incident data. They verify: (1) all four key-to-session mappings are correct, (2) decrypted content matches expected plaintext including specific strings, (3) gamma's corrupted record was skipped but subsequent records recovered, (4) exfiltration report correctly classifies alpha/gamma/delta as exfiltrated and beta as benign, (5) vulnerability assessment correctly identifies protocol variants (standard for alpha/beta, modified for gamma/delta), (6) content categories and severity levels match expected values, (7) shared_server_sessions identifies the alpha-delta pair, and (8) incident_priority ordering reflects severity ranking."""
category = "security"
tags = ["tls-forensics", "protocol-analysis"]
