schema_version = "1.2"

[metadata]
author_name = "Task Generator"
author_email = "author@example.com"
difficulty_explanation = """Requires chaining five distinct skills: (1) network service discovery using ss/netstat to locate the gateway port and ps to find the gateway process, (2) source-code auditing of ~200 lines of Python to locate a command-injection sink where unsanitised binary section names are interpolated into a batch script, (3) reading the gateway configuration to discover the credential file path, (4) understanding a custom binary file format via the spec and xxd analysis of the example file to craft section entries whose raw name bytes contain newline-based injection payloads, and (5) developing a staged exploitation technique (BabyFirst Revenge style) to overcome a strict 7-byte-per-injection-line constraint and deliver the exploit via curl to the gateway's HTTP API. An expert security researcher familiar with command-injection patterns, network service analysis, and constrained exploitation would need ~2 hours."""
solution_explanation = """First discover the gateway service via ss -tlnp (port 4141) and ps aux (finds /opt/binaudit-gateway/server.py). Read the gateway source to learn the API endpoint (POST /api/v2/scan) and the config file path. Read /etc/binaudit/gateway.conf to find the credential at /var/lib/binaudit/credential.key. Audit binaudit.py to find the vulnerability: in generate_report()'s batch mode, raw section name bytes (decoded via latin-1) are placed after '#' in xref lines, and a 0x0A byte breaks out of the comment to inject batch-script lines. The batch interpreter's '!' prefix runs shell commands. With 7 usable bytes per injected line, the BabyFirst Revenge technique builds arbitrary commands: create files named with 4-char hex chunks via '>XXXX', accumulate via 'ls>>y', decode with 'xxd -r -p y z', and execute with 'sh z'. The decoded payload is 'cat /var/lib/binaudit/credential.key>/app/output/exfil.txt'. Deliver the crafted .bscan via curl --data-binary to the gateway."""
verification_explanation = """Tests verify three things: (1) a .bscan exploit file exists under /app/, (2) the file has valid BSCN format with correct magic, version, and section count, and (3) running binaudit --execute on the exploit file (using a pristine copy of binaudit.py to prevent tampering) causes the credential content from /var/lib/binaudit/credential.key to appear in /app/output/exfil.txt. The test removes any pre-existing exfil.txt before running, so the exploit must produce the file through binaudit's execution."""
category = "security_and_privacy"
tags = ["command-injection", "network-service-exploitation"]
expert_time_estimate_hours = 2.0

