difficulty_explanation = """Requires expert-level numerical methods knowledge to design a complete solver for a stiff hybrid ODE system from a mathematical specification. The agent must: (1) implement event detection for a state-dependent phase transition in scipy's BDF integrator, (2) design the augmented ODE system for forward sensitivity analysis (16 coupled equations), (3) derive and implement the sensitivity jump condition S+ = S- - (f_pre-f_post)(∇g·S-)/(∇g·f_pre) at the discontinuity — a niche formula from hybrid-system sensitivity theory rarely covered outside specialized DAE literature, (4) construct the analytical sparse Jacobian in CSC format with exactly the correct sparsity structure (10 nonzeros), and (5) reason about how parameter Jacobians differ between phases (k1_phase1 derivatives vanish in Phase 2). Creating this pipeline from scratch requires synthesizing knowledge across stiff integration, event handling, sensitivity analysis, and sparse linear algebra."""
solution_explanation = """The solution creates the complete pipeline: sparse Jacobian with 10 nonzeros including Q1*k1 at J[3,0], phase-specific parameter Jacobians (Phase 2 zeros out k1_phase1 derivatives and uses K1_P2 for Q1 column), augmented 16-equation system for forward sensitivities, event detection with terminal=True and direction=1 for the T=375 crossing, the sensitivity jump condition derived from g(y)=T-375, and two-phase integration with dense output for trajectory reconstruction."""
verification_explanation = """Tests verify correctness through independent computation: (1) trajectory accuracy via a separate high-tolerance BDF solve of the base ODE, (2) mass conservation A+B+C=1, (3) event time and state, (4) Jacobian correctness via central finite differences at a test point, and (5) sensitivity correctness via independent finite-difference parameter perturbation — a completely different numerical approach from the forward sensitivity method the agent must implement."""
