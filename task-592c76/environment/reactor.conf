# Exothermic Batch Reactor Specification
# =======================================
#
# State vector: y = [A, B, C, T]
#   A, B, C : species concentrations (conservation law: A + B + C = 1)
#   T       : reactor temperature (K)
#
# Governing equations:
#   dA/dt = -k1*A + k3*B*C
#   dB/dt =  k1*A - k2*B^2 - k3*B*C
#   dC/dt =  k2*B^2
#   dT/dt =  Q1*k1*A + Q2*k2*B^2 - U*(T - Tc)

[phase1]
# Active when T < T_crit
k1 = 0.04
k2 = 3e7
k3 = 1e4

[phase2]
# Active when T >= T_crit (discontinuous switch in rate constants)
k1 = 0.01
k2 = 3e7
k3 = 2.5e3

[thermal]
T_crit = 375.0
Q1 = 800.0
Q2 = 2e-4
U = 0.1
Tc = 290.0

[initial_conditions]
A = 1.0
B = 0.0
C = 0.0
T = 300.0

[integration]
t_start = 0
t_end = 100
rtol = 1e-8
atol = 1e-10
max_step = 0.5

[sensitivity]
# Forward sensitivity dy/dp evaluated at t_end
parameters = k1_phase1, Q1, U

[output]
directory = /app/results

[output_schema]
# Each output file is JSON. The required schemas are defined below.
#
# --- trajectory.json ---
# {
#   "times":  [float, ...],          // length 101, integer time points 0, 1, ..., 100
#   "states": [[float, float, float, float], ...]  // length 101, each entry is [A, B, C, T]
# }
#
# --- events.json ---
# {
#   "event_time":     float,                       // time at which T crosses T_crit (rising)
#   "state_at_event": [float, float, float, float] // state [A, B, C, T] at the event
# }
#
# --- sensitivity.json ---
# {
#   "sensitivity_matrix": [[float, float, float], ...],  // shape 4x3, rows = [A,B,C,T], cols = [k1_phase1, Q1, U]
#   "final_state":        [float, float, float, float]   // state [A, B, C, T] at t_end
# }
#
# --- jacobian.json ---
# {
#   "test_point": [float, float, float, float],          // the evaluation point [A, B, C, T] = [0.5, 1e-5, 0.3, 340.0]
#   "jacobian":   [[float, float, float, float], ...],   // shape 4x4, dense representation of the analytical Jacobian df/dy
#   "nnz":        int                                    // number of structural nonzeros in the sparse Jacobian
# }
