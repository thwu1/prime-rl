solution_explanation = """The reference solution implements a Beamformer class that: (1) computes Dolph-Chebyshev weights using the DFT method with Chebyshev polynomial sampling at x0=cosh(arccosh(R0)/(N-1)), handling even/odd N differently; (2) applies coupling correction via w_corrected = C^{-1} @ w_ideal using numpy.linalg.solve; (3) computes directivity by numerically integrating |AF(theta)|^2 sin(theta) over theta using 20001-point trapezoidal rule; (4) extracts element impedance from Touchstone S1P data by interpolating S11 and converting via Z=Z0*(1+S11)/(1-S11); (5) uses lib.txline for impedance matching after converting wavelengths to degrees (*360); (6) chains Friis equation link budget with mismatch losses from both TX and RX sides."""
