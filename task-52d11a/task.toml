difficulty_explanation = """Requires expert-level astrodynamics knowledge to derive orbital decay from CCSDS OMM JSON data (a non-trivial space data standard) without any formulas or algorithmic guidance. The agent must independently: (1) use sqlite3 CLI to explore a normalized multi-table geomagnetic database, construct JOINs, and query time-series data; (2) use jq to parse and extract orbital elements from CCSDS OMM JSON — a domain-specific format unfamiliar to most developers; (3) apply Kepler's third law to convert mean motion to semi-major axis; (4) design maneuver detection and temporal alignment strategies; (5) architect a lag-correlation framework; (6) write results back to the SQLite database with proper DDL. The multi-tool interoperability requirement (sqlite3 + jq + Python) combined with the astrodynamics domain knowledge makes this a proficient-level challenge."""
solution_explanation = """Use sqlite3 to query geomag_indices JOIN epoch_info to extract hourly ap/Dst/AE time series. Use jq to extract EPOCH and MEAN_MOTION from OMM JSON. Convert mean motion (rev/day) to semi-major axis via Kepler's third law a=(mu/n^2)^(1/3). Compute consecutive semi-major axis differences, filter to May 2024, exclude non-negative changes (maneuvers). Round epochs to nearest hour and average within bins. For each index and lag 0-48h, shift the index, inner-join with delta-a, compute Pearson r-squared. The ap index at lag ~19 hours gives the highest r-squared (~0.44). Write results to both JSON and a new SQLite table."""
verification_explanation = """Tests verify: (1) results.json exists with correct schema and correct values; (2) SQLite database contains the new correlation_results table with matching data; (3) best_index is 'ap', best_lag_hours is in [16,22], best_r_squared is in [0.30,0.60], n_data_points in [50,90]; (4) intermediate data integrity checks on the source database schema and OMM JSON structure."""
