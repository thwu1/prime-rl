apiVersion: apps/v1
kind: Deployment
metadata:
  name: alpha-webapp # *
  namespace: alpha
spec:
  replicas: 3
  selector:
    matchLabels:
      app: webapp
  template:
    metadata:
      labels:
        app: webapp
    spec:
      containers:
      - name: server # *
        image: myapp:v1.2.0
        ports:
        - containerPort: 8080
          protocol: TCP
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: alpha-app-config # *
  namespace: alpha
data:
  log_level: info
  cache_ttl: "300"
