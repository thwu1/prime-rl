apiVersion: apps/v1
kind: Deployment
metadata:
  name: webapp
spec:
  replicas: 3
  template:
    spec:
      containers:
      - name: server
        image: myapp:v1.3.0
        resources:
          requests:
            memory: 268435456
            cpu: 0.25
          limits:
            memory: 536870912
            cpu: 0.5
