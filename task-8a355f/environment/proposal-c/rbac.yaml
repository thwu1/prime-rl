apiVersion: v1
kind: ServiceAccount
metadata:
  name: deploy-bot
  namespace: prod-backend
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: data-reader
  namespace: prod-data
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: deploy-bot-edit
  namespace: prod-backend
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
subjects:
- kind: ServiceAccount
  name: deploy-bot
  namespace: prod-backend
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: data-reader-secrets
  namespace: prod-data
rules:
- apiGroups: [""]
  resources: ["secrets"]
  verbs: ["*"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: data-reader-secrets-binding
  namespace: prod-data
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: data-reader-secrets
subjects:
- kind: ServiceAccount
  name: data-reader
  namespace: prod-data
