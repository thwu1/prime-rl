# Procurement evaluation scoring configuration

[weights]
amg = 0.30
kripke = 0.25
stream = 0.20
pennant = 0.25

[scoring]
method = "weighted_geometric_mean"
normalization = "reference"
reference_system = "Sierra-2"
confidence_level = 0.95

[quality]
min_valid_runs = 5
max_coefficient_of_variation = 0.15
min_distinct_fom_values = 3
min_run_interval_seconds = 60

[efficiency]
outlier_sigma_threshold = 1.5
min_plausible_efficiency = 0.50
max_plausible_efficiency = 1.00
