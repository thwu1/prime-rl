difficulty_explanation = """Requires expert understanding of 3D object detection evaluation pipelines (Argoverse-style CDS metric) plus proficiency with multiple CLI tools. The agent must: (1) audit a multi-file Python pipeline against a dense technical specification to independently identify 7 interacting bugs spanning Python code, YAML configuration, and GNU Make orchestration — with no hints about what kinds of defects exist; (2) evaluate the severity of each bug by reasoning about its quantitative impact on the CDS and AP metrics, requiring judgment about how errors propagate through the evaluation pipeline; (3) design from scratch a pipeline validation script with at least 8 independent checks that programmatically verify spec compliance. Bugs cross tool boundaries (Make → env var → Python config → metrics) requiring the agent to trace data flow across multiple layers. No reference results are provided."""
solution_explanation = """Fix 7 bugs: (1) preprocessing.py: L2 norm instead of L-inf; (2) overrides.yaml: tp_threshold_m back to 2.0; (3) assignment.py: reverse=True for descending sort; (4) metrics.py: reverse-then-forward precision envelope; (5) metrics.py: atan2 angle wrapping; (6) metrics.py: mean instead of sum for CDS; (7) Makefile: change EVAL_NUM_RECALL_SAMPLES from 11 to 101. Assign severity ratings: critical for bugs that fundamentally corrupt the primary CDS/AP metric (sort order, VOC envelope, CDS formula, Makefile env override), major for bugs that significantly affect component metrics (range filter, config override, angle wrapping). Design a pipeline_validator.py with checks for each specification requirement. Use git log/blame to extract commit SHAs."""
verification_explanation = """Tests verify each Python bug fix via unit tests with controlled synthetic inputs, check the Makefile does not export wrong EVAL_NUM_RECALL_SAMPLES, verify make eval succeeds, validate that audit report entries include valid commit SHAs, severity ratings, and justifications, check pipeline_validator.py exists and passes on the fixed code with sufficient independent checks, and run end-to-end evaluation checking all metrics are in valid ranges."""
