flush ruleset

table inet filter {
    chain input_wan {
        ct state { established, related } accept
        ct state invalid drop
        meta l4proto { icmp, ipv6-icmp } accept
        tcp dport 22 limit rate 3/minute accept
        drop
        tcp dport 8443 accept
    }

    chain input_lan {
        ct state { established, related } accept
        ct state invalid drop
        meta l4proto { icmp, ipv6-icmp } accept
        tcp dport 22 accept
        tcp dport 53 accept
        udp dport 53 accept
        udp dport 67 accept
        tcp dport { 80, 443 } accept
        drop
    }

    chain input {
        type filter hook input priority 0; policy drop;

        iif lo accept
        iifname "eth0" jump input_wan
        iifname "eth1" jump input_lan
    }

    chain forward {
        type filter hook forward priority 0; policy drop;

        ct state { established, related } accept
        ct state invalid drop

        iifname "eth1" oifname "eth0" accept
        iifname "eth0" oifname "eth1" tcp dport { 80, 443 } accept
        iifname "eth0" oifname "eth1" tcp dport 8080 accept
    }

    chain output {
        type filter hook output priority 0; policy accept;
    }
}

table inet nat {
    chain prerouting {
        type nat hook prerouting priority dstnat;

        iifname "eth0" tcp dport 8080 dnat to 192.168.1.100:80
    }

    chain postrouting {
        type nat hook postrouting priority srcnat;

        oifname "eth0" masquerade
    }
}
