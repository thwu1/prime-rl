difficulty_explanation = """Requires expert knowledge of Ruby Marshal deserialization internals and gadget chain construction. The solver must analyze ~20 classes across 7 library files to identify marshal_load entry points, trace method dispatch chains through instance variables across multiple indirection layers, distinguish exploitable code paths from dead ends (sanitizers strip shell metacharacters, allowlists block dangerous methods, some chains lose the command string by passing wrong instance variables), and correctly use Class.allocate with instance_variable_set to craft controlled object graphs that survive Marshal.dump/load round-tripping. This combines offensive security expertise with deep Ruby object model knowledge."""
solution_explanation = """Analyze library code to find classes with marshal_load (Cache::Store, Event::Emitter, Middleware::RequestHandler). Trace method calls on instance variables to find a path from marshal_load to Kernel.system. The primary chain routes through Store.marshal_load → ObjectSerializer.hydrate → Chain.transform → Map.apply → DirectWriter.<< → MethodProxy.call → Kernel.system, carrying the command as the @backend parameter. Construct using Class.allocate and instance_variable_set, then serialize with Marshal.dump."""
verification_explanation = """Tests verify: (1) exploit.rb exists and runs without errors, (2) output is valid base64-encoded Ruby Marshal data with correct magic bytes, (3) running exploit.rb alone does NOT create pwned.txt (anti-cheat), (4) deserializing the payload via deserialize.rb creates /app/pwned.txt through the gadget chain, and (5) exploit uses Marshal.dump to construct a real serialized payload."""
