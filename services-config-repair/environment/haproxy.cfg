global
    log /dev/log local0
    maxconn 4096
    daemon

defaults
    log global
    mode http
    option httplog
    timeout connect 5s
    timeout client 30s
    timeout server 30s

frontend web_front
    bind *:443 ssl crt /etc/ssl/private/server.pem
    bind *:80
    http-request redirect scheme https unless { ssl_fc }

    acl is_api path_beg /api
    acl is_admin path_beg /admin
    acl is_stats path_beg /stats

    use_backend api_backend if is_api
    use_backend admin_backend if is_admin
    use_backend stats_backend if is_stats
    default_backend web_backend

backend web_backend
    balance roundrobin
    server web1 10.0.1.10:80
    server web2 10.0.1.11:80
    server web3 10.0.1.12:80

backend api_backend
    balance leastcon
    option httpchk GET /api/health
    server app1 10.0.1.20:8080 check

backend admin_backend
    server admin1 10.0.1.50:8443 check ssl verify none
