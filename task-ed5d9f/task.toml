difficulty_explanation = """Requires reverse-engineering the behavioral semantics of a compiled KV cache block manager by probing it through an interactive harness, binary analysis tools (nm, strings, readelf, strace, ltrace), and systematic experimentation. The agent must discover undocumented internal mechanisms — including block sharing with reference counting, copy-on-write semantics for forked sequences, content-hash-based prefix caching with LRU eviction, and GPU/CPU memory swapping — purely from observable behavior. Synthesizing these observations into a correct, complete implementation that matches the reference across all edge cases demands expert-level systems programming skill and methodical tool usage."""
solution_explanation = """The solution implements a BlockManager class managing physical blocks across GPU and CPU pools with reference counting. Key mechanisms discovered through reverse-engineering: (1) fork shares block tables, incrementing ref_counts; (2) appending to a shared partial block triggers copy-on-write; (3) prefix caching indexes full blocks by content hash (tuple of token IDs), reusing matching blocks and using LRU eviction for evictable blocks with ref_count 0; (4) swap copies blocks between GPU and CPU pools with ref_count management; (5) preemption victim selection uses LIFO order among active sequences."""
verification_explanation = """27 pytest tests verify exact memory accounting (blocks used, cached, free) after deterministic operation sequences. Tests cover: basic allocation/deallocation, block boundary handling, fork with copy-on-write semantics (partial vs full last block), GPU-CPU swapping (both directions and failure modes), prefix cache hits/misses/eviction/active sharing, preemption victim selection ordering, and complex multi-operation scenarios including fork chains and prefix-cache interactions."""
