dag_id: data_remediation
schedule: "dataset:data_corrections"
default_pool: io_pool
max_active_runs: 1
tasks:
  apply_corrections:
    pool_slots: 2
    duration_estimate_minutes: 10
  revalidate:
    pool_slots: 1
    duration_estimate_minutes: 8
    upstream: [apply_corrections]
  republish:
    pool_slots: 2
    duration_estimate_minutes: 5
    upstream: [revalidate]
datasets:
  produces: [orders_raw]
  consumes: [data_corrections]
