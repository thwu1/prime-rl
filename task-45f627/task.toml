difficulty_explanation = """Requires expert-level understanding of Apache Flink streaming join state management, DAG topology analysis, and queueing theory. The agent must: (1) read a domain reference document and derive exact quantitative formulas for streaming join buffer sizing, cascaded state propagation, and Little's Law capacity planning — no formulas are provided explicitly; (2) implement graph algorithms for maximal cascaded join chain detection via DFS with greedy sub-chain extraction to handle diamond topologies and mixed join type/key eligibility constraints; (3) produce output in three distinct formats — JSON report conforming to a strict schema, Graphviz DOT visualizations with correctly labeled nodes/edges, and a SQLite database with per-join-side state breakdowns; (4) orchestrate a multi-tool pipeline using Make, jq, graphviz dot, check-jsonschema, and sqlite3. No skeleton code is provided — the agent must design the entire solution architecture from raw execution plan data and a conceptual reference document."""
solution_explanation = """Write a Python program that: (1) parses YAML config and loads JSON execution plans; (2) builds a node index and computes per-join state as rate*TTL*row_size for both inputs, resolving effective rates through the DAG for cascaded joins; (3) constructs a join-to-join DAG, finds maximal chains via DFS from root joins, then uses a greedy sliding window to extract maximal eligible contiguous sub-chains where all joins are INNER/LEFT and share a common key; (4) for each eligible sub-chain, collects leaf sources and computes state savings (cascaded vs source-only); (5) applies ceil(QPS*latency*safety_factor) for async queue depth and derives parallelism/memory; (6) generates Graphviz DOT files with labeled nodes and edges; (7) populates a SQLite database with per-join state breakdowns, multi-join opportunities, and async configs; (8) outputs JSON conforming to the provided schema. The diamond topology in realtime_dashboard requires sub-chain detection: the full chain [6,7,9] is ineligible (session_id breaks common key), but sub-chain [6,7] sharing page_id is eligible."""
verification_explanation = """Tests run the full pipeline end-to-end and verify: (a) 50+ exact numerical values in the JSON report across four plans including join state totals, multi-join opportunity detection (positive case with 3-way chain, sub-chain detection from diamond topology, negative cases for single join and FULL-join-blocked chain), savings bytes and percentages, and capacity planning outputs for three async ML_PREDICT nodes; (b) Graphviz DOT files exist and contain correct node names, join type labels, edge connections, and source rates; (c) SVG files are rendered and contain valid SVG markup; (d) SQLite database exists with correct table schemas, row counts, per-join-side state breakdowns, and plan totals matching the JSON report; (e) Makefile pipeline targets (validate-input, validate-output) succeed using jq and check-jsonschema."""
