difficulty_explanation = """Requires expert knowledge of SMT-based program synthesis, including encoding combinatorial search over program structure as constraint satisfaction, designing verification loops, and handling a 10-operation DSL with up to 5-deep compositions over 4 inputs. The search space is billions of candidate programs that only formal methods can tractably prune. Hidden test oracles ensure the synthesizer is general-purpose, not hard-coded."""
solution_explanation = """The solution encodes each candidate program as Z3 Int variables for per-instruction operation and operand selectors, plus BitVec(16) data-flow variables per I/O example. If-Then-Else chains model register selection and operation dispatch. Symmetry-breaking constraints prune the search space. A CEGIS loop iteratively deepens program size (1..5 instructions), solves for a candidate, verifies it against the oracle on random inputs, and adds counterexamples until convergence or exhaustion."""
verification_explanation = """Tests verify that (1) synthesized JSON programs for all 5 provided oracles are correct on 50000 random inputs with a fixed seed, and (2) the synthesize() function generalizes to 3 previously-unseen oracle functions, each requiring multi-instruction programs. This prevents hard-coding and validates the synthesis engine end-to-end."""
