solution_explanation = """Parse the broken YAML, robot spec, and simulation logs. Run and evaluate the provided validation tool, identifying its false positive (controller_frequency flagged at 20Hz), false negatives (angular velocity smoother PASS when it should FAIL, inflation radius PASS despite 0.30m mismatch), and missing checks (model_dt, acceleration limits, critic thresholds). Independently analyze the configuration to find all 10 bugs. Classify simulation log entries as config-caused vs environmental. Fix each parameter respecting robot spec constraints and inter-parameter math. Produce a justified diagnosis report, corrected YAML, and parameter change justification with evidence."""
verification_explanation = """Tests parse the diagnosis report JSON to verify all 10 issue categories are detected via keyword matching, check that environmental observations are separately cataloged, verify the fixed YAML satisfies 13+ mathematical constraint relationships, and confirm the parameter justification covers key changes with substantive rationale."""
