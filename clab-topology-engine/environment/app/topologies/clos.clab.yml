name: datacenter
mgmt:
  ipv4-subnet: 10.100.0.0/24
  ipv6-subnet: 3fff:10:100::/64
topology:
  defaults:
    env:
      CLAB_LAB: datacenter
  kinds:
    linux:
      image: ghcr.io/hellt/network-multitool
      env:
        NET_TOOLS: "true"
    host:
      image: alpine:latest
  nodes:
    spine1:
      kind: linux
      group: spines
      labels:
        role: spine
    spine2:
      kind: linux
      group: spines
      labels:
        role: spine
    leaf1:
      kind: linux
      group: leaves
      labels:
        role: leaf
      env:
        LEAF_ID: "1"
    leaf2:
      kind: linux
      group: leaves
      labels:
        role: leaf
      env:
        LEAF_ID: "2"
    client1:
      kind: host
      labels:
        role: client
    client2:
      kind: host
      labels:
        role: client
  links:
    - endpoints: ["spine1:eth1", "leaf1:eth1"]
    - endpoints: ["spine1:eth2", "leaf2:eth1"]
    - endpoints: ["spine2:eth1", "leaf1:eth2"]
    - endpoints: ["spine2:eth2", "leaf2:eth2"]
    - endpoints: ["leaf1:eth3", "client1:eth1"]
    - endpoints: ["leaf2:eth3", "client2:eth1"]
