# CSG scene requiring cubes, cylinders, groups, and CSG operations
camera:
  width: 100
  height: 75
  field_of_view: 1.2
  from: [0, 2.5, -5]
  to: [0, 0.5, 0]
  up: [0, 1, 0]

light:
  position: [-5, 5, -5]
  intensity: [1, 1, 1]

materials:
  floor_mat:
    color: [0.9, 0.9, 0.9]
    specular: 0.0
    reflective: 0.15
  blue_body:
    color: [0.1, 0.3, 0.8]
    diffuse: 0.7
    specular: 0.3
  red_cube:
    extend: blue_body
    color: [0.8, 0.15, 0.1]
    diffuse: 0.8
    specular: 0.5

objects:
  # Floor plane
  - type: plane
    material: floor_mat

  # Sphere with three cylindrical holes drilled through it (CSG difference)
  - type: csg
    operation: difference
    left:
      type: sphere
      transform:
        - [translate, 0, 1, 0]
      material: blue_body
    right:
      type: group
      children:
        - type: cylinder
          min: -1.5
          max: 1.5
          closed: true
          transform:
            - [scale, 0.3, 1, 0.3]
            - [translate, 0, 1, 0]
        - type: cylinder
          min: -1.5
          max: 1.5
          closed: true
          transform:
            - [scale, 0.3, 1, 0.3]
            - [rotate_x, 1.5708]
            - [translate, 0, 1, 0]
        - type: cylinder
          min: -1.5
          max: 1.5
          closed: true
          transform:
            - [scale, 0.3, 1, 0.3]
            - [rotate_z, 1.5708]
            - [translate, 0, 1, 0]

  # Standalone rotated cube
  - type: cube
    transform:
      - [scale, 0.6, 0.6, 0.6]
      - [rotate_y, 0.6]
      - [translate, 2.2, 0.6, 0.5]
    material: red_cube

  # Rounded cube via CSG intersection of cube and sphere
  - type: csg
    operation: intersection
    left:
      type: cube
      transform:
        - [scale, 0.8, 0.8, 0.8]
        - [translate, -2, 0.8, -1]
      material:
        color: [0.2, 0.8, 0.2]
        diffuse: 0.6
        specular: 0.4
    right:
      type: sphere
      transform:
        - [translate, -2, 0.8, -1]
      material:
        color: [0.2, 0.8, 0.2]
