# Test 2: Branching with interval refinement
# Tests: unknown input, branch condition refinement, nested branches, join at merge

ENTRY B0
VARS x y

BLOCK B0
  x = ?
  BRANCH x >= 0 B1 B2

BLOCK B1
  BRANCH x <= 100 B3 B2

BLOCK B2
  y = 0
  GOTO B4

BLOCK B3
  y = x * 2
  GOTO B4

BLOCK B4
  RETURN
