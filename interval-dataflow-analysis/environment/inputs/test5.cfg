# Test 5: Multiplication with negative intervals
# Tests: interval multiplication where operands span zero, nested branch refinement

ENTRY B0
VARS x y z

BLOCK B0
  x = ?
  BRANCH x >= -5 B1 B4

BLOCK B1
  BRANCH x <= 5 B2 B4

BLOCK B2
  y = x * x
  z = y + 1
  GOTO B3

BLOCK B3
  GOTO B4

BLOCK B4
  RETURN
