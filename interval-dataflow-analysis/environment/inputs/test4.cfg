# Test 4: Division with bounded input
# Tests: division with guaranteed non-zero divisor, chained arithmetic

ENTRY B0
VARS a b c d

BLOCK B0
  a = ?
  BRANCH a >= 1 B1 B2

BLOCK B1
  BRANCH a <= 10 B3 B2

BLOCK B2
  d = 0
  GOTO B4

BLOCK B3
  b = 100 / a
  c = b + 1
  d = c * 2
  GOTO B4

BLOCK B4
  RETURN
