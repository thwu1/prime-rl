[package]
name = "signal-net"
version = "0.5.0"
edition = "2021"

[dependencies]
signal-core = { path = "../signal-core", features = ["std", "serde-support"] }
serde = { version = "1.0.190", features = ["derive"] }
serde_json = "1.0.108"

[dev-dependencies]
signal-core = { path = "../signal-core", features = ["test-utils"] }
