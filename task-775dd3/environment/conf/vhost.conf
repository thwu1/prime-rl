<VirtualHost *:80>
    ServerName localhost
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options FollowSymLinks
        AllowOverride None
        Require all granted
    </Directory>

    # Clean URL rewriting for static resources
    RewriteEngine On
    RewriteRule "^/resources/(.*)$" "/$1.html" [QSA]

    # PHP processing via FPM (TCP connection)
    <FilesMatch "\.php$">
        SetHandler "proxy:fcgi://127.0.0.1:9000"
    </FilesMatch>

    # Protect internal configuration file
    <Files "credentials.php">
        Require all denied
    </Files>

    DirectoryIndex index.html index.php
</VirtualHost>
