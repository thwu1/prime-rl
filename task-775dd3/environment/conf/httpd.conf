ServerRoot "/usr/local/apache2"
Listen 80

User www-data
Group www-data

# Load required modules (IfModule guards handle static-vs-shared safely)
<IfModule !mpm_prefork_module>
    LoadModule mpm_prefork_module modules/mod_mpm_prefork.so
</IfModule>
<IfModule !rewrite_module>
    LoadModule rewrite_module modules/mod_rewrite.so
</IfModule>
<IfModule !proxy_module>
    LoadModule proxy_module modules/mod_proxy.so
</IfModule>
<IfModule !proxy_fcgi_module>
    LoadModule proxy_fcgi_module modules/mod_proxy_fcgi.so
</IfModule>
<IfModule !dir_module>
    LoadModule dir_module modules/mod_dir.so
</IfModule>
<IfModule !mime_module>
    LoadModule mime_module modules/mod_mime.so
</IfModule>
<IfModule !log_config_module>
    LoadModule log_config_module modules/mod_log_config.so
</IfModule>
<IfModule !unixd_module>
    LoadModule unixd_module modules/mod_unixd.so
</IfModule>
<IfModule !authz_core_module>
    LoadModule authz_core_module modules/mod_authz_core.so
</IfModule>
<IfModule !authz_host_module>
    LoadModule authz_host_module modules/mod_authz_host.so
</IfModule>
<IfModule !authn_core_module>
    LoadModule authn_core_module modules/mod_authn_core.so
</IfModule>
<IfModule !access_compat_module>
    LoadModule access_compat_module modules/mod_access_compat.so
</IfModule>
<IfModule !alias_module>
    LoadModule alias_module modules/mod_alias.so
</IfModule>

ServerAdmin admin@localhost
ServerName localhost

PidFile "logs/httpd.pid"
ErrorLog "logs/error_log"
LogLevel warn
LogFormat "%h %l %u %t \"%r\" %>s %b" common
CustomLog "logs/access_log" common

TypesConfig conf/mime.types

# Default security: deny root filesystem
<Directory />
    Options FollowSymLinks
    AllowOverride None
    Require all denied
</Directory>

# Allow /usr/share (mimics default Debian/Ubuntu Apache configuration)
<Directory /usr/share>
    AllowOverride None
    Require all granted
</Directory>

Include conf/extra/vhost.conf
