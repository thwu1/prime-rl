solution_explanation = """Use sqlite3 to query the reference database and jq to parse embedded JSON arrays. Discover input-output patterns for coefficient computation, extrapolation, covariance-aware variance estimation, constrained variance-minimizing shot allocation with integer rounding, and adaptive multi-round procedure. Implement all methods in the optimizer class based on discovered relationships. Build extract_and_validate.sh using sqlite3+jq pipelines to extract reference data and python3 to compare optimizer outputs, writing a structured validation report."""
verification_explanation = """18 pytest tests verify: coefficient correctness and mathematical properties, extrapolation exactness for polynomials, covariance-aware variance estimation against known analytical values, allocation constraint satisfaction and optimality, ZNE variance formula correctness, end-to-end statistical tests (ZNE improves over noisy, adaptive outperforms uniform), and a validation pipeline test that checks the shell script exists with sqlite3+jq invocations, runs it, and verifies the JSON report structure with all_passed=true."""
