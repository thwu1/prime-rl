############################################################################
#
# DFTB+ tagdiff configuration file
#
# Fields separated by '@':
#   1: regex pattern (matched against entry tag line name:type:rank:shape)
#   2: Absolute tolerance (atol)
#   3: Comparison method (element | vector:N) - default: element
#   4: Flags (keep | nokeep) - default: nokeep
#   5: Relative tolerance (rtol:VALUE) - optional
#
# Tolerance check: passes when diff <= max(atol, rtol * max_ref_magnitude)
# max_ref_magnitude = max absolute value among reference entry's values
# When rtol is absent, only atol applies.
# When max_ref_magnitude is zero, only atol applies.
#
# Patterns are matched in order; general patterns should be last.
# Lines starting with # are comments.
#
############################################################################

# Specific quantity tolerances
orbital_charges:    @ 1.0e-6
forces:             @ 1.0e-6
total_energy:       @ 1.0e-6
end_coords:         @ 1.0e-6
mermin_energy:      @ 1.0e-6

# General rules for non-explicitly specified properties
.*:real:            @ 1.0e-6
.*:integer:.*:      @ 0
.*:complex:         @ 1.0e-4
.*:logical:         @ 0
