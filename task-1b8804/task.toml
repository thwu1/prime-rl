schema_version = "1.2"

[metadata]
author_name = "Task Generator"
author_email = "author@example.com"
difficulty_explanation = """Requires building a three-part Sokoban toolchain: (1) a level auditor that must discover and classify structural defects (malformed levels) and logical unsolvability (initial deadlock states) across unvalidated contributed levels, without being told what defects exist; (2) a general-purpose solver using A*/IDA* search with deadlock detection and minimum-cost matching heuristic capable of handling up to 6 boxes (XSokoban Level 1); (3) a multi-tool analysis pipeline integrating SQLite3 for structured storage, Graphviz DOT generation for solution visualization, and SVG rendering. The agent must investigate levels to diagnose issues, implement detection logic for discovered failure modes, and orchestrate Python, SQLite3, and Graphviz through bash."""
solution_explanation = """The auditor parses each level, checks for malformations (missing player, box/goal count mismatch), then performs deadlock analysis (corner deadlocks, wall-edge deadlocks) on initial box positions to classify unsolvable levels. The solver uses weighted A* search over push-macro states with minimum-cost matching heuristic and multi-level deadlock detection. The pipeline stores results in SQLite3, simulates solutions step-by-step to generate Graphviz DOT digraphs with board-state node labels, and renders SVG via the dot CLI."""
verification_explanation = """Tests verify: (1) audit.sh correctly classifies all 7 provided levels AND 3 hidden levels (solvable/unsolvable/malformed) to prevent hardcoded answers; (2) solver produces valid solutions verified by step-by-step simulation on provided and hidden levels; (3) pipeline outputs are checked for correct SQLite schema and data consistency, DOT graph structure with correct node count, and SVG generation. Hidden levels test generalization of both auditor and solver."""
category = "algorithms"
tags = ["search-algorithms", "multi-tool-pipeline"]
expert_time_estimate_hours = 3.5

