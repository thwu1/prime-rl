difficulty_explanation = """Requires coupling expertise in computational geochemistry (mass-action equilibrium, Debye-Huckel activity models, charge/mass balance), numerical methods (Newton-Raphson for coupled nonlinear systems with under-relaxation), and Go systems programming (JSON/YAML parsing, matrix algebra). The solver must handle multi-species ion pairing, activity coefficient feedback on ionic strength, and temperature-dependent logK interpolation. Debugging convergence failures in this coupled system demands proficient-level reasoning about the interplay between thermodynamics and numerics."""
solution_explanation = """The reference solution implements a Newton-Raphson solver with finite-difference Jacobian. Basis species with fixed activity have molality derived from a/gamma; those with bulk_moles are NR unknowns. The charge-balance species' mass-balance equation is replaced by sum(z_i*m_i)=0. Secondary species molalities come from mass-action: m_j = product(a_basis^nu) / (gamma_j * K_j). Activity coefficients are recomputed each iteration from ionic strength using the B-dot formula. Under-relaxation caps Newton steps to prevent negative concentrations. Mineral saturation indices are computed post-convergence as SI = log10(Q/K)."""
verification_explanation = """Tests verify internal self-consistency of the equilibrium solution: (1) mass-action law for every secondary species matches database logK within 0.01, (2) mass balance for each bulk-constrained component within 0.1%, (3) charge balance error below 1e-10, (4) activity coefficients match B-dot formula at reported ionic strength within 0.1%, (5) ionic strength self-consistent with reported molalities, (6) mineral saturation indices correctly computed, (7) temperature interpolation produces logK between bracketing values."""
