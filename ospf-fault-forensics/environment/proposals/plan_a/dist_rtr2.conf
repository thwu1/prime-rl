!
! FRR configuration file - dist_rtr2
! Distribution Router - Building B
! Last modified: 2026-06-01 by achen (remediation plan A)
!
frr version 9.1.3
frr defaults traditional
hostname dist_rtr2
log syslog informational
log file /var/log/frr/frr.log
no ipv6 forwarding
service integrated-vtysh-config
!
debug ospf event
debug ospf nsm
!
interface eth0
 description Uplink to core_rtr
 ip address 172.16.0.3/31
 ip ospf hello-interval 10
 ip ospf dead-interval 40
 ip ospf cost 10
 ip ospf network point-to-point
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 0spfS3cret!
!
interface eth1
 description LAN - Building B hosts (10.2.0.0/24)
 ip address 10.2.0.1/24
 ip ospf hello-interval 10
 ip ospf dead-interval 40
 ip ospf cost 10
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 0spfS3cret!
!
interface lo
 description Loopback - Router ID
 ip address 2.2.2.2/32
!
! ============================================================
! Access lists
! ============================================================
access-list 10 remark VTY management access
access-list 10 permit 172.16.0.0 0.0.0.255
access-list 10 permit 10.2.0.0 0.0.0.255
access-list 10 deny any
!
! ============================================================
! Prefix lists
! ============================================================
ip prefix-list LOCAL_NETS seq 5 permit 10.2.0.0/24
ip prefix-list LOCAL_NETS seq 10 permit 2.2.2.2/32
!
ip prefix-list TRANSIT seq 5 permit 172.16.0.2/31
!
! ============================================================
! OSPF configuration
! ============================================================
router ospf
 ospf router-id 2.2.2.2
 log-adjacency-changes detail
 auto-cost reference-bandwidth 10000
 passive-interface default
 no passive-interface eth0
 ! eth1 remains passive (host-facing LAN)
 network 172.16.0.2/31 area 0
 network 10.2.0.0/24 area 0
 network 2.2.2.2/32 area 0
 area 0 authentication message-digest
!
line vty
 exec-timeout 60 0
 access-class 10
!
end
