!
! FRR configuration file - core_rtr
! Enterprise Core Router
! Last modified: 2026-05-28 by netops
!
frr version 9.1.3
frr defaults traditional
hostname core_rtr
log syslog informational
log file /var/log/frr/frr.log
no ipv6 forwarding
service integrated-vtysh-config
!
debug ospf event
debug ospf lsa
debug ospf nsm
debug ospf packet hello detail
!
interface eth0
 description Link to dist_rtr1 - Building A
 ip address 172.16.0.0/31
 ip ospf hello-interval 10
 ip ospf dead-interval 40
 ip ospf cost 10
 ip ospf network point-to-point
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 0spfS3cret!
!
interface eth1
 description Link to dist_rtr2 - Building B
 ip address 172.16.0.2/31
 ip ospf hello-interval 10
 ip ospf dead-interval 40
 ip ospf cost 10
 ip ospf network point-to-point
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 0spfS3cret!
!
interface eth2
 description Link to dist_rtr3 - Building C
 ip address 172.16.0.4/31
 ip ospf hello-interval 10
 ip ospf dead-interval 40
 ip ospf cost 10
 ip ospf network point-to-point
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 0spfS3cret!
!
interface eth3
 description Server farm LAN
 ip address 10.100.0.1/24
 ip ospf hello-interval 10
 ip ospf dead-interval 40
 ip ospf cost 5
 ip ospf authentication message-digest
 ip ospf message-digest-key 1 md5 0spfS3cret!
!
interface lo
 description Loopback - Router ID
 ip address 1.1.1.1/32
!
! ============================================================
! Access lists for VTY and SNMP management access
! ============================================================
access-list 10 remark Management access - infrastructure only
access-list 10 permit 172.16.0.0 0.0.0.255
access-list 10 permit 10.100.0.0 0.0.0.255
access-list 10 deny any
!
access-list 20 remark SNMP community access
access-list 20 permit 10.100.0.10 0.0.0.0
access-list 20 permit 10.100.0.11 0.0.0.0
access-list 20 deny any
!
! ============================================================
! Prefix lists for route policy
! ============================================================
ip prefix-list LOOPBACKS seq 5 permit 1.1.1.0/24 ge 32
ip prefix-list LOOPBACKS seq 10 permit 2.2.2.0/24 ge 32
!
ip prefix-list TRANSIT_LINKS seq 5 permit 172.16.0.0/16 le 31
!
ip prefix-list SERVER_FARM seq 5 permit 10.100.0.0/24
!
! Bogon filter - standard practice
ip prefix-list BOGON_FILTER seq 5 deny 0.0.0.0/0
ip prefix-list BOGON_FILTER seq 10 deny 127.0.0.0/8 le 32
ip prefix-list BOGON_FILTER seq 15 deny 169.254.0.0/16 le 32
ip prefix-list BOGON_FILTER seq 20 deny 224.0.0.0/4 le 32
ip prefix-list BOGON_FILTER seq 100 permit 0.0.0.0/0 le 32
!
! Maintenance filter - applied during dist_rtr3 firmware upgrade window
! Ticket: NET-4471 (2026-04-15)
ip prefix-list MAINT_FILTER seq 5 deny 10.3.0.0/24
ip prefix-list MAINT_FILTER seq 100 permit 0.0.0.0/0 le 32
!
! ============================================================
! Route maps for OSPF metric adjustment
! ============================================================
route-map OSPF_METRIC_ADJUST permit 10
 match ip address prefix-list SERVER_FARM
 set metric 5
!
route-map OSPF_METRIC_ADJUST permit 20
 match ip address prefix-list LOOPBACKS
 set metric 1
!
route-map OSPF_METRIC_ADJUST permit 100
!
! ============================================================
! OSPF configuration
! ============================================================
router ospf
 ospf router-id 1.1.1.1
 log-adjacency-changes detail
 auto-cost reference-bandwidth 10000
 passive-interface default
 no passive-interface eth0
 no passive-interface eth1
 no passive-interface eth2
 no passive-interface eth3
 network 172.16.0.0/31 area 0
 network 172.16.0.2/31 area 0
 network 172.16.0.4/31 area 0
 network 10.100.0.0/24 area 0
 network 1.1.1.1/32 area 0
 area 0 authentication message-digest
 ! Apply maintenance window filter - see ticket NET-4471
 distribute-list prefix MAINT_FILTER in
!
line vty
 exec-timeout 60 0
 access-class 10
!
end
