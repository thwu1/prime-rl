schema_version = "1.2"

[metadata]
author_name = "Task Generator"
author_email = "author@example.com"
difficulty_explanation = """Requires expert-level DNS protocol knowledge and non-trivial terminal tool proficiency. The solver must decode a pcap capture file using tshark or tcpdump to extract reference DNS query-response pairs, interpret wire-format fields across answer/authority/additional sections, compare reference behavior against the live broken server using dig with port-specific flags, identify 7+ distinct protocol-compliance defects spanning both bugs in existing code and entirely unimplemented features, then design and implement correct fixes in Python. The forensic workflow demands fluency with network analysis tools (tshark display filters, field extraction, pcap navigation), DNS debugging tools (dig query options), and deep understanding of DNS wire-format encoding, record type semantics, and response-section conventions."""
solution_explanation = """The solution parses the reference pcap binary to extract all DNS response packets, analyzes each response to discover required behavioral features (CNAME chaining, TXT character-string encoding, EDNS0, negative-response SOA, MX glue, case insensitivity, single-label wildcards), then generates a corrected server by extracting the working zone parser from the broken server and combining it with conditionally-generated handler code driven by the pcap analysis. Key fixes: iterative CNAME chain following, case-insensitive domain name lookups via .lower() normalization, proper TXT character-string encoding with per-string length-byte prefixes, EDNS0 OPT pseudo-record detection and echo, single-label-only wildcard matching, SOA record in authority section for NXDOMAIN and NODATA negative responses (RFC 2308), and A glue records for MX exchange targets in the additional section."""
verification_explanation = """Tests start the DNS server as a subprocess, then send raw DNS wire-format queries via UDP socket and parse binary responses. 22 tests verify: basic A/AAAA lookups, multiple A records, single and chained CNAME resolution, MX with priorities, TXT records with correct character-string encoding, SRV records, SOA record, NS records, NXDOMAIN for deep non-existent names, NODATA for existing names with missing type, wildcard matching for single-label children, wildcard override by explicit record, case insensitivity, AA flag, EDNS0 OPT echo, SOA in authority for NXDOMAIN (RFC 2308), SOA in authority for NODATA (RFC 2308), and MX glue A records in the additional section."""
category = "networking"
tags = ["dns", "pcap-forensics"]
expert_time_estimate_hours = 2.5

[verifier]
network_mode = "no-network"
timeout_sec = 300.0

[agent]
network_mode = "no-network"
timeout_sec = 3600.0

[environment]
