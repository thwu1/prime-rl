[project]
name = "vmvm-tb"
version = "0.1.0"
description = "Terminal-Bench eval env for PRIME-RL on the VMVM pool (Terminus-2 protocol, vacli backend)"
requires-python = ">=3.12"
dependencies = ["verifiers", "datasets", "pydantic"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vmvm_tb"]
