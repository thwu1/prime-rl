[project]
name = "vmvm-tb-v2"
version = "0.1.0"
description = "Terminal-Bench eval env for PRIME-RL on the VMVM pool (Terminus-2 protocol, vacli backend) — v2: v1 + tool_response-wrapped env observations so train and eval both preserve prior-turn thinking (aligned last_query_index)"
requires-python = ">=3.12"
dependencies = ["verifiers", "datasets", "pydantic"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["vmvm_tb_v2"]
