difficulty_explanation = """Requires the agent to explore a multi-file research workspace, diagnose why an existing Manhattan-distance IDA* solver times out on hard 15-puzzle instances, discover that benchmark data uses heterogeneous formats with unsolvable configurations mixed in, implement solvability detection via inversion-parity analysis, and build a performant optimal solver using disjoint additive pattern database heuristics (5-5-5 partition, Lehmer-code indexing, 0-1 BFS construction). The agent must independently determine that Manhattan distance is computationally infeasible for instances with 40+ move optimal solutions and research/implement pattern databases."""
solution_explanation = """Preprocess data files to handle two different formats (labeled Korf instances, unlabeled mixed set). Filter unsolvable configurations via inversion counting. Build three 5-5-5 disjoint pattern databases via reverse BFS from goal states, each with P(16,6)≈5.77M entries. Use IDA* with summed PDB lookups as an admissible additive heuristic to find provably optimal solutions. Export results as JSON."""
