[metadata]
author_name = "Task Generator"
author_email = "author@example.com"
difficulty_explanation = """The agent must implement two mathematically non-trivial functions from scratch (inverse Jacobian elliptic cosine and the equiripple rational function), identify and fix multiple subtle numerical bugs in the existing code (incorrect recurrence formula in cd(), wrong denominator exponent in pole computation, missing gain normalization), fix a broken C build system (missing linker flags), and orchestrate a multi-tool validation pipeline (Python → C analyzer → JSON report). Requires PhD-level understanding of Jacobian elliptic functions and analog filter theory, plus proficiency with gcc/make build systems and multi-tool data pipelines."""
solution_explanation = """Five issues in the Python module must be addressed: (1) Implement cd_inv() using Landen descending recursion — at each step transform y_new = 2*y / ((1+k_next)*(1+sqrt(1-k^2*y^2))), track K via product of (1+k_next), then x = K * (2/pi)*arccos(y_bottom). (2) Implement elliptic_rational() using the factored product form with zeros z_n = cd(K*(2n+1)/N, k). (3) Fix cd() ascending recursion: denominator must use val*val not val — the correct formula is (1+k_n)*val/(1+k_n*val^2). (4) Fix pole denominator in elliptic_filter_poles_zeros: must be (di*sv_val)**2 not (di*sv_val). (5) Implement gain computation: gain = |H0_target * prod(-poles) / prod(-zeros)| where H0 = 1 for odd N, 1/sqrt(1+eps^2) for even N. Additionally, the Makefile must have -lm added to LDFLAGS, the C tool must be built, and the validation report must be generated by running the full pipeline."""
verification_explanation = """Tests compare all Python outputs against scipy.signal.ellip (zpk output) and scipy.special.ellipk for multiple filter orders (3-9), ripple values, and attenuations. Poles and zeros are matched after sorting by imaginary part magnitude with 1e-7 relative tolerance. Additional tests verify K(k), cd(x,k), cd_inv, and R_N(x) against known values and mathematical identities. A source-level check ensures the module does not import scipy or mpmath. The C tool is tested by computing frequency response for a known Butterworth filter and comparing against the analytical value. The validation report is checked for correct structure, reasonable gain values, and correct pole/zero counts."""
