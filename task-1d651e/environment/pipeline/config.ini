[paths]
instance_dir = /app/data/instances
scenario_dir = /app/data/scenarios
output_dir = /app/output
solver_script = /app/pipeline/solver.py

[solver]
time_limit_sec = 90
use_lp_bounds = true
lp_solver_cmd = glpsol
lp_model_template = /app/tools/relax_template.mod

[validation]
validator = /app/tools/validate.py
distance_metric = euclidean
