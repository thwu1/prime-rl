<!DOCTYPE html>
<html lang="en">
<head><title>Dashboard - Analytics Portal</title></head>
<body>
<a href="#main">Skip to main content</a>
<nav>
  <ul>
    <li><a href="/dashboard">Dashboard</a></li>
    <li><a href="/reports">Reports</a></li>
  </ul>
</nav>
<main id="main">
  <h1>Dashboard Overview</h1>
  <img src="logo.png" alt="Acme Corp Logo">
  <img src="divider.png" alt="" role="presentation">
  <p style="color: #333333; background-color: #ffffff;">Welcome to the analytics dashboard.</p>
  <form>
    <label for="search-input">Search:</label>
    <input type="text" id="search-input" name="q">
    <button type="submit">Go</button>
  </form>
  <table>
    <caption>Monthly Statistics</caption>
    <thead>
      <tr><th scope="col">Month</th><th scope="col">Users</th><th scope="col">Revenue</th></tr>
    </thead>
    <tbody>
      <tr><td>January</td><td>1200</td><td>$50,000</td></tr>
      <tr><td>February</td><td>1350</td><td>$55,000</td></tr>
    </tbody>
  </table>
</main>
</body>
</html>
