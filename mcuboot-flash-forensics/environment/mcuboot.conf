# MCUboot configuration overlay for nrf52840dk_nrf52840
# SDK: nRF Connect SDK v2.5.0

CONFIG_BOOT_MAX_IMG_SECTORS=256
CONFIG_BOOT_SIGNATURE_TYPE_RSA=y
CONFIG_BOOT_SIGNATURE_KEY_FILE="root-rsa-2048.pem"
CONFIG_BOOT_VALIDATE_SLOT0=y
CONFIG_BOOT_SWAP_USING_MOVE=n
CONFIG_BOOT_SWAP_USING_SCRATCH=n
CONFIG_BOOT_UPGRADE_ONLY=n
CONFIG_SIZE_OPTIMIZATIONS=y
CONFIG_SINGLE_APPLICATION_SLOT=n
CONFIG_IMG_BLOCK_BUF_SIZE=512
CONFIG_FLASH_AREA_CHECK_INTEGRITY=y
CONFIG_MCUBOOT_CLEANUP_ARM_CORE=y
CONFIG_MCUBOOT_DOWNGRADE_PREVENTION=n
CONFIG_MCUBOOT_LOG_LEVEL_WRN=y
CONFIG_MCUBOOT_SERIAL=n
CONFIG_BOOT_SWAP_SAVE_ENCTLV=n
