# Partition Manager static configuration
# Board: nrf52840dk_nrf52840
# SDK: nRF Connect SDK v2.5.0
mcuboot:
  address: 0x0
  end_address: 0xc000
  placement:
    before:
    - mcuboot_primary
  region: flash_primary
  size: 0xc000
mcuboot_pad:
  address: 0xc000
  end_address: 0xc200
  placement:
    align:
      start: 0x1000
    before:
    - mcuboot_primary_app
  region: flash_primary
  size: 0x200
mcuboot_primary:
  address: 0xc000
  end_address: 0x7e000
  orig_span: &mcuboot_primary_orig_span
  - mcuboot_pad
  - app
  region: flash_primary
  sharers: 0x1
  size: 0x72000
  span: *mcuboot_primary_orig_span
mcuboot_primary_app:
  address: 0xc000
  end_address: 0x7e000
  orig_span: &mcuboot_primary_app_orig_span
  - app
  region: flash_primary
  size: 0x72000
  span: *mcuboot_primary_app_orig_span
app:
  address: 0xc200
  end_address: 0x7e000
  region: flash_primary
  size: 0x71e00
mcuboot_secondary:
  address: 0x7e000
  end_address: 0xf0000
  placement:
    after:
    - mcuboot_primary
    align:
      start: 0x1000
  region: flash_primary
  share_size:
  - mcuboot_primary
  size: 0x72000
settings_storage:
  address: 0xf0000
  end_address: 0x100000
  placement:
    align:
      start: 0x1000
    before:
    - end
  region: flash_primary
  size: 0x10000
