schema_version = "1.2"

[metadata]
author_name = "Task Generator"
author_email = "author@example.com"
difficulty_explanation = """Requires expert-level biomechanics knowledge to implement gait stability analysis from raw kinematic/kinetic data without any algorithmic guidance. The agent must independently: (1) explore an SQLite protocol database to discover sensor calibration parameters and determine how to transform raw sensor readings into physical units — without this calibration step, force signals have a large DC offset that makes gait event detection fail entirely; (2) inspect binary HDF5 files using CLI tools (h5ls, h5dump) to discover hierarchical dataset layouts, coordinate conventions, and attribute metadata before writing code to read them; (3) determine the correct biomechanical model for computing extrapolated center of mass from subject anthropometrics and kinematic data; (4) implement gait event detection from ground reaction force signals; (5) compute spatiotemporal gait parameters and dynamic stability margins with correct sign conventions for forward bipedal locomotion; (6) produce correctly formatted multi-level output (per-run, per-condition aggregated, and summary CSV) conforming to the protocol specification."""
solution_explanation = """The solution queries the SQLite protocol database for sensor calibration parameters (scale_factor=0.001, offset=-5000.0), reads HDF5 files with h5py, applies the calibration formula (calibrated = (raw + offset) * scale_factor) to convert raw GRF from milliNewtons with DC offset to Newtons, detects gait events (heel strikes and toe-offs) by thresholding calibrated vertical GRF at 20N, computes spatiotemporal parameters (step time, step length, step width, cadence, walking speed, stance ratio) from detected events and heel positions, computes XCoM = CoM + v_CoM/sqrt(g/L) at each heel strike using the linear inverted pendulum model, derives MoS as foot_position minus XCoM, and outputs per-run YAML files, per-condition aggregated YAML, and a summary CSV."""
verification_explanation = """Tests verify: (1) the provided output format validator passes, (2) all expected output files exist with correct naming, (3) YAML metrics have required keys and mean/std/unit structure, (4) spatiotemporal values match expected ranges for both normal (~1.3 m/s) and fast (~1.8 m/s) walking, (5) MoS ML is positive and MoS AP is negative (correct sign conventions for forward walking), (6) MoS AP becomes more negative at higher speed (biomechanical consistency), (7) aggregation across runs is consistent with individual run values, (8) summary CSV has correct structure and column set."""
