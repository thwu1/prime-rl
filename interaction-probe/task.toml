schema_version = "1.2"

[metadata]
author_name = "Task Generator"
author_email = "author@example.com"
difficulty_explanation = """Requires expert-level knowledge of browser automation (Playwright), Shadow DOM traversal, mutation detection APIs, and systematic UI exploration. The probe must handle conditional elements hidden behind multi-step state transitions, form validation prerequisites that gate phase changes, and custom web components with encapsulated shadow roots. Correctly ordering interactions (fill inputs before clicking submit buttons) and avoiding destructive actions (reset) before completing discovery demands algorithmic sophistication beyond standard web scraping."""
solution_explanation = """Build a Playwright-based Python probe that: (1) serves the webapp on a local HTTP server, (2) discovers interactive elements iteratively by performing semantic actions and scanning for newly-revealed elements after each action, (3) prioritizes input-filling over button-clicking to satisfy form validation, (4) traverses Shadow DOM boundaries via recursive querySelectorAll on shadowRoot, (5) injects MutationObserver to verify each interaction produces DOM state changes, and (6) outputs a structured JSON report with element inventory, discovery chains, shadow DOM classification, and computed interaction rate."""
verification_explanation = """Pytest validates the report.json against ground truth: exactly 15 interactive elements with correct IDs, correct initially_visible and in_shadow_dom flags for each element, exact discovery chain mappings (3 chains with specific trigger-revealed pairs), all elements producing mutations, and an interaction rate of 1.0."""
category = "web-automation"
tags = ["browser-automation", "shadow-dom"]
expert_time_estimate_hours = 3.0

[verifier]
network_mode = "no-network"
timeout_sec = 600.0

[agent]
network_mode = "no-network"
timeout_sec = 3600.0

[environment]
network_mode = "no-network"
build_timeout_sec = 600.0
cpus = 1
memory_mb = 2048
storage_mb = 10240
gpus = 0
mcp_servers = []

[task]
name = "mobius-tb/interaction-probe"
