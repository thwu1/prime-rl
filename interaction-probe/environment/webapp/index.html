<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Optimizer Benchmark Suite</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, -apple-system, sans-serif; max-width: 900px; margin: 0 auto; padding: 20px; color: #333; }
    h1 { border-bottom: 2px solid #2196F3; padding-bottom: 10px; }
    .phase { border: 1px solid #ddd; padding: 15px; margin: 12px 0; border-radius: 6px; background: #fafafa; }
    .phase h2 { margin-top: 0; color: #1976D2; }
    .hidden { display: none; }
    label { display: block; margin: 8px 0; font-weight: 500; }
    input[type="number"], select { margin-left: 10px; padding: 4px 8px; border: 1px solid #ccc; border-radius: 4px; }
    input[type="checkbox"] { margin-right: 6px; }
    button { margin: 10px 5px 10px 0; padding: 8px 18px; cursor: pointer; border: 1px solid #1976D2; background: #2196F3; color: white; border-radius: 4px; font-size: 14px; }
    button:hover { background: #1565C0; }
    table { width: 100%; border-collapse: collapse; margin: 10px 0; }
    th, td { border: 1px solid #ddd; padding: 8px 12px; text-align: left; }
    th { background: #f5f5f5; }
    th[data-sort] { cursor: pointer; user-select: none; }
    th[data-sort]:hover { background: #e3f2fd; }
    #status { color: #666; font-style: italic; margin: 5px 0; min-height: 20px; }
    .advanced-panel { margin-left: 20px; padding: 10px; background: #f0f4f8; border-left: 3px solid #90CAF9; margin-top: 5px; }
  </style>
</head>
<body>
  <h1>Optimizer Benchmark Suite</h1>
  <p id="status">Ready</p>

  <!-- Phase 1: Setup -->
  <div id="phase-setup" class="phase">
    <h2>Setup</h2>
    <label>Algorithm:
      <select id="algorithm-select">
        <option value="">-- Select --</option>
        <option value="gradient-descent">Gradient Descent</option>
        <option value="newton-method">Newton's Method</option>
        <option value="lbfgs">L-BFGS</option>
      </select>
    </label>
    <label>Iterations:
      <input id="iterations-input" type="number" min="1" max="10000" placeholder="e.g. 100">
    </label>
    <label>Dimensions:
      <input id="dimension-input" type="number" min="1" max="100" placeholder="e.g. 10">
    </label>
    <label>
      <input id="advanced-checkbox" type="checkbox"> Show Advanced Options
    </label>
    <div id="advanced-panel" class="advanced-panel hidden">
      <label>Tolerance:
        <input id="tolerance-input" type="number" step="0.0001" value="0.001" min="0">
      </label>
      <label>Convergence Criterion:
        <select id="convergence-select">
          <option value="absolute">Absolute</option>
          <option value="relative">Relative</option>
          <option value="gradient-norm">Gradient Norm</option>
        </select>
      </label>
    </div>
    <button id="configure-btn">Configure &amp; Continue</button>
  </div>

  <!-- Phase 2: Run -->
  <div id="phase-run" class="phase hidden">
    <h2>Run Simulation</h2>
    <p>Configuration saved. Click below to start the optimization.</p>
    <button id="run-btn">Run Simulation</button>
  </div>

  <!-- Phase 3: Results -->
  <div id="phase-results" class="phase hidden">
    <h2>Results</h2>
    <table id="results-table">
      <thead>
        <tr>
          <th id="sort-iteration" data-sort="iteration" tabindex="0" aria-sort="none">Iteration &#8597;</th>
          <th id="sort-value" data-sort="value" tabindex="0" aria-sort="none">Objective Value &#8597;</th>
          <th id="sort-error" data-sort="error" tabindex="0" aria-sort="none">Error &#8597;</th>
        </tr>
      </thead>
      <tbody id="results-body"></tbody>
    </table>
    <result-chart id="result-chart"></result-chart>
    <div style="margin-top: 10px;">
      <button id="export-csv-btn">Export CSV</button>
      <button id="reset-btn">Reset All</button>
    </div>
  </div>

  <script>
    // ---- State ----
    var config = {};
    var results = [];
    var sortState = { column: null, ascending: true };

    // ---- Custom Element: <result-chart> with Shadow DOM ----
    class ResultChart extends HTMLElement {
      constructor() {
        super();
        var shadow = this.attachShadow({ mode: 'open' });
        shadow.innerHTML =
          '<style>' +
          ':host { display: block; margin: 10px 0; padding: 10px; border: 1px solid #ddd; border-radius: 4px; }' +
          '.controls { margin-bottom: 10px; }' +
          'canvas { border: 1px solid #eee; display: block; }' +
          'label { margin-right: 15px; }' +
          '</style>' +
          '<div class="controls">' +
          '<label>Scale: <select id="scale-select">' +
          '<option value="linear">Linear</option>' +
          '<option value="logarithmic">Logarithmic</option>' +
          '</select></label>' +
          '<label><input id="toggle-gridlines" type="checkbox" checked> Show Gridlines</label>' +
          '</div>' +
          '<canvas id="chart-canvas" width="600" height="250"></canvas>';

        var self = this;
        var scaleSel = shadow.getElementById('scale-select');
        var gridCb = shadow.getElementById('toggle-gridlines');

        scaleSel.addEventListener('change', function() {
          self.setAttribute('data-scale', scaleSel.value);
          self.render();
        });
        gridCb.addEventListener('change', function() {
          self.setAttribute('data-gridlines', String(gridCb.checked));
          self.render();
        });
      }

      setData(data) {
        this._data = data;
        this.render();
      }

      render() {
        var canvas = this.shadowRoot.getElementById('chart-canvas');
        if (!canvas) return;
        var ctx = canvas.getContext('2d');
        var data = this._data || [];
        var scale = this.getAttribute('data-scale') || 'linear';
        var gridlines = this.getAttribute('data-gridlines') !== 'false';

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        if (gridlines) {
          ctx.strokeStyle = '#eee';
          ctx.lineWidth = 1;
          for (var i = 0; i < 10; i++) {
            var gy = (i / 10) * canvas.height;
            ctx.beginPath(); ctx.moveTo(0, gy); ctx.lineTo(canvas.width, gy); ctx.stroke();
          }
        }

        if (data.length > 1) {
          var vals = data.map(function(d) { return d.value; });
          var maxV = Math.max.apply(null, vals);
          var minV = Math.min.apply(null, vals);
          var range = maxV - minV || 1;

          ctx.strokeStyle = '#2196F3';
          ctx.lineWidth = 2;
          ctx.beginPath();
          for (var j = 0; j < data.length; j++) {
            var x = (j / (data.length - 1)) * canvas.width;
            var y;
            if (scale === 'logarithmic' && data[j].value > 0) {
              var logMax = Math.log10(maxV);
              var logMin = Math.log10(Math.max(minV, 0.001));
              var logR = logMax - logMin || 1;
              y = canvas.height - ((Math.log10(data[j].value) - logMin) / logR) * canvas.height;
            } else {
              y = canvas.height - ((data[j].value - minV) / range) * canvas.height;
            }
            if (j === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
          }
          ctx.stroke();
        }

        this.setAttribute('data-rendered', 'true');
      }
    }
    customElements.define('result-chart', ResultChart);

    // ---- Event Handlers ----

    // Algorithm select
    document.getElementById('algorithm-select').addEventListener('change', function(e) {
      document.getElementById('status').textContent = 'Algorithm: ' + (e.target.value || 'None');
    });

    // Iterations input
    document.getElementById('iterations-input').addEventListener('input', function(e) {
      var val = parseInt(e.target.value);
      if (val > 0) {
        document.getElementById('status').textContent = 'Iterations: ' + val;
      }
    });

    // Dimensions input
    document.getElementById('dimension-input').addEventListener('input', function(e) {
      var val = parseInt(e.target.value);
      if (val > 0) {
        document.getElementById('status').textContent = 'Dimensions: ' + val;
      }
    });

    // Advanced checkbox
    document.getElementById('advanced-checkbox').addEventListener('change', function(e) {
      var panel = document.getElementById('advanced-panel');
      if (e.target.checked) {
        panel.classList.remove('hidden');
      } else {
        panel.classList.add('hidden');
      }
    });

    // Tolerance input
    document.getElementById('tolerance-input').addEventListener('input', function(e) {
      document.getElementById('status').textContent = 'Tolerance: ' + e.target.value;
    });

    // Convergence select
    document.getElementById('convergence-select').addEventListener('change', function(e) {
      document.getElementById('status').textContent = 'Convergence: ' + e.target.value;
    });

    // Configure button
    document.getElementById('configure-btn').addEventListener('click', function() {
      var algo = document.getElementById('algorithm-select').value;
      var iters = parseInt(document.getElementById('iterations-input').value);
      var dims = parseInt(document.getElementById('dimension-input').value);

      if (!algo || !iters || iters <= 0 || !dims || dims <= 0) {
        document.getElementById('status').textContent = 'Error: Please fill all required fields with valid values.';
        return;
      }

      config = {
        algorithm: algo,
        iterations: iters,
        dimensions: dims,
        tolerance: parseFloat(document.getElementById('tolerance-input').value) || 0.001,
        convergence: document.getElementById('convergence-select').value
      };

      document.getElementById('status').textContent = 'Configuration saved. Ready to run.';
      document.getElementById('phase-run').classList.remove('hidden');
    });

    // Run button
    document.getElementById('run-btn').addEventListener('click', function() {
      document.getElementById('status').textContent = 'Running simulation...';

      // Generate deterministic synthetic results using a seeded approach
      results = [];
      var value = 100.0;
      var seed = config.dimensions * 7 + config.iterations;
      for (var i = 1; i <= Math.min(config.iterations, 20); i++) {
        seed = (seed * 1103515245 + 12345) & 0x7fffffff;
        var noise = (seed % 1000) / 10000.0;
        var error = value * (0.1 + noise);
        results.push({ iteration: i, value: parseFloat(value.toFixed(6)), error: parseFloat(error.toFixed(6)) });
        value *= (0.87 + noise);
      }

      populateTable(results);
      document.getElementById('phase-results').classList.remove('hidden');
      document.getElementById('status').textContent = 'Simulation complete. ' + results.length + ' iterations.';
      document.getElementById('result-chart').setData(results);
    });

    function populateTable(data) {
      var tbody = document.getElementById('results-body');
      tbody.innerHTML = '';
      for (var i = 0; i < data.length; i++) {
        var tr = document.createElement('tr');
        var td1 = document.createElement('td'); td1.textContent = data[i].iteration;
        var td2 = document.createElement('td'); td2.textContent = data[i].value;
        var td3 = document.createElement('td'); td3.textContent = data[i].error;
        tr.appendChild(td1); tr.appendChild(td2); tr.appendChild(td3);
        tbody.appendChild(tr);
      }
    }

    // Sort handlers
    var sortHeaders = document.querySelectorAll('th[data-sort]');
    for (var si = 0; si < sortHeaders.length; si++) {
      (function(th) {
        th.addEventListener('click', function() {
          var column = th.getAttribute('data-sort');
          if (sortState.column === column) {
            sortState.ascending = !sortState.ascending;
          } else {
            sortState.column = column;
            sortState.ascending = true;
          }

          for (var k = 0; k < sortHeaders.length; k++) {
            sortHeaders[k].setAttribute('aria-sort', 'none');
          }
          th.setAttribute('aria-sort', sortState.ascending ? 'ascending' : 'descending');

          var sorted = results.slice().sort(function(a, b) {
            var diff = a[column] - b[column];
            return sortState.ascending ? diff : -diff;
          });
          populateTable(sorted);
        });
      })(sortHeaders[si]);
    }

    // Export CSV
    document.getElementById('export-csv-btn').addEventListener('click', function() {
      var csv = 'iteration,value,error\n';
      for (var i = 0; i < results.length; i++) {
        csv += results[i].iteration + ',' + results[i].value + ',' + results[i].error + '\n';
      }
      var blob = new Blob([csv], { type: 'text/csv' });
      var url = URL.createObjectURL(blob);
      var a = document.createElement('a');
      a.href = url;
      a.download = 'results.csv';
      a.textContent = 'Download CSV';
      a.style.display = 'block';
      a.style.marginTop = '5px';
      document.getElementById('phase-results').appendChild(a);
      document.getElementById('status').textContent = 'CSV exported.';
    });

    // Reset
    document.getElementById('reset-btn').addEventListener('click', function() {
      document.getElementById('phase-run').classList.add('hidden');
      document.getElementById('phase-results').classList.add('hidden');
      document.getElementById('algorithm-select').value = '';
      document.getElementById('iterations-input').value = '';
      document.getElementById('dimension-input').value = '';
      document.getElementById('advanced-checkbox').checked = false;
      document.getElementById('advanced-panel').classList.add('hidden');
      document.getElementById('results-body').innerHTML = '';
      config = {};
      results = [];
      sortState = { column: null, ascending: true };
      for (var k = 0; k < sortHeaders.length; k++) {
        sortHeaders[k].setAttribute('aria-sort', 'none');
      }
      document.getElementById('status').textContent = 'Ready';
    });
  </script>
</body>
</html>
