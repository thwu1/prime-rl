# Custom filter registry configuration
# These javax.servlet class references are property values, not Java imports.
# OpenRewrite does not process property-file values.
filter.audit.class=javax.servlet.Filter
filter.audit.request-type=javax.servlet.http.HttpServletRequest
filter.audit.response-type=javax.servlet.http.HttpServletResponse
filter.metrics.enabled=true
# JDK package reference - must NOT be changed
filter.datasource.class=javax.sql.DataSource
