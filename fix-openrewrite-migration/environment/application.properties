server.port=8080
server.max-http-header-size=65536
management.endpoints.web.exposure.include=health,info
management.endpoint.configprops.additional-keys-to-sanitize=mySecret
spring.jpa.properties.hibernate.default_schema=myschema
# Custom application properties referencing servlet API class names
app.metrics.filter-class=javax.servlet.Filter
app.metrics.request-class=javax.servlet.http.HttpServletRequest
# JDK package reference - must NOT be changed
app.datasource.type=javax.sql.DataSource
