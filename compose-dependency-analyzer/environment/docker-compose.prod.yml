services:
  postgres:
    deploy:
      resources:
        limits:
          memory: 2G
          cpus: "2.0"
        reservations:
          memory: 1G

  redis:
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M

  auth-api:
    ports:
      - "8080:3000"
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  user-api:
    networks:
      - frontend
      - backend
    ports:
      - "8080:3001"
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 768M

  order-api:
    networks:
      - frontend
      - backend
      - messaging

  notification-worker:
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  api-gateway:
    networks:
      - frontend
      - backend
    deploy:
      resources:
        limits:
          memory: 1G
        reservations:
          memory: 512M

  admin-panel:
    networks:
      - frontend
      - backend

  analytics-worker:
    deploy:
      resources:
        limits:
          memory: 1G
          cpus: "0.5"
        reservations:
          memory: 2G

  product-api:
    environment:
      INVENTORY_URL: "http://inventory-api:4500"

  grafana:
    depends_on:
      prometheus:
        condition: service_healthy
