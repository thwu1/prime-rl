solution_explanation = """Parse the SOFT file by recognizing entity delimiters (^ lines), attribute lines (! lines), and data tables. Extract platform annotations to build probe-to-gene mappings, handling /// separators for multi-gene probes (keep first) and averaging log2 values for multi-probe genes. Extract sample metadata from characteristics fields to reconstruct the experimental design. Compute paired t-tests comparing each patient's tumor to their matched normal within each stage, apply Benjamini-Hochberg correction, and output sorted results."""
