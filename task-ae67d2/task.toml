difficulty_explanation = """Requires deep understanding of quantum error correction concepts (detector error models, Tanner graphs, syndrome decoding), the stim DEM file format semantics (including compound error instructions and separator tokens), sparse matrix construction for parity check representations, probability handling for overlapping error mechanisms, and implementing a decoder that exploits soft information to outperform standard minimum-weight perfect matching. This is research-grade work at the intersection of quantum physics, graph theory, and probabilistic decoding."""
solution_explanation = """Parse the DEM by iterating over flattened error instructions, splitting targets at separator tokens into edge groups, computing hyperedge detector/observable sets via symmetric difference, merging priors for repeated error mechanisms, and building CSC sparse matrices. The decoder runs belief propagation on the check matrix; if BP converges, applies the correction via the observables matrix; otherwise converts BP soft information to per-edge probabilities through the hyperedge-to-edge matrix and uses them as MWPM edge weights."""
verification_explanation = """Tests verify the DEM-to-matrices conversion against known exact values (matrix shapes, entries, and priors) on inline reference DEMs, check matrix dimension consistency on the surface code DEM against config.json, verify decoder output shapes and binary constraints including zero-syndrome behavior, and confirm the decoder achieves fewer or equal errors compared to plain PyMatching MWPM on 500 pre-recorded surface code shots."""
