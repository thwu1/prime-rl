[metadata]
author_name = "Task Generator"
author_email = "author@example.com"
difficulty_explanation = """Requires designing and implementing a peephole optimizer for Hack assembly generated by a stack-based VM translator. The solver must analyze the generated assembly across 9 distinct program types (stack arithmetic, memory access with direct and indirect segments, branching with labels and conditional jumps, recursive function calls with bootstrap code) to identify redundant instruction patterns at VM command boundaries. Key challenge is recognizing that the VM translator's template-based approach creates systematic redundancy — push_d sequences (5 instructions) immediately followed by pop_to_d sequences (3 instructions) cancel out semantically but appear across different VM command translations. The optimizer must match these multi-instruction patterns while avoiding incorrect optimization across labels (which would break jump targets) and preserving correctness for programs with complex control flow like recursive Fibonacci. Additional optimizations such as collapsing redundant @SP dereferences after pop operations into single-instruction equivalents (A=A-1) require understanding register state tracking through the assembly. Meeting the 25-30% reduction targets requires the primary push-pop elimination pattern; lower targets still require correct handling of all program types."""
solution_explanation = """Implement a multi-pass peephole optimizer with two key patterns: (1) Push-Pop Elimination: detect the 8-instruction sequence @SP/A=M/M=D/@SP/M=M+1/@SP/AM=M-1/D=M (push_d immediately followed by pop_to_d) and remove all 8 lines, since D already holds the pushed value and SP returns to its original position. This pattern appears at every boundary where a push VM command is followed by a binary/comparison operation or a direct-segment pop. (2) SP Dereference Optimization: after an intact pop_to_d (@SP/AM=M-1/D=M), the A register holds the new SP value, so a subsequent @SP/A=M-1 (to access the second operand) can be replaced with A=A-1, saving one instruction. The optimizer runs these passes iteratively until convergence (typically 2 iterations). Pattern 1 achieves 18-40% reduction depending on program structure; Pattern 2 adds marginal improvements. The implementation requires ~70 lines of Python with careful sliding-window pattern matching that respects label boundaries."""
verification_explanation = """19 pytest cases organized in 4 classes: TestCorrectness (9 tests) verifies that optimized assembly produces identical RAM states for all programs — SimpleAdd through recursive FibonacciElement with bootstrap; TestReduction (7 tests) checks instruction count reduction meets targets from 15-30% across program types; TestSafety (3 tests) verifies optimizer idempotency, label preservation across FibonacciSeries labels, and correctness on hand-written reference assembly (Max.asm with forward label references)."""
