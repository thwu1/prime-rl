difficulty_explanation = """Requires identifying and diagnosing three distinct computational errors in a multi-objective optimization pipeline (biased estimator, missing constraint filtering, incorrect volume computation) without being told what is wrong, then extending the pipeline with cross-validation, sensitivity analysis, and gnuplot visualization. The solver must possess domain expertise in statistical pass-rate estimation, Pareto dominance, 3D hypervolume computation, and weight-space robustness analysis, and must independently select correct algorithms and external libraries to produce self-consistent results across six interrelated output sections."""
solution_explanation = """The solver: (1) identifies and replaces the biased pass@k with the correct unbiased combinatorial estimator, (2) discovers and applies DSP/BRAM constraint filtering before Pareto computation, (3) implements a correct 3D sweep-line hypervolume algorithm, (4) independently chooses pymoo's HV indicator for cross-validation, (5) designs and implements the weight-grid sensitivity analysis over 36 valid combinations, and (6) scripts gnuplot to produce 15 SVG scatter plots with .dat data files."""
verification_explanation = """Tests verify exact Pass@K values, Pareto front sizes and membership, 3D hypervolume values within tight tolerance, final ranking order, cross-validation pass status, existence and validity of gnuplot SVG outputs, data file point counts, and sensitivity analysis structural correctness including total combination count and the invariant that beta always outranks alpha."""
