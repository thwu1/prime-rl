{
  'GlobalSettings': {
    'SimEnable': true,
    'GUI': false,
    'InitCommands': ['init'],
    'Description': 'RISC-V SoC Platform with River CPU Single Core'
  },
  'Services': [

#include "memory.cfg"
#include "peripherals.cfg"

    {'Class': 'CpuRiver_FunctionalClass', 'Instances': [
          {'Name': 'core0', 'Attr': [
                ['Enable', true],
                ['LogLevel', 3],
                ['HartID', 0],
                ['VendorID', 0x000000F1],
                ['ContextID', [0, 1, 0, 0], 'Context index depending privilege mode 0=U,1=S,2=H,3=M'],
                ['ImplementationID', 0x20231105],
                ['SysBusMasterID', 0, 'Used to gather Bus statistic'],
                ['SysBus', 'axi0'],
                ['CLINT', 'clint0', 'Core-Local Interruptor to generate sw and mtimer interrupts'],
                ['PLIC', 'plic0'],
                ['PmpTotal', 8],
                ['DmiBAR', 0x1000, 'Base address of the DMI module'],
                ['SysBusWidthBytes', 8, 'Split dma transactions from CPU'],
                ['ListExtISA', ['I', 'M', 'A', 'C', 'D']],
                ['StackTraceSize', 64, 'Number of 16-bytes entries'],
                ['FreqHz', 12000000],
                ['ResetVector', 0x10000, 'Initial instruction pointer value'],
                ['CacheBaseAddress', 0x08000000],
                ['CacheAddressMask', 0x1fffff, '2MB cache L2 reserved'],
                ['TriggersTotal', 2],
                ]}]},

    {'Class': 'BusGenericClass', 'Instances': [
          {'Name': 'axi0', 'Attr': [
                ['LogLevel', 3],
                ['AddrWidth', 39, 'Addr bits [63:39] should be equal to [38] in real hardware'],
                ['MapList', ['ddr0', 'ddr1', 'bootrom0', 'sram0', 'overlay_ram0', 'gpio0',
                        'uart0', 'uart1', 'plic0', 'clint0', 'timer0',
                        'pnp0', 'dmi0', 'spiflash0', 'ddr_ext0']]
                ]}]},
  ]
}
