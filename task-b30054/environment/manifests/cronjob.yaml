apiVersion: batch/v1
kind: CronJob
metadata:
  name: data-cleanup
  namespace: ecommerce
spec:
  schedule: "*/5 * * * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        spec:
          containers:
          - name: cleanup
            image: busybox:1.36
            command: ["/bin/sh", "-c", "echo Cleaning up old data; find /data -mtime +30 -delete"]
          restartPolicy: OnFailure
