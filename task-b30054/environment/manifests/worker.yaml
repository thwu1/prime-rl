apiVersion: apps/v1
kind: Deployment
metadata:
  name: worker
  namespace: ecommerce
  labels:
    app: worker
    role: processor
spec:
  replicas: 2
  selector:
    matchLabels:
      app: worker
  template:
    metadata:
      labels:
        app: worker
        role: processor
    spec:
      serviceAccountName: worker-sa
      securityContext:
        runAsNonRoot: false
      containers:
      - name: worker
        image: python:3.11-slim
        command: ["python", "-m", "worker"]
        securityContext:
          runAsUser: 0
          allowPrivilegeEscalation: false
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: 500m
            memory: 512Mi
        env:
        - name: API_KEY
          valueFrom:
            secretKeyRef:
              name: worker-creds
              key: api-key
        volumeMounts:
        - name: credentials
          mountPath: /etc/credentials
          readOnly: true
        - name: data
          mountPath: /data
      volumes:
      - name: credentials
        secret:
          secretName: worker-credentials
      - name: data
        persistentVolumeClaim:
          claimName: worker-data-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: worker
  namespace: ecommerce
spec:
  selector:
    app: worker
  ports:
  - port: 80
    targetPort: 8000
    protocol: TCP
  type: ClusterIP
