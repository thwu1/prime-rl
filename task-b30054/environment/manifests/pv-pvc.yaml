apiVersion: v1
kind: PersistentVolume
metadata:
  name: worker-data-pv
spec:
  capacity:
    storage: 10Gi
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  hostPath:
    path: /data/worker
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: worker-data-pvc
  namespace: ecommerce
spec:
  accessModes:
    - ReadWriteMany
  resources:
    requests:
      storage: 20Gi
  storageClassName: standard
