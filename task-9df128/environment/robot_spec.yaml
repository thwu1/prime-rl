robot:
  name: "warehouse_agv_01"
  type: "ackermann"

  dimensions:
    length: 0.70
    width: 0.40
    height: 0.35

  footprint: [[0.35, 0.20], [0.35, -0.20], [-0.35, -0.20], [-0.35, 0.20]]
  inscribed_radius: 0.20
  circumscribed_radius: 0.403

  kinematics:
    max_forward_velocity: 1.0
    max_reverse_velocity: -0.5
    max_angular_velocity: 1.2
    max_forward_acceleration: 2.0
    max_angular_acceleration: 2.5
    min_turning_radius: 0.8

  steering:
    type: "ackermann"
    wheelbase: 0.50
    max_steering_angle: 0.675

environment:
  corridor_min_width: 1.5
  map_resolution: 0.05
  speed_limit_zones: true
  keepout_zones: true
