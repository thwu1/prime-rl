# 2D Shallow Water Flood Solver - Simulation Configuration
sim_time 1800.0
initial_dt 1.0
max_dt 10.0
manning_n 0.035
depth_thresh 1e-3
cfl 0.7
max_hflow 10.0
g 9.81
theta 0.9
output_interval 60.0

# Point source location (row col)
point_source 1 10

# Inflow hydrograph: time(s) discharge(m^3/s)
inflow_start
0.0 0.0
30.0 15.0
1800.0 15.0
inflow_end

# Gauge locations: row col name
gauge 3 10 upstream
gauge 7 10 middle
gauge 12 10 downstream

# Output file prefix
output_prefix results
