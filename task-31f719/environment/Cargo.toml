[package]
name = "hyperkernel"
version = "0.1.0"
edition = "2021"
description = "A hypothetical Rust-based unikernel"

[features]
default = ["acpi", "dhcpv4", "fsgsbase", "pci", "smp", "tcp", "virtio-fs", "virtio-net"]

# Platform features
acpi = []
fsgsbase = []
smp = ["acpi"]

# PCI support
pci = ["virtio?/pci"]
pci-ids = ["dep:pci-ids-db"]

# Network core (internal feature)
net = []

# Network protocols
tcp = ["net", "dep:smoltcp", "smoltcp?/socket-tcp"]
udp = ["net", "dep:smoltcp", "smoltcp?/socket-udp"]
dhcpv4 = ["net", "dep:smoltcp", "smoltcp?/proto-dhcpv4", "smoltcp?/socket-dhcpv4"]
dns = ["net", "dep:smoltcp", "smoltcp?/socket-dns"]

# Network drivers
virtio-net = ["net", "virtio-driver"]
rtl8139 = ["net", "pci"]
gem-net = ["net", "dep:tock-registers"]

# VirtIO driver backend
virtio-driver = ["dep:virtio"]
virtio-console = ["virtio-driver"]
virtio-fs = ["virtio-driver", "dep:fuse-abi"]
virtio-vsock = ["virtio-driver"]

# Performance features
idle-poll = []

# Debug features
alloc-stats = ["dep:talc-counters"]
strace = []
kernel-stack = []
shell = ["dep:simple-shell"]
net-trace = ["smoltcp?/verbose"]

# Tracing
instrument-mcount = []

# Syscall features
common-os = []
mman = []
newlib = []

# Feature aliases
console = ["virtio-console"]
fs = ["virtio-fs"]

[dependencies]
smoltcp = { version = "0.13", optional = true }
virtio = { version = "0.3", optional = true }
fuse-abi = { version = "0.2", optional = true }
pci-ids-db = { version = "0.2", optional = true }
tock-registers = { version = "0.10", optional = true }
talc-counters = { version = "5", optional = true }
simple-shell = { version = "0.0.1", optional = true }
