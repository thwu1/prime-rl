## Web-only container for multi-container Discourse setup
## Connects to a separate data container for PostgreSQL and Redis

templates:
  - "templates/web.template.yml"
  - "templates/web.ratelimited.template.yml"
  - "templates/web.ssl.template.yml"
  - "templates/web.letsencrypt.ssl.template.yml"
  - "templates/nonexistent.template.yml"

expose:
  - "80:80"
  - "443:443"

env:
  LANG: en_US.UTF-8
  DISCOURSE_HOSTNAME: "192.168.1.100"
  DISCOURSE_DB_HOST: data
  DISCOURSE_REDIS_HOST: data
  DISCOURSE_DEVELOPER_EMAILS: "admin@mysite.com"
  DISCOURSE_SMTP_ADDRESS: smtp.sendgrid.net
  DISCOURSE_SMTP_PORT: "587"
  DISCOURSE_SMTP_USER_NAME: apikey
  DISCOURSE_SMTP_PASSWORD: "SG.xxxx"
  DISCOURSE_DB_NAME: '{{config}}_discourse'

volumes:
  - volume:
      host: /var/discourse/shared/web-only
      guest: /shared
