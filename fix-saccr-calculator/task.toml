schema_version = "1.2"

[metadata]
author_name = "Task Generator"
author_email = "author@example.com"
difficulty_explanation = """Requires diagnosing six interacting defects spread across three R source files implementing a regulatory finance calculator, without any hints about defect locations or nature. The solver must: (1) understand the BCBS 279 SA-CCR multi-level aggregation hierarchy (trades → entities → hedging sets → asset classes → netting set) from the regulatory specification; (2) navigate across core.R, addons.R, and saccr.R to locate bugs in the delta function, multiplier formula, credit aggregation model, commodity supervisory factor classification, and commodity correlation term; (3) design and implement a complete margined-trade pipeline from scratch (MPOR calculation, margined maturity factor, margined replacement cost with TH/MTA/NICA, mf_override threading through all add-on functions); (4) restructure all three add-on functions to return per-hedging-set and per-entity intermediate detail alongside totals, then propagate this detail through calc_ead into the output JSON; (5) validate all fixes against five coupled examples where defects cascade—each fix must be verified against the full suite since bugs interact across subsystems. The combination of multi-file debugging, regulatory domain interpretation, new subsystem implementation, output schema extension, and cascading cross-example validation creates genuine coupled complexity."""
solution_explanation = """Seven categories of fixes across three files: (1) core.R delta: put options must use pnorm(-d1), not pnorm(d1), per BCBS 279 para 159. (2) core.R multiplier: denominator must be 2*(1-floor)=1.9, not 2.0. (3) addons.R credit add-on: replace flat absolute-value entity summation with the single-factor model—systematic component (sum(rho_k * addon_k))^2 plus idiosyncratic component sum((1-rho_k^2)*addon_k^2), using signed entity-level addons and per-entity correlations (single-name=0.50, index=0.80). (4) addons.R commodity SF: change hedging-set-level SF lookup (hs=="Energy") to commodity-type-level lookup (com_type=="Electricity"), so only Electricity gets 40% while other commodities get 18%. (5) addons.R commodity correlation: change (1-rho) to (1-rho^2) in idiosyncratic term. (6) saccr.R margined pipeline: add calc_mpor (MPOR=10+N-1), extend maturity_factor for margined case (1.5*sqrt(MPOR/250)), extend replacement_cost for margined (max(V-C, TH+MTA-NICA, 0)), thread mf_override through all add-on functions, read margin CSV in calc_ead. (7) All three addon functions restructured to return list(total, detail) with per-hedging-set/per-entity breakdown, and calc_ead updated to propagate detail to output JSON."""
verification_explanation = """Tests run Rscript /app/saccr.R producing results.json, then pytest verifies 30+ assertions: (a) all five EAD golden values within +/-5; (b) per-asset-class addon values match BCBS 279 intermediate results within +/-10; (c) replacement cost and aggregate addon match expected values; (d) IR per-currency hedging-set detail values match within +/-15; (e) credit per-entity signed detail values match within +/-15; (f) commodity per-hedging-set detail values match within +/-15; (g) internal consistency (EAD ≈ 1.4*(RC+PFE), PFE ≈ mult*addon); (h) structural properties (RC >= 0, 0.05 <= multiplier <= 1.0); (i) examples 2 and 5 have multiplier strictly between 0.90 and 1.0; (j) examples 1, 3, 4 have multiplier exactly 1.0; (k) example 5 RC = 0; (l) credit detail sign convention verified; (m) per-class detail sums match totals; (n) multi-asset-class addon sum consistency."""
category = "debugging"
tags = ["regulatory-finance", "numerical-debugging"]
expert_time_estimate_hours = 3.5

