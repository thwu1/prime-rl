// BIND9 Configuration for infra.example.com
// Previous admin's configuration attempt

options {
    directory "/var/cache/bind";
    listen-on { any; };
    listen-on-v6 { none; };
    allow-query { any; };
    forwarders {
        8.8.8.8;
        8.8.4.4;
    };
};

// External view handles public-facing queries
view "external" {
    match-clients { any; };
    recursion no;

    zone "infra.example.com" {
        type master;
        file "/app/dns/zones/db.infra.example.com";
        allow-transfer { none; };
    };

    zone "30.20.10.in-addr.arpa" {
        type master;
        file "/app/dns/zones/db.10.20.30";
        allow-transfer { none; };
    };
};

acl "trusted" {
    10.20.30.0/24;
    localhost;
    localnets;
};

key "xfer-key" {
    algorithm hmac-md5;
    secret "R3BpK3FmYWN0b3J5MTIzNDU2Nzg5MGFiY2RlZg==";
};

// Internal view for trusted network clients
view "internal" {
    match-clients { trusted; };
    recursion yes;

    zone "infra.example.com" {
        type master;
        file "/app/dns/zones/db.infra.example.com";
        allow-transfer { any; };
    };
};
