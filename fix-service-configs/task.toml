schema_version = "1.2"

[metadata]
author_name = "Task Generator"
author_email = "author@example.com"
difficulty_explanation = """Requires expert-level cross-domain troubleshooting across four interconnected infrastructure components. The broken configs contain a mix of validator-caught errors and silent architectural bugs: BIND9 view ordering that causes incorrect client-matching precedence (named-checkconf passes but all clients match the wrong view), a TSIG key with the wrong algorithm, reverse zone placed in the wrong view, zone files that must be split from a single broken file into view-specific variants with different IP sets, HAProxy ACL ordering that silently inverts security policy (admin restrictions evaluated before rate-limiting), API version routing that is unreachable due to evaluation order, missing rate-limit exemptions, backend reference typos, database privilege grants that violate least-privilege boundaries (DDL role with DML access, staging admin on production database), and Ansible handler-notify mismatches that pass syntax check. Diagnosis requires understanding DNS view match-clients semantics, HAProxy ACL evaluation order security implications, MySQL privilege granularity (DDL vs DML separation), and cross-component IP consistency."""
solution_explanation = """The solution must: (1) restructure named.conf — move views to correct order (internal first for match-clients precedence), fix TSIG algorithm to hmac-sha256, move reverse zone from external to internal view, set allow-transfer to use TSIG key, add also-notify, update zone file paths to .internal/.external; (2) split the single broken zone file into two compliant zone files — internal with RFC1918 IPs, external with NAT IPs/VIPs, both with A record at apex (not CNAME), trailing dots on NS targets, complete host records, SRV; (3) fix reverse zone — add missing PTRs, correct wrong hostnames, add trailing dots; (4) fix HAProxy — reorder ACLs (rate-limit deny before admin deny before routing), add stick-table, add internal exemption to rate limiting, fix backend name reference, reorder API routing (v2 before v1); (5) fix init.sql — remove SELECT from migrator, add reporter grant on appdb_analytics, fix staging_admin to appdb_staging, add FLUSH PRIVILEGES; (6) fix playbook — add become:true, fix notify names to match handler names."""
verification_explanation = """Tests run all six validators (named-checkconf, 3x named-checkzone, haproxy -c, ansible --syntax-check) plus structural checks: DNS view existence/ordering, TSIG key name+algorithm, per-view recursion, reverse zone scoping, zone transfer TSIG auth, IP correctness per view from host tables, RFC compliance (apex types, trailing dots); HAProxy stick-table presence, rate-limit/admin deny codes, internal exemption, 5 backend definitions, API version header routing, ACL ordering (rate→admin→routing), v2-before-v1, backend reference consistency; DB user privilege validation per scope; Ansible become, handler-notify consistency."""
category = "systems_administration"
tags = ["infrastructure-troubleshooting", "multi-service-debugging"]
expert_time_estimate_hours = 2.0

