schema_version = "1.2"

[metadata]
author_name = "Task Generator"
author_email = "author@example.com"
difficulty_explanation = """Requires expert-level understanding of CPU profiling internals (folded stack format, exclusive vs inclusive metrics, call graph theory), Brendan Gregg's FlameGraph differential analysis pipeline (difffolded.pl, flamegraph.pl with --negate), the USE Method for systematic resource bottleneck identification from vmstat/iostat/mpstat output, and the ability to synthesize multi-source performance data into coherent root cause analysis. Computing inclusive counts from folded stacks requires understanding that a function's inclusive time includes all descendant frames, while exclusive time is only attributed at the leaf. The differential analysis requires matching functions across two profiles and computing meaningful regression attribution."""
solution_explanation = """The solution parses both folded stack files by splitting each line on the last space (to get stack;frames and count), then splitting frames on semicolons. Exclusive counts are computed by aggregating leaf-frame counts; inclusive counts use a per-stack seen-set to count each function once per stack. The differential is computed by taking the set union of all exclusive functions and subtracting baseline from regression counts. FlameGraph SVGs are generated by piping folded data through flamegraph.pl, and the diff SVG uses difffolded.pl piped to flamegraph.pl --negate. System metrics are parsed with column-index extraction from vmstat (us+sy for CPU util, r column for saturation) and iostat (%util and aqu-sz for disk). Root causes are identified by correlating new hot functions (regex_match, deep_copy, fsync_data) with system metric changes (disk saturation from fsync, CPU increase from regex)."""
verification_explanation = """Tests verify: (1) SVG files exist and contain valid SVG markup, (2) total sample counts are exactly 10000 for both profiles, (3) top exclusive functions match expected values (btree_search #1 in baseline at 1300 samples, regex_match #1 in regression at 1250), (4) top inclusive functions match (server at 10000, handle_conn at 8600/8350), (5) new_functions contains regex_match/deep_copy/fsync_data and removed_functions is empty, (6) top regression delta is regex_match at +1250, (7) root causes mention regex/validation and sync/disk/fsync, (8) USE method correctly identifies disk as saturated and memory as not saturated, (9) GC pressure increase is reflected in inclusive counts."""
category = "performance_analysis"
tags = ["flame-graphs", "use-method"]
expert_time_estimate_hours = 2.0

