hostname r3
!
ip route 10.255.0.2/32 10.0.23.1
!
router bgp 65002
 bgp router-id 10.255.0.3
 no bgp ebgp-requires-policy
 neighbor 10.255.0.2 remote-as 65002
 neighbor 10.255.0.2 update-source lo
 neighbor 10.255.0.4 remote-as 65003
 neighbor 10.255.0.4 ebgp-multihop 3
 neighbor 10.255.0.4 update-source lo
 !
 address-family ipv4 unicast
  neighbor 10.255.0.2 activate
  neighbor 10.255.0.2 route-reflector-client
  neighbor 10.255.0.4 activate
 exit-address-family
!
