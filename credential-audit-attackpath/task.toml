schema_version = "1.2"

[metadata]
author_name = "Task Generator"
author_email = "author@example.com"
difficulty_explanation = """Requires expert-level penetration testing knowledge: identifying NTLM hash formats and using appropriate cracking tools (hashcat/john) with custom rule generation, understanding Active Directory attack primitives (DCSync, constrained delegation abuse via S4U2Self/S4U2Proxy, SeBackupPrivilege exploitation, GenericAll/GenericWrite ACL abuse, GMSA password reading), performing graph traversal over AD permission structures to identify multi-step attack chains, and cross-referencing cracking results with policy compliance and attack path analysis. The combination of offline password auditing with AD attack path mapping under realistic enterprise conditions represents work typically done by senior penetration testers with 5+ years experience."""
solution_explanation = """The solution combines wordlists with custom hashcat/john rules to crack NTLM hashes (mode 1000), then runs a Python script that: (1) parses the cracked credentials and checks each against the password policy for length and complexity violations, (2) builds a directed graph from the AD structure JSON representing abusable permission edges (GenericAll, GenericWrite, constrained delegation, SeBackupPrivilege, ReadGMSAPassword, group memberships leading to privileged groups), (3) performs BFS from each cracked account to find shortest paths to Domain Admins, (4) identifies the most dangerous account as the one with shortest DA path AND a policy violation, and (5) generates the structured findings report."""
verification_explanation = """Tests verify: (1) at least 13 of 15 passwords are correctly cracked by checking exact username:password pairs, (2) all policy violation categories correctly identify the right accounts, (3) the most_dangerous_account is svc_backup (1-step path via SeBackupPrivilege + too-short password), (4) attack paths exist for the key accounts (admin.t, r.brown, svc_backup, svc_sql, svc_web, p.martinez), (5) the shortest_path_steps is 1, and (6) critical misconfigurations mention the svc_web→Server Admins GenericAll and svc_monitor→Domain Admins GenericAll issues."""
category = "cybersecurity"
tags = ["penetration-testing", "active-directory"]
expert_time_estimate_hours = 2.5

