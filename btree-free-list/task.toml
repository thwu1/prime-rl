[metadata]
author_name = "Task Generator"
author_email = "author@example.com"
difficulty_explanation = """Requires expert-level understanding of copy-on-write B+tree internals, disk page lifecycle, and crash-safe storage engine design. The agent must read and deeply comprehend ~500 lines of existing Go code implementing a B+tree-backed KV store, then independently design and implement a disk-based page reclamation mechanism. Key challenges: (1) understanding that COW semantics mean pages freed during an update are still referenced by the committed tree version until the meta page is atomically updated — reusing them prematurely causes corruption; (2) designing a reclamation structure that manages its own storage overhead (circular dependency); (3) extending the meta page format to atomically persist reclamation state alongside the tree root; (4) correctly wiring the reclamation into the B+tree's page allocation and deallocation callbacks. No skeleton or hints are provided — the agent must derive the entire approach from first principles based on understanding the existing codebase's crash-safety invariants."""
solution_explanation = """Implement a disk-based unrolled linked list (free list) where each node is one page containing a next pointer and up to 510 page numbers. Items are consumed from the head (PopHead) and appended to the tail (PushTail). A monotonic sequence counter prevents consuming pages freed during the current update (guarded by maxSeq, which is only advanced between updates via SetMaxSeq). The list self-manages: when the tail fills, it tries to reuse a page from its own head before appending a new page. In kv.go: create a pageAlloc that tries the free list before pageAppend, a pageWrite for in-place list node updates, wire tree.del to PushTail and tree.new to pageAlloc, extend saveMeta/loadMeta with 4 uint64 fields (head/tail page+seq), initialize page 1 as the empty free list node for new databases, and call SetMaxSeq after each successful updateFile."""
verification_explanation = """Tests build the Go binary then exercise it via CLI subprocess calls. Behavioral tests verify: basic CRUD correctness, data persistence across process restarts, sorted scan output, space reclamation (file size ratio after 200-key delete+reinsert must be < 1.5x), bounded growth over 5 insert/delete cycles (< 2MB), bounded growth under 10 update-in-place cycles (< 2x), mixed operation correctness with interleaved inserts/deletes/updates, and that reclamation metadata persists across restarts (reinserted keys reuse freed space in a new process). All tests are purely behavioral — they check file size bounds and operation correctness, not implementation internals."""
