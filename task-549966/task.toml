schema_version = "1.2"

[metadata]
author_name = "Task Generator"
author_email = "author@example.com"
difficulty_explanation = """Requires building a BagIt RFC 8493 conformance validator from scratch AND performing forensic recovery of four damaged serialized BagIt archives. The validator must pass ~53 parametrized tests against the LOC conformance suite, covering BOM detection, multi-algorithm checksum verification (MD5/SHA-224/SHA-256/SHA-512), path-security auditing, duplicate-entry semantics, version-specific whitespace rules, fetch.txt validation, and the v1.0 all-manifests-list-all-files rule. The forensic recovery component demands holistic understanding beyond procedure-following: the solver must extract tar.gz archives using CLI tools, diagnose multiple simultaneous violations (wrong serialization structure, BOM corruption, checksum mismatches, path traversal in manifests and fetch.txt, duplicate entries with conflicting hashes, incomplete manifests, metadata formatting errors, missing version declarations, cross-manifest file set divergence), repair each bag to full v1.0 compliance, recompute checksums, create tag manifests, and re-serialize with proper BagIt structure. This requires multi-tool interoperability (tar/gzip, sha256sum/sha512sum/md5sum, xxd for binary BOM inspection, file/iconv for encoding analysis) and synthesizing knowledge across RFC sections on versioning, serialization, encoding, security, and completeness."""
solution_explanation = """The solution deploys a Python validator that handles all conformance suite edge cases (BOM rejection, md5sum-format asterisk stripping, ./ prefix normalization, UTF-16/ISO-8859-1 tag file reading, version-specific duplicate rules, path traversal detection, v1.0 completeness enforcement). A separate repair script extracts each damaged archive, detects flat serialization, removes BOM, fixes version/encoding declarations, removes path-traversal entries from manifests and fetch.txt, deduplicates manifest entries, adds missing payload files to all manifests, removes whitespace-before-colon in bag-info.txt, recomputes all checksums, creates tag manifests, and re-serializes each bag as a conformant .tar.gz. The forensic report is generated by classifying detected violations into a 7-category taxonomy."""
verification_explanation = """Tests parametrically verify the validator against the full LOC conformance suite (~53 bags across v0.93-v1.0). For repaired archives: each must exist as .tar.gz with a single top-level directory matching the archive name; extracted bags must have v1.0 bagit.txt with no BOM and UTF-8 encoding; all checksums in all manifests must match actual file content (verified via hashlib); every payload file must appear in every manifest; no path traversal, duplicate entries, or metadata formatting violations may remain; and the validator itself must exit 0 on each repaired bag. The forensic report must be valid JSON covering all four archives with accurate violation categories from a defined taxonomy, verified against ground-truth expected categories."""
