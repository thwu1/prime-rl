global:
  scrape_interval: 30
  evaluation_interval: 15s

rule_files:
  - '/app/prometheus/rules/*.yml'

scrape_configs:
  - job_name: 'sglang-metrics'
    honor_timestamps: true
    static_configs:
      - targets: ['localhost:9090']

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['localhost:9093']
      timeout: 5

storage:
  tsdb:
    retention:
      time: 30d
