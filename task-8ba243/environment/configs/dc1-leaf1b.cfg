! device: dc1-leaf1b
!
hostname dc1-leaf1b
!
vlan 10
   name Tenant_A_Web
!
vlan 20
   name Tenant_A_App
!
vlan 30
   name Tenant_A_DB
!
vlan 4094
   name MLAG_PEER
   trunk group MLAG
!
vrf instance Tenant_A
!
interface Ethernet1
   description P2P_LINK_TO_DC1-SPINE1_Ethernet2
   no switchport
   ip address 172.31.255.3/31
!
interface Ethernet2
   description P2P_LINK_TO_DC1-SPINE2_Ethernet2
   no switchport
   ip address 172.31.255.11/31
!
interface Ethernet3
   description MLAG_PEER_DC1-LEAF1A_Ethernet3
   channel-group 1000 mode active
!
interface Ethernet4
   description MLAG_PEER_DC1-LEAF1A_Ethernet4
   no switchport
!
interface Ethernet5
   description MLAG_PEER_MOVED
   channel-group 1000 mode active
!
interface Loopback0
   description ROUTER_ID
   ip address 10.255.0.5/32
!
interface Loopback1
   description VTEP_VXLAN_Tunnel_Source
   ip address 10.255.1.3/32
!
interface Port-Channel1000
   description MLAG_PEER_DC1-LEAF1A_Po1000
   switchport mode trunk
   switchport trunk group MLAG
!
interface Vlan4094
   description MLAG_PEER
   no autostate
   ip address 10.255.252.1/31
!
interface Vxlan1
   vxlan source-interface Loopback1
   vxlan virtual-router encapsulation mac-address mlag-system-id
   vxlan vlan 10 vni 10010
   vxlan vlan 20 vni 10020
   vxlan vlan 30 vni 10030
   vxlan vrf Tenant_A vni 100
!
mlag configuration
   domain-id DC1_LEAF1
   local-interface Vlan4094
   peer-address 10.255.252.0
   peer-link Port-Channel1000
!
ip routing
ip routing vrf Tenant_A
!
router bgp 65101
   router-id 10.255.0.4
   no bgp default ipv4-unicast
   neighbor EVPN-OVERLAY-PEERS peer group
   neighbor EVPN-OVERLAY-PEERS update-source Loopback0
   neighbor EVPN-OVERLAY-PEERS send-community extended
   neighbor IPv4-UNDERLAY-PEERS peer group
   neighbor IPv4-UNDERLAY-PEERS send-community
   neighbor 10.255.0.1 peer group EVPN-OVERLAY-PEERS
   neighbor 10.255.0.1 remote-as 65100
   neighbor 10.255.0.2 peer group EVPN-OVERLAY-PEERS
   neighbor 10.255.0.2 remote-as 65100
   neighbor 172.31.255.2 peer group IPv4-UNDERLAY-PEERS
   neighbor 172.31.255.2 remote-as 65100
   neighbor 172.31.255.10 peer group IPv4-UNDERLAY-PEERS
   neighbor 172.31.255.10 remote-as 65100
   !
   vlan 10
      rd 10.255.0.4:10010
      route-target both 10010:10010
      redistribute learned
   !
   vlan 20
      rd 10.255.0.4:10020
      route-target both 10020:10020
      redistribute learned
   !
   vlan 30
      rd 10.255.0.4:10030
      route-target both 10030:10030
      redistribute learned
   !
   address-family evpn
      neighbor EVPN-OVERLAY-PEERS activate
   !
   address-family ipv4
      neighbor IPv4-UNDERLAY-PEERS activate
   !
   vrf Tenant_A
      rd 10.255.0.4:100
      route-target import evpn 100:100
      route-target export evpn 100:100
      redistribute connected
!
