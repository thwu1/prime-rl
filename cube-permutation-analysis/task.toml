schema_version = "1.2"

[metadata]
author_name = "Task Generator"
author_email = "author@example.com"
difficulty_explanation = """Requires expert-level understanding of Rubik's Cube group theory to audit a facelet-level simulator with a subtle move definition bug. The defect (reversed adjacent strip direction in one face move) preserves the move's individual order — it cannot be detected by checking basic move properties alone. Diagnosis requires testing compound invariants (e.g., generator pair orders), understanding the geometric relationship between face rotations and strip permutations, and tracing through 4-cycle orientations across adjacent faces. The agent must also learn to use GAP (Groups, Algorithms, Programming), a specialized computational algebra system, to independently verify permutation group properties — translating between facelet-level cube representation and GAP's permutation notation. This combination of forensic debugging in an algebraic domain with unfamiliar tool usage demands proficient-to-expert skill."""
solution_explanation = """The solution identifies the buggy move by systematically checking compound invariants: computing the order of each generator pair (e.g., R*U should have order 63 in the cube group) and comparing against known values. This isolates R as the defective move. The specific bug is diagnosed by tracing the strip permutation cycles — the adjacent facelets cycle in the reverse direction (CCW strip with CW face rotation). The fix restores the correct strip direction. A GAP script is generated by converting the 54-facelet move definitions to 48-point permutations (excluding centers), expressing each scramble as a product of generators, and computing orders. Results are cross-validated between the Python implementation and GAP output."""
verification_explanation = """Tests verify: (1) all 15 facelet strings match precomputed ground truth, (2) all permutation orders, cycle types, fixed counts, and parities match expected values, (3) the buggy move is correctly identified as 'R', (4) the GAP script exists and executes successfully producing correct permutation orders, (5) global aggregates (max order, composite order, total fixed, shared pairs) are correct. Self-consistency checks ensure cycle type sums equal 48, orders equal LCM of cycle lengths, and parity is consistent with cycle decomposition."""
category = "mathematics"
tags = ["group-theory", "computational-algebra"]
expert_time_estimate_hours = 4.0

