schema_version = "1.2"

[metadata]
author_name = "Task Generator"
author_email = "author@example.com"
difficulty_explanation = """The solver receives a pre-existing validator containing 10 interacting bugs and 6 missing validation rules plus CLI features. Bugs span IBAN mod-97 rearrangement errors, corrupted IBAN country-length table entries (NL and CH have wrong expected lengths, creating a cascading diagnostic challenge when combined with the rearrangement bug), Easter Computus coefficient errors, BIC regex grouping, settlement holiday omissions, floating-point total-amount comparison, namespace coverage gaps, and broken xmllint XSD integration (wrong schema filename pattern and incorrect output stream capture). The IBAN bugs interact: fixing the rearrangement reveals length-table corruption for specific countries, requiring the solver to cross-reference the IBAN registry. Six validation rules are entirely absent (UETR format, EndToEndId uniqueness, settlement method dependencies, charge bearer validation, same-account detection) and must be designed and implemented from scratch. The CLI must be extended to support stdin piping, NDJSON output formatting, and --schema-dir argument handling, requiring multi-tool integration across XML parsing, xmllint subprocess orchestration, argparse, and streaming output modes."""
solution_explanation = """Fix 10 bugs: (1) IBAN mod-97 rearrangement must move first 4 chars to end, not first 2; (2) Easter Computus ll-formula needs coefficient 2*i not just i; (3) BIC regex branch code group needs {3} not {2}; (4) TARGET2 holidays must include Dec 26; (5) total amount comparison must use Decimal, not float; (6) supported namespace versions must include 10; (7) XSD filename pattern must be pacs.008.001.{VV}.xsd not pacs008_{VV}.xsd; (8) xmllint errors come from stderr not stdout; (9) IBAN_LENGTHS NL entry must be 18 not 19; (10) IBAN_LENGTHS CH entry must be 21 not 20. Implement 6 missing rules: UETR UUID v4 format check, EndToEndId uniqueness within message, CLRG→ClrSys dependency, COVE→reimbursement agent dependency, ChrgBr value validation against {DEBT,CRED,SHAR,SLEV}, and debtor/creditor same-IBAN detection. Add argparse-based CLI with --format ndjson, --schema-dir, and stdin ('-') support."""
verification_explanation = """85+ pytest tests create pacs.008 XML programmatically with a builder function, introducing specific errors per rule. Tests run the validator via subprocess, parse JSON/NDJSON output, and assert presence/absence of specific rule_ids. Tests cover all 25 rules including XSD schema validation via xmllint, stdin input, NDJSON formatting, decimal precision edge cases, BIC length edge cases, IBAN country-specific length validation (NL, CH, FR, ES), charge bearer validation, same-account detection, and multi-file exit codes. The IBAN length-table bugs interact with the rearrangement bug: fixing one without the other leaves tests failing, requiring systematic diagnosis. Each bug and missing feature has at least one dedicated test that fails against the initial buggy code."""
category = "finance"
