## PE1.conf - JunOS Configuration
## host: PE1

routing-instances {
    CustomerA {
        instance-type vrf;
        route-distinguisher 65000:100;
        vrf-import CUST-A-IMPORT;
        vrf-export CUST-A-EXPORT;
    }
    CustomerB {
        instance-type vrf;
        route-distinguisher 65000:200;
        vrf-import CUST-B-IMPORT;
        vrf-export CUST-B-EXPORT;
    }
    CustomerC {
        instance-type vrf;
        route-distinguisher 65000:300;
        vrf-import CUST-C-HUB-IMPORT;
        vrf-export CUST-C-HUB-EXPORT;
    }
}

policy-options {
    policy-statement CUST-A-IMPORT {
        from community CUST-A-RT;
        then accept;
    }
    policy-statement CUST-A-EXPORT {
        then community add CUST-A-RT;
        then accept;
    }
    policy-statement CUST-B-IMPORT {
        from community CUST-B-RT;
        then accept;
    }
    policy-statement CUST-B-EXPORT {
        then community add CUST-B-RT;
        then accept;
    }
    policy-statement CUST-C-HUB-IMPORT {
        from community CUST-C-SPOKE-RT;
        then accept;
    }
    policy-statement CUST-C-HUB-EXPORT {
        then community add CUST-C-HUB-RT;
        then accept;
    }
    community CUST-A-RT members target:65000:100;
    community CUST-B-RT members target:65000:200;
    community CUST-C-HUB-RT members target:65000:300;
    community CUST-C-SPOKE-RT members target:65000:301;
}
