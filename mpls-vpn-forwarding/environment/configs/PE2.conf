## PE2.conf - JunOS Configuration
## host: PE2

routing-instances {
    CustomerB {
        instance-type vrf;
        route-distinguisher 65000:200;
        vrf-import CUST-B-IMPORT;
        vrf-export CUST-B-EXPORT;
    }
    CustomerC {
        instance-type vrf;
        route-distinguisher 65000:301;
        vrf-import CUST-C-SPOKE-IMPORT;
        vrf-export CUST-C-SPOKE-EXPORT;
    }
}

policy-options {
    policy-statement CUST-B-IMPORT {
        from community CUST-B-RT;
        then accept;
    }
    policy-statement CUST-B-EXPORT {
        then community add CUST-B-RT;
        then accept;
    }
    policy-statement CUST-C-SPOKE-IMPORT {
        from community CUST-C-HUB-RT;
        then accept;
    }
    policy-statement CUST-C-SPOKE-EXPORT {
        then community add CUST-C-SPOKE-RT;
        then accept;
    }
    community CUST-B-RT members target:65000:200;
    community CUST-C-HUB-RT members target:65000:300;
    community CUST-C-SPOKE-RT members target:65000:301;
}
