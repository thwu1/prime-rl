## PE3.conf - JunOS Configuration
## host: PE3

routing-instances {
    CustomerA {
        instance-type vrf;
        route-distinguisher 65000:100;
        vrf-import CUST-A-IMPORT;
        vrf-export CUST-A-EXPORT;
    }
    CustomerC {
        instance-type vrf;
        route-distinguisher 65000:302;
        vrf-import CUST-C-SPOKE-IMPORT;
        vrf-export CUST-C-SPOKE-EXPORT;
    }
}

policy-options {
    policy-statement CUST-A-IMPORT {
        from community CUST-A-RT;
        then accept;
    }
    policy-statement CUST-A-EXPORT {
        then community add CUST-A-RT;
        then accept;
    }
    policy-statement CUST-C-SPOKE-IMPORT {
        from community CUST-C-HUB-RT;
        then accept;
    }
    policy-statement CUST-C-SPOKE-EXPORT {
        then community add CUST-C-SPOKE-RT;
        then accept;
    }
    community CUST-A-RT members target:65000:100;
    community CUST-C-HUB-RT members target:65000:300;
    community CUST-C-SPOKE-RT members target:65000:301;
}
