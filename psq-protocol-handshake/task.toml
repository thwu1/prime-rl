schema_version = "1.2"

[metadata]
author_name = "Task Generator"
author_email = "author@example.com"
difficulty_explanation = """Requires implementing four distinct cryptographic primitives from scratch (X25519 elliptic curve Diffie-Hellman, HKDF-SHA256, ChaCha20-Poly1305 AEAD, SHA-256 transcript hashing) and then correctly composing them into the PSQ protocol's multi-layer key derivation chain. The PSQ protocol is novel (not in textbooks) — the agent must parse a protocol specification and translate it into correct code. Subtle errors in Montgomery ladder arithmetic, Poly1305 clamping, HKDF salt handling, TLS-style serialization, or key schedule ordering will produce completely wrong outputs. Each primitive alone is non-trivial; their composition under the PSQ protocol adds significant integration complexity."""
solution_explanation = """The solution implements all four crypto primitives in pure Python following their respective RFCs, then executes the full PSQ DH-based registration handshake: (1) compute transcript hashes tx0/tx1/tx2 with correct domain separators and TLS-style serialization, (2) derive keys K_0 through K_2 via the multi-stage key schedule using X25519 shared secrets and HKDF, (3) encrypt/decrypt registration and response payloads with ChaCha20-Poly1305, (4) derive session key K_S, session ID, pk_binder, channel keys, exported secrets, and rekeyed session values."""
verification_explanation = """Tests load the agent's output.json and compare every intermediate and final value against pre-computed test vectors. The test vectors were generated from an independently verified reference implementation that passes RFC test vectors for each primitive (X25519 RFC 7748, ChaCha20-Poly1305 RFC 8439, HKDF RFC 5869). Tests verify 23 distinct cryptographic values across 4 categories: key exchange intermediates, transcript hashes, session keys, and rekeyed session values."""
category = "cryptography"
tags = ["protocol-implementation", "key-derivation"]
expert_time_estimate_hours = 3.5

