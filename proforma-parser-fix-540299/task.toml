[metadata]
author_name = "Task Generator"
author_email = "author@example.com"
difficulty_explanation = """Requires deep understanding of the HUPO-PSI ProForma 2.0 EBNF grammar for proteoform notation — a domain-specific format used in mass spectrometry proteomics. The solver must diagnose a mix of defect types: missing feature implementations that cause parse errors on valid input, subtle bugs that produce structurally valid but incorrect output (wrong feature classification, missing feature flags), and edge cases in bracket-depth tracking. Discovering the defects requires running the parser against 43 test inputs, categorizing failures (error vs wrong output), tracing through the recursive-descent parser code, cross-referencing the EBNF grammar, and implementing fixes for nested bracket matching, cross-link chain separators, global/labile/unlocalised modification syntax, parenthesised regions (ambiguous amino acids and modification ranges), chimeric spectra, and adduct-ion charge parsing with formula-embedded isotope notation."""
solution_explanation = """Replace the broken parser.rs with one that: (1) tracks bracket depth when parsing modification text so nested brackets like [Cation:Mg[II]] are handled correctly; (2) adds the cross_link feature flag when chain separator // is encountered; (3) distinguishes global isotope labels from global fixed modifications by checking for [ after <; (4) adds labile modification parsing for {mod} syntax; (5) adds unlocalised modification parsing with speculative read and ? detection, including occurrence specifier ^N; (6) handles chimeric spectra by parsing +-separated ions and incrementing ion_count; (7) handles parenthesised regions for (?AA) ambiguous amino acids and (AA)[mod] ranges, rejecting nested ranges; (8) handles adduct-ion charge parsing /[formula:z+N^M,...] with nested bracket awareness for isotope notation in formulas. Bugs 1-3 are subtle (wrong output on valid input) while bugs 4-8 are missing features (errors on valid input), requiring different diagnostic approaches."""
verification_explanation = """Tests build the Rust project with cargo, run the CLI on the 43 test inputs, and use pytest to verify the JSON output. Each positive test case checks valid=true plus specific fields (sequence, modifications, chain_count, ion_count, charge, features). Each negative test case checks valid=false. Tests cover all defect categories including combined feature interactions: cross-link+charge, multi-adduct with occurrence, global+labile+unlocalised combined, ambiguous+range combined, multi-global-fixed+charge. Two tests specifically catch subtle output bugs: global_fixed tests verify global_isotope is NOT present when only fixed mods are used, and cross-link tests verify the cross_link feature is present."""
