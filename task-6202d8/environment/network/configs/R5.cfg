!
! Last configuration change at 11:58:03 UTC Mon Jun 9 2025
!
version 17.9
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
!
hostname R5-BRANCH-E
!
boot-start-marker
boot-end-marker
!
no aaa new-model
!
no ip domain lookup
ip cef
!
interface Loopback0
 ip address 10.0.0.5 255.255.255.255
 ip ospf 1 area 20
 ip ospf cost 1
!
interface GigabitEthernet0/0
 description ### Link to R3-DIST-E Gi0/1 ###
 ip address 10.1.35.2 255.255.255.252
 ip ospf 1 area 20
 ip ospf cost 5
 negotiation auto
 no shutdown
!
interface GigabitEthernet0/1
 description ### Branch East LAN ###
 ip address 10.5.1.1 255.255.255.0
 no shutdown
!
interface GigabitEthernet0/2
 description ### Branch East LAN 2 ###
 ip address 10.5.2.1 255.255.255.0
 no shutdown
!
router ospf 1
 router-id 10.0.0.5
 passive-interface Loopback0
 passive-interface GigabitEthernet0/1
 passive-interface GigabitEthernet0/2
 auto-cost reference-bandwidth 1000
 area 20 stub
 redistribute eigrp 200 subnets
!
router eigrp 200
 network 10.5.1.0 0.0.0.255
 network 10.5.2.0 0.0.0.255
 redistribute ospf 1 metric 10000 100 255 1 1500
 no auto-summary
!
ip forward-protocol nd
no ip http server
no ip http secure-server
!
control-plane
 service-policy input COPP-POLICY
!
line con 0
 stopbits 1
line vty 0 4
 login local
 transport input ssh
!
end
