!
! Last configuration change at 14:23:07 UTC Mon Jun 9 2025
!
version 17.9
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
!
hostname R1-CORE
!
boot-start-marker
boot-end-marker
!
no aaa new-model
!
no ip domain lookup
ip cef
ipv6 unicast-routing
!
interface Loopback0
 ip address 10.0.0.1 255.255.255.255
 ip ospf 1 area 0
 ip ospf cost 1
!
interface GigabitEthernet0/0
 description ### Link to R2-DIST-W Gi0/0 ###
 ip address 10.1.12.1 255.255.255.252
 ip ospf 1 area 0
 ip ospf cost 10
 negotiation auto
 no shutdown
!
interface GigabitEthernet0/1
 description ### Link to R3-DIST-E Gi0/0 ###
 ip address 10.1.13.1 255.255.255.252
 ip ospf 1 area 0
 ip ospf cost 10
 negotiation auto
 no shutdown
!
interface GigabitEthernet0/2
 description ### Link to R6-ISP Gi0/0 ###
 ip address 10.99.1.1 255.255.255.252
 negotiation auto
 no shutdown
!
router ospf 1
 router-id 10.0.0.1
 passive-interface Loopback0
 auto-cost reference-bandwidth 1000
!
router bgp 65001
 bgp router-id 10.0.0.1
 bgp log-neighbor-changes
 neighbor 10.0.0.2 remote-as 65001
 neighbor 10.0.0.2 update-source Loopback0
 neighbor 10.0.0.2 route-reflector-client
 neighbor 10.0.0.3 remote-as 65001
 neighbor 10.0.0.3 update-source Loopback0
 neighbor 10.0.0.3 route-reflector-client
 neighbor 10.99.1.2 remote-as 65100
 !
 address-family ipv4 unicast
  network 10.0.0.1 mask 255.255.255.255
  neighbor 10.0.0.2 activate
  neighbor 10.0.0.3 activate
  neighbor 10.99.1.2 activate
 exit-address-family
!
ip forward-protocol nd
no ip http server
no ip http secure-server
!
control-plane
!
line con 0
 stopbits 1
line vty 0 4
 access-class 99 in
 login local
 transport input ssh
!
access-list 99 permit 10.0.0.0 0.0.0.255
!
end
