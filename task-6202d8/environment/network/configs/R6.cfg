!
! Last configuration change at 08:30:55 UTC Mon Jun 9 2025
!
version 17.9
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
!
hostname R6-ISP
!
boot-start-marker
boot-end-marker
!
no aaa new-model
!
no ip domain lookup
ip cef
!
interface Loopback0
 ip address 172.16.0.1 255.255.255.255
!
interface GigabitEthernet0/0
 description ### Link to R1-CORE Gi0/2 ###
 ip address 10.99.1.2 255.255.255.252
 negotiation auto
 no shutdown
!
router bgp 65100
 bgp router-id 172.16.0.1
 bgp log-neighbor-changes
 neighbor 10.99.1.1 remote-as 65001
 !
 address-family ipv4 unicast
  network 172.16.0.0 mask 255.255.0.0
  network 172.16.0.1 mask 255.255.255.255
  neighbor 10.99.1.1 activate
 exit-address-family
!
ip route 172.16.0.0 255.255.0.0 Null0
!
ip forward-protocol nd
no ip http server
no ip http secure-server
!
control-plane
!
line con 0
 stopbits 1
line vty 0 4
 login local
 transport input ssh
!
end
