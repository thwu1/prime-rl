!
! Last configuration change at 09:15:32 UTC Mon Jun 9 2025
!
version 17.9
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
!
hostname R2-DIST-W
!
boot-start-marker
boot-end-marker
!
no aaa new-model
!
no ip domain lookup
ip cef
!
interface Loopback0
 ip address 10.0.0.2 255.255.255.255
 ip ospf 1 area 0
 ip ospf cost 1
!
interface GigabitEthernet0/0
 description ### Link to R1-CORE Gi0/0 ###
 ip address 10.1.12.2 255.255.255.252
 ip ospf 1 area 0
 ip ospf cost 10
 negotiation auto
 no shutdown
!
interface GigabitEthernet0/1
 description ### Link to R4-BRANCH-W Gi0/0 ###
 ip address 10.1.24.1 255.255.255.252
 ip ospf 1 area 10
 ip ospf cost 5
 ip ospf hello-interval 10
 ip ospf dead-interval 40
 negotiation auto
 no shutdown
!
interface GigabitEthernet0/2
 description ### Backup Link to R3-DIST-E Gi0/2 ###
 ip address 10.1.23.1 255.255.255.252
 ip ospf 1 area 0
 ip ospf cost 500
 ip mtu 1500
 negotiation auto
 no shutdown
!
router ospf 1
 router-id 10.0.0.2
 passive-interface Loopback0
 auto-cost reference-bandwidth 1000
!
router bgp 65001
 bgp router-id 10.0.0.2
 bgp log-neighbor-changes
 neighbor 10.0.0.1 remote-as 65001
 neighbor 10.0.0.1 update-source Loopback0
 !
 address-family ipv4 unicast
  neighbor 10.0.0.1 activate
 exit-address-family
!
ip forward-protocol nd
no ip http server
no ip http secure-server
!
control-plane
 service-policy input COPP-POLICY
!
line con 0
 stopbits 1
line vty 0 4
 access-class 99 in
 login local
 transport input ssh
!
access-list 99 permit 10.0.0.0 0.0.0.255
!
end
