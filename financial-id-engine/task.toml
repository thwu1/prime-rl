schema_version = "1.2"

[metadata]
author_name = "Task Generator"
author_email = "author@example.com"
difficulty_explanation = """Requires reverse-engineering seven distinct financial identifier validation algorithms from unfamiliar python-stdnum reference source code (IBAN, BIC, LEI, ISIN, CUSIP, FIGI, SEDOL), each using a different check-digit scheme (ISO 7064 Mod 97,10; Luhn variants with different alphabets and doubling directions; weighted checksums with vowel-gapped alphabets). The solver must parse python-stdnum's proprietary numdb data format (iban.dat) to derive per-country BBAN structures and IBAN lengths. Beyond the Python implementation, the solver must design a normalized SQLite schema and implement cross-reference consistency as a SQL VIEW using relational self-joins on the validations table — requiring proficiency with SQLite's type system (no native boolean), string functions (1-indexed SUBSTR, zero-padding via concatenation), and CASE/UNION ALL expressions. The SQL view must be live (not pre-populated), which demands understanding of how views differ from tables in relational databases. Auto-detection across overlapping identifier formats and check-digit repair for six types add further complexity."""
solution_explanation = """The reference solution parses iban.dat line-by-line extracting country codes and bban properties, computing IBAN lengths as 4 + sum of BBAN token lengths. Each validator implements the algorithm from the corresponding vendor source: IBAN uses Mod 97,10 on rearranged alphanumeric string; ISIN expands to digits then applies Luhn; CUSIP uses alternating 1/2 weights on a 39-character alphabet; FIGI is similar but excludes vowels; SEDOL uses (1,3,1,7,3,9) weights on a vowel-gapped alphabet; BIC validates structure and ISO country code; LEI uses Mod 97,10. Results are inserted into SQLite tables. The cross_references VIEW uses three UNION ALL branches, each joining validations self-referentially on record_id with type filters, using SUBSTR for position extraction and string concatenation for SEDOL zero-padding. JSON export queries all tables/views and converts INTEGER 0/1 to Python booleans."""
verification_explanation = """Tests verify both the JSON report and the SQLite database. JSON tests check specific validation results (valid/invalid for each type), auto-detection of 3 untyped identifiers, 5 cross-reference consistency checks, and check-digit repair for 6 types. SQLite tests verify: database schema (validations and repairs are TABLEs, cross_references is a VIEW), correct column sets, data counts, specific row values. A dynamic VIEW test inserts synthetic identifiers and verifies the cross_references VIEW produces new rows reactively — proving it is a live SQL view, not a pre-populated table. Total: 40+ individual assertions across JSON correctness, database schema, and view behavior."""
