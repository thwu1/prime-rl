schema_version = "1.2"

[metadata]
author_name = "Task Generator"
author_email = "author@example.com"
difficulty_explanation = """Requires proficient-level systems security expertise across multiple Linux subsystems. The solver must: (1) diagnose 8 STIG control defects caused by SSH Include first-match semantics, PAM inline argument precedence over conf files, sysctl.d lexicographic override ordering, and profile.d execution sequencing; (2) CREATE a novel compliance validation engine that models each subsystem's configuration resolution behavior — not a textbook tool but a purpose-built engine that correctly resolves effective values through layered precedence chains and detects dynamically introduced overrides; (3) EVALUATE each misconfiguration's real-world security impact by producing a severity-ranked risk assessment with attack scenarios, cascading impact analysis, and justified priority ordering. The create and evaluate components demand synthesis of deep systems knowledge into novel artifacts."""
solution_explanation = """Remediation fixes: (1) SSH drop-in 50-cloud-init.conf overrides PermitRootLogin via Include first-match — change to 'no'; (2) ClientAliveCountMax=0 disables keepalives — set to 1; (3) inline deny=99 on pam_faillock.so overrides faillock.conf — remove inline args; (4) inline minlen=4 on pam_pwquality.so overrides pwquality.conf — remove inline arg; (5) auditd max_log_file_action=IGNORE — set to ROTATE; (6) audit rules use legacy auid>=500 — update to 1000; (7) profile.d/99-custom.sh unsets TMOUT — remove unset line; (8) sysctl.d/99-override.conf disables ASLR — set to 2. The validator implements each subsystem's precedence model and produces structured results. The risk assessment ranks KERN-001 (CAT I, ASLR bypass) as highest priority with justified severity scores."""
verification_explanation = """Tests verify: (A) all 8 controls are in compliant configuration state via direct file inspection; (B) remediation report has correct structure and all 8 entries; (C) the compliance validator exists, runs, produces valid JSON output with all required fields, reports all controls as PASS on the remediated system, and correctly detects dynamically injected SSH drop-in and sysctl.d override defects; (D) risk assessment has all 8 controls with valid severity scores, unique priorities 1-8, the CAT I control at priority 1, substantive attack scenarios and justifications, and non-empty cascading impact lists."""
category = "cybersecurity"
tags = ["linux-hardening", "stig-compliance"]
expert_time_estimate_hours = 2.0

[verifier]
network_mode = "no-network"
timeout_sec = 300.0

[agent]
network_mode = "no-network"
timeout_sec = 3600.0

