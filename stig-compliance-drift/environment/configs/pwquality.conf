# Configuration for pam_pwquality
# Compliant with DISA STIG password requirements

# Minimum password length (15 chars per STIG)
minlen = 15

# Minimum number of character classes (upper, lower, digit, special)
minclass = 4

# Maximum consecutive identical characters
maxrepeat = 3

# Minimum characters different from old password
difok = 8

# Reject passwords containing the user name
usercheck = 1

# Enforce for all users
enforcing = 1
