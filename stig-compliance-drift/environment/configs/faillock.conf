# Configuration for pam_faillock
# Compliant with DISA STIG SV-258054

# Deny access after 3 failed login attempts
deny = 3

# Lock accounts for 15 minutes (900 seconds)
unlock_time = 900

# Reset fail count after 15 minutes of no failures
fail_interval = 900

# Audit failed login attempts
audit

# Also lock root account on excessive failures
even_deny_root
