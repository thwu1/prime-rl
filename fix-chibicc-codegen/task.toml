[metadata]
author_name = "Task Generator"
author_email = "author@example.com"
difficulty_explanation = """Requires deep understanding of x86-64 assembly semantics including register aliasing (64/32/16/8-bit forms share physical registers with different zero-extension rules), stack alignment constraints for the System V ABI, and flag register liveness across instruction boundaries. The solver must analyze chibicc's stack-based code generation patterns to discover which instruction sequences are redundant, design provably-correct transformation rules that handle edge cases like nested push/pop pairs and control flow boundaries, and implement a multi-pass optimizer that correctly handles pattern interactions. Incorrect optimizations produce silent miscompilation — there is no compiler error to guide debugging."""
solution_explanation = """The optimizer implements three iterative passes: (1) lea+load folding — chibicc generates `lea N(%rbp),%rax` followed by `load (%rax),%dest` for every local variable access; these are collapsed into `load N(%rbp),%dest`, saving one instruction per variable reference. (2) Push/pop elimination — chibicc's binary operation pattern (push lhs, gen rhs, pop to %rdi, operate) produces push/pop pairs with non-interfering intermediate code; these are replaced with mov instructions, using register alias analysis to correctly detect conflicts between e.g. %rdi/%edi/%di/%dil. Nesting depth tracking ensures inner pairs are optimized first. (3) Identity move removal for 64-bit registers. Passes iterate until convergence, typically 4-6 rounds for complex functions."""
verification_explanation = """Tests compile multiple C programs (arithmetic, loops, pointers, structs, and a comprehensive benchmark) to assembly with chibicc, pipe through the optimizer, assemble with gcc, and verify output matches the unoptimized version. A dedicated test measures instruction count reduction on the benchmark (must achieve >= 12%). Correctness tests cover edge cases including nested expressions, function calls with multiple arguments, control flow with labels, and pointer arithmetic."""
category = "systems_programming"
tags = ["compilers", "x86-64-optimization"]
expert_time_estimate_hours = 2.5

