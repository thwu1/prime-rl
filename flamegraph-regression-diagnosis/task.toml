[metadata]
author_name = "Task Generator"
author_email = "author@example.com"
difficulty_explanation = """Requires expert-level performance engineering: analyzing differential folded stack traces, triaging anomalous functions as genuine regressions vs intentional security/monitoring additions vs expected overhead (professional judgment under ambiguity), fixing only real bugs in C while preserving intentional code, computing Amdahl's law projected speedups from profile data, and designing an automated regression detection framework with configurable thresholds and severity classification. Combines deep Linux profiling methodology knowledge, systems-level C optimization, quantitative performance modeling, and tool design."""
solution_explanation = """1. Parse before/after folded profiles to compute per-function inclusive sample deltas. 2. Triage 6 anomalous functions: classify check_config_valid (stat per field), alloc_record_buf (heap per record), normalize_text/dedup (O(n^2) memmove), rebuild_index (rebuild per lookup) as genuine regressions; classify sanitize_key as intentional security addition (new O(n) validation, small overhead, removing it creates vulnerability); classify accumulate_stats as expected overhead (O(1) monitoring, proportional sample increase). 3. Fix the 4 genuine bugs: cache stat result, use stack buffer, O(n) read/write pointer dedup, build hash index once. 4. Compute Amdahl's law: fraction = regression_delta / total_after_samples, speedup = 1/(1-fraction). 5. Build perf_guardian.py with folded profile parsing, delta computation, threshold filtering, and severity classification."""
verification_explanation = """Tests verify: (1) triage.json correctly classifies all 6 anomalous functions — 4 as genuine_regression and 2 decoys as non-regression, with substantive justifications, (2) fixed workload.c compiles and produces byte-identical output, (3) sanitize_key and accumulate_stats functions are preserved in fixed code, (4) fixed program processes 2000 records in under 10 seconds, (5) impact_analysis.json contains 4 entries with self-consistent Amdahl's law calculations (speedup matches fraction via 1/(1-f) within 15%), (6) perf_guardian.py detects all 4 genuine regressions and supports --threshold parameter."""
