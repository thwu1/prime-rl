context:
  name: sqlite
  version: "3.45.2"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://www.sqlite.org/2024/sqlite-autoconf-3450200.tar.gz
  sha256: bc9067442c1c92e3b0acbc2e4372756aa165d2fbed4abf43f1f22db97e7cf8c3

build:
  number: 0
  run_exports:
    - ${{ pin_subpackage(name, max_pin='x') }}

requirements:
  build:
    - ${{ compiler('c') }}
    - make
  host:
    - zlib
  run: []

test:
  commands:
    - sqlite3 --version
    - test -f $PREFIX/lib/libsqlite3.so

about:
  homepage: https://www.sqlite.org
  license: blessing
  license_file: LICENSE.md
  summary: Self-contained, serverless, transactional SQL database engine
