context:
  name: rasterio
  version: "1.3.9"

package:
  name: ${{ name }}
  version: ${{ version }}

source:
  url: https://github.com/rasterio/rasterio/releases/download/${{ version }}/rasterio-${{ version }}.tar.gz
  sha256: f1a2b3c4d5e6f7a8b9c0d1e2f3a4b5c6d7e8f9a0b1c2d3e4f5a6b7c8d9e0f1a2

build:
  number: 0

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ compiler('cxx') }}
    - cython
  host:
    - numpy
    - libgdal
    - python
  run:
    - numpy
    - python
    - click
    - cligj
    - snuggs

test:
  commands:
    - python -c "import rasterio; print(rasterio.__version__)"
    - rio --version

about:
  homepage: https://rasterio.readthedocs.io
  license: BSD-3-Clause
  license_file: LICENSE.txt
  summary: Fast and direct raster I/O for spatial analysis
