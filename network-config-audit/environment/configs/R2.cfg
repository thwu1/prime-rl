!
! R2 Configuration - ABR (Area 0 / Area 2 NSSA) + ASBR (eBGP to R3)
!
hostname R2
!
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
!
interface Loopback0
 ip address 2.2.2.2 255.255.255.255
 ip ospf 1 area 0
!
interface GigabitEthernet1
 description Link to R1 - Backbone
 ip address 192.168.12.2 255.255.255.0
 ip ospf 1 area 0
 ip ospf cost 10
 ip ospf message-digest-key 1 md5 7 06120A3258
 bfd interval 500 min_rx 500 multiplier 3
 no shutdown
!
interface GigabitEthernet2
 description eBGP peering link to R3 (AS 65002)
 ip address 192.168.23.2 255.255.255.0
 no shutdown
!
interface GigabitEthernet3
 description Link to R5 - Area 2 NSSA
 ip address 192.168.25.2 255.255.255.0
 ip ospf 1 area 2
 ip ospf cost 10
 bfd interval 500 min_rx 500 multiplier 3
 no shutdown
!
router ospf 1
 router-id 2.2.2.2
 area 0 authentication message-digest
 area 2 nssa
 redistribute bgp 65001 subnets route-map BGP_TO_OSPF
 passive-interface default
 no passive-interface GigabitEthernet1
 no passive-interface GigabitEthernet3
!
router bgp 65001
 bgp router-id 2.2.2.2
 bgp log-neighbor-changes
 neighbor 192.168.23.3 remote-as 65002
 neighbor 192.168.23.3 description eBGP_to_R3_AS65002
 neighbor 192.168.23.3 timers 10 30
 !
 address-family ipv4 unicast
  redistribute ospf 1 route-map OSPF_TO_BGP
  neighbor 192.168.23.3 activate
  neighbor 192.168.23.3 route-map EXPORT_POLICY out
  neighbor 192.168.23.3 soft-reconfiguration inbound
 exit-address-family
!
route-map EXPORT_POLICY permit 10
 match ip address prefix-list ALLOWED_OUT
!
route-map OSPF_TO_BGP permit 10
 set community 65001:100
!
route-map BGP_TO_OSPF permit 10
 set metric 100
 set metric-type type-1
!
control-plane
 service-policy input COPP_POLICY
!
policy-map COPP_POLICY
 class CL_OSPF
  police rate 500 pps
 class CL_BGP
  police rate 500 pps
 class CL_ICMP
  police rate 100 pps
 class class-default
  police rate 50 pps
!
line con 0
 logging synchronous
line vty 0 4
 transport input ssh
!
end
