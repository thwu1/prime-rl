!
! R5 Configuration - ASBR in Area 2 (NSSA)
!
hostname R5
!
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
!
interface Loopback0
 ip address 5.5.5.5 255.255.255.255
 ip ospf 1 area 2
!
interface GigabitEthernet1
 description Link to R2 - Area 2 NSSA
 ip address 192.168.25.5 255.255.255.0
 ip ospf 1 area 2
 ip ospf cost 10
 bfd interval 500 min_rx 500 multiplier 3
 no shutdown
!
interface GigabitEthernet2
 description Link to R6 - Area 2 NSSA
 ip address 192.168.56.5 255.255.255.0
 ip ospf 1 area 2
 ip ospf cost 500
 bfd interval 500 min_rx 500 multiplier 3
 no shutdown
!
interface GigabitEthernet3
 description External network connection
 ip address 172.16.1.1 255.255.255.0
 no shutdown
!
router ospf 1
 router-id 5.5.5.5
 area 2 nssa
 redistribute connected subnets route-map CONNECTED_TO_OSPF
 network 172.16.0.0 0.0.255.255 area 2
 passive-interface GigabitEthernet3
!
route-map CONNECTED_TO_OSPF permit 10
 match interface GigabitEthernet3
!
line con 0
 logging synchronous
line vty 0 4
 transport input ssh
!
end
