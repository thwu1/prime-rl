!
! R3 Configuration - External eBGP Peer (AS 65002)
!
hostname R3
!
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
!
interface Loopback0
 ip address 3.3.3.3 255.255.255.255
!
interface Loopback1
 ip address 10.3.1.1 255.255.255.0
!
interface GigabitEthernet1
 description eBGP peering link to R2 (AS 65001)
 ip address 192.168.23.3 255.255.255.0
 no shutdown
!
router bgp 65002
 bgp router-id 3.3.3.3
 bgp log-neighbor-changes
 neighbor 192.168.23.2 remote-as 65001
 neighbor 192.168.23.2 description eBGP_to_R2_AS65001
 neighbor 192.168.23.2 timers 10 30
 !
 address-family ipv4 unicast
  network 3.3.3.3 mask 255.255.255.255
  network 10.3.1.0 mask 255.255.255.0
  neighbor 192.168.23.2 activate
  neighbor 192.168.23.2 soft-reconfiguration inbound
 exit-address-family
!
control-plane
 service-policy output COPP_POLICY
!
policy-map COPP_POLICY
 class CL_BGP
  police rate 500 pps
 class CL_ICMP
  police rate 100 pps
 class class-default
  police rate 50 pps
!
line con 0
 logging synchronous
line vty 0 4
 transport input ssh
!
end
