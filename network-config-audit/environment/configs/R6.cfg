!
! R6 Configuration - Access Router in Area 2 (NSSA)
!
hostname R6
!
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
!
interface Loopback0
 ip address 6.6.6.6 255.255.255.255
 ip ospf 1 area 2
!
interface GigabitEthernet1
 description Link to R5 - Area 2 NSSA
 ip address 192.168.56.6 255.255.255.0
 ip ospf 1 area 2
 ip ospf cost 10
 bfd interval 500 min_rx 500 multiplier 3
 no shutdown
!
interface GigabitEthernet2
 description Host-facing LAN segment
 ip address 10.6.1.1 255.255.255.0
 ip ospf 1 area 2
 no shutdown
!
router ospf 1
 router-id 6.6.6.6
 area 2 nssa
 passive-interface GigabitEthernet2
!
ntp server 10.1.1.100
ntp authenticate
ntp authentication-key 1 md5 7 04580A0E17
!
ip access-list standard VTY_ACCESS
 permit 10.0.0.0 0.255.255.255
 deny any
!
line con 0
 logging synchronous
line vty 0 4
 access-class VTY_ACCESS in
 transport input ssh
!
end
