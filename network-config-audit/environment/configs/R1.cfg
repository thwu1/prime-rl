!
! R1 Configuration - ABR (Area 0 / Area 1)
!
hostname R1
!
service timestamps debug datetime msec
service timestamps log datetime msec
service password-encryption
!
interface Loopback0
 ip address 1.1.1.1 255.255.255.255
 ip ospf 1 area 0
!
interface GigabitEthernet1
 description Link to R2 - Backbone
 ip address 192.168.12.1 255.255.255.0
 ip ospf 1 area 0
 ip ospf cost 10
 ip ospf message-digest-key 1 md5 7 06120A3258
 no bfd interval
 no shutdown
!
interface GigabitEthernet2
 description Link to R4 - Area 1
 ip address 192.168.14.1 255.255.255.0
 ip ospf 1 area 1
 ip ospf cost 10
 ip ospf authentication-key 7 1511021F07
 bfd interval 500 min_rx 500 multiplier 3
 no shutdown
!
router ospf 1
 router-id 1.1.1.1
 area 0 authentication message-digest
 area 1 authentication
 passive-interface default
 no passive-interface GigabitEthernet1
 no passive-interface GigabitEthernet2
!
ip route 0.0.0.0 0.0.0.0 Null0
!
control-plane
 service-policy input COPP_POLICY
!
policy-map COPP_POLICY
 class CL_OSPF
  police rate 500 pps
 class CL_BGP
  police rate 500 pps
 class CL_ICMP
  police rate 100 pps
 class class-default
  police rate 50 pps
!
line con 0
 logging synchronous
line vty 0 4
 transport input ssh
!
end
