# Cost configuration for source assignment optimization
# Each source has per-instrument costs for data retrieval
# Affinity groups constrain instruments that must come from the same source

source_costs:
  alpha:
    AAPL: 1.5
    GOOGL: 1.0
    MSFT: 2.0
  beta:
    AAPL: 1.8
    MSFT: 0.8
    TSLA: 1.5
  gamma:
    GOOGL: 0.7
    TSLA: 1.2
    AMZN: 0.6
  delta:
    NFLX: 0.8
    "0050": 2.0
    AMZN: 1.0
  epsilon:
    MSFT: 1.1
    TSLA: 0.4
    NFLX: 1.3

affinity_groups:
  - instruments: ["AAPL", "MSFT"]
