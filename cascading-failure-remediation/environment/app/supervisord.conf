[supervisord]
nodaemon=true
logfile=/app/logs/supervisord.log
pidfile=/tmp/supervisord.pid

[program:service_control_1]
command=python3 /app/service_control/server.py
environment=INSTANCE_ID="1",REGION="region1",PORT="5001"
autorestart=true
startretries=1000
startsecs=2
stderr_logfile=/app/logs/service_control_1_stderr.log
stdout_logfile=/app/logs/service_control_1_stdout.log

[program:service_control_2]
command=python3 /app/service_control/server.py
environment=INSTANCE_ID="2",REGION="region2",PORT="5002"
autorestart=true
startretries=1000
startsecs=2
stderr_logfile=/app/logs/service_control_2_stderr.log
stdout_logfile=/app/logs/service_control_2_stdout.log

[program:service_control_3]
command=python3 /app/service_control/server.py
environment=INSTANCE_ID="3",REGION="region3",PORT="5003"
autorestart=true
startretries=1000
startsecs=2
stderr_logfile=/app/logs/service_control_3_stderr.log
stdout_logfile=/app/logs/service_control_3_stdout.log

[program:gateway]
command=python3 /app/gateway/server.py
environment=PORT="5000"
autorestart=true
startretries=100
startsecs=2
stderr_logfile=/app/logs/gateway_stderr.log
stdout_logfile=/app/logs/gateway_stdout.log
