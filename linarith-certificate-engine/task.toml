difficulty_explanation = """Requires deep understanding of: (1) the mathematical theory underlying certificates of infeasibility for linear arithmetic over the rationals, (2) implementing two independent and complete certificate-finding backends from scratch, (3) exact rational arithmetic with correct handling of equality constraints, strict vs non-strict comparisons, and cyclic variable dependencies, (4) CPLEX LP format specification and subprocess-based integration with an external solver, and (5) a verifier that correctly accepts valid certificates and rejects all invalid ones."""
solution_explanation = """The solution implements a constraint parser, a certificate verifier, two complete oracle backends that find certificates via different mathematical approaches, a dispatch layer, a CPLEX LP format exporter, and a glpsol integration function that invokes the external solver and parses its output."""
verification_explanation = """Tests construct constraint systems programmatically and verify: (1) correct unsatisfiability detection for 10+ problem classes including trivial, multi-variable, cyclic, equality-involving, fractional, and large systems, (2) correct satisfiability detection (no false positives), (3) independent certificate verification for every returned certificate, (4) both oracle backends produce valid certificates, (5) parse_constraint handles various input formats, (6) verify_certificate correctly rejects invalid certificates, (7) exported LP files are parseable by glpsol, and (8) glpsol feasibility results agree with oracle results on applicable systems."""
