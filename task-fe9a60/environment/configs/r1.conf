frr version 10.3
frr defaults traditional
hostname R1
log syslog informational
service integrated-vtysh-config
!
interface lo
 ip address 10.1.1.1/32
exit
!
interface eth0
 ip address 10.0.12.1/30
exit
!
interface eth1
 ip address 10.100.1.1/24
exit
!
interface eth2
 ip address 10.200.1.1/24
exit
!
vrf CUST
exit-vrf
!
vrf MGMT
exit-vrf
!
router bgp 65001 vrf CUST
 bgp router-id 10.100.1.1
 !
 address-family ipv4 unicast
  redistribute connected
  rd vpn export 65001:100
  rt vpn export 65001:100
  rt vpn import 65001:100 65001:200
  export vpn
  import vpn
 exit-address-family
exit
!
router bgp 65001 vrf MGMT
 bgp router-id 10.200.1.1
 !
 address-family ipv4 unicast
  redistribute connected
  rd vpn export 65001:200
  rt vpn both 65001:200
  export vpn
  import vpn
 exit-address-family
exit
!
ip forwarding
!
line vty
!
