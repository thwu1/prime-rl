frr version 10.3
frr defaults traditional
hostname R3
log syslog informational
service integrated-vtysh-config
!
interface lo
 ip address 10.1.1.3/32
exit
!
interface eth0
 ip address 10.0.23.2/30
exit
!
interface eth1
 ip address 10.100.3.1/24
exit
!
interface eth2
 ip address 10.200.3.1/24
exit
!
vrf SERVICES
exit-vrf
!
vrf PROD
exit-vrf
!
router bgp 65001
 bgp router-id 10.1.1.3
 neighbor 10.0.23.1 remote-as 65001
 neighbor 10.0.23.1 update-source lo
 !
 address-family ipv4 unicast
  neighbor 10.0.23.1 activate
 exit-address-family
exit
!
router bgp 65001 vrf SERVICES
 bgp router-id 10.100.3.1
 !
 address-family ipv4 unicast
  redistribute connected
  rd vpn export 65001:300
  rt vpn export 65001:3000
  rt vpn import 65001:300
  export vpn
  import vpn
 exit-address-family
exit
!
router bgp 65001 vrf PROD
 bgp router-id 10.200.3.1
 !
 address-family ipv4 unicast
  redistribute connected
  import vrf SERVICES
 exit-address-family
exit
!
ip forwarding
!
line vty
!
