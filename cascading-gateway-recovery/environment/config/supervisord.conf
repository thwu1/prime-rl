[supervisord]
nodaemon=false
logfile=/app/logs/supervisord.log
pidfile=/tmp/supervisord.pid
childlogdir=/app/logs

[unix_http_server]
file=/tmp/supervisor.sock

[supervisorctl]
serverurl=unix:///tmp/supervisor.sock

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[program:worker-1]
command=python3 /app/services/gateway_worker.py
environment=WORKER_ID="1"
autorestart=true
startretries=999
startsecs=1
stdout_logfile=/app/logs/worker_1_stdout.log
stderr_logfile=/app/logs/worker_1_stderr.log

[program:worker-2]
command=python3 /app/services/gateway_worker.py
environment=WORKER_ID="2",HOTFIX_MODE="lenient"
autorestart=true
startretries=999
startsecs=1
stdout_logfile=/app/logs/worker_2_stdout.log
stderr_logfile=/app/logs/worker_2_stderr.log

[program:worker-3]
command=python3 /app/services/gateway_worker.py
environment=WORKER_ID="3"
autorestart=true
startretries=999
startsecs=1
stdout_logfile=/app/logs/worker_3_stdout.log
stderr_logfile=/app/logs/worker_3_stderr.log
