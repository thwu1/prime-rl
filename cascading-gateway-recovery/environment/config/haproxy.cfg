global
    log stdout format raw local0
    maxconn 256

defaults
    log global
    mode http
    timeout connect 5s
    timeout client 30s
    timeout server 30s
    retries 3
    option httpchk GET /health
    default-server inter 3s fall 3 rise 2

frontend http_front
    bind *:80
    default_backend gateway_workers

backend gateway_workers
    balance roundrobin
    server worker-1 127.0.0.1:8081 check
    server worker-2 127.0.0.1:8082 check
    server worker-3 127.0.0.1:8083 check

listen stats
    bind *:8404
    stats enable
    stats uri /stats
    stats refresh 5s
