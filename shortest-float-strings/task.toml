schema_version = "1.2"

[metadata]
author_name = "Task Generator"
author_email = "author@example.com"
difficulty_explanation = """Requires expert-level understanding of IEEE 754 binary representation — not just shortest-string conversion, but also computing predecessor/successor floats via sign-magnitude bit arithmetic in IEEE 754 total order, determining minimum significant digit counts from the binary-decimal precision relationship, and performing a systematic divergence analysis of a buggy C converter by classifying its failure modes (negative-zero blindness, C %e exponent padding, missing fixed-notation consideration) across 100 values spanning denormals, boundary cases, and notation crossover regions. The agent must integrate SQLite queries, C/Go compilation, cross-language round-trip verification, and structured JSON output — requiring holistic mastery of floating-point representation theory and multi-tool systems integration."""
solution_explanation = """The solution queries the SQLite database, then for each value: (1) finds the minimum significant digits for round-trip by iteratively testing precision 1-17 with struct.pack bit comparison, (2) constructs both fixed and scientific notation from the digit string and selects the shorter one (ties to fixed), (3) computes predecessor and successor hex via IEEE 754 total-order bit arithmetic (decrement/increment with sign-magnitude handling for negative values and ±0 transitions), (4) simulates the buggy fast_convert behavior (Python's format(d,'.Ne') matches C's %.*e) to identify divergences and classify each into negative_zero, exponent_padding, or notation_selection bug classes, and (5) aggregates per-category summary statistics."""
verification_explanation = """Tests independently recompute every field: shortest strings via the same iterative precision search with struct.pack round-trip, min_digits from the iteration count, predecessor/successor via independent bit arithmetic, divergences by simulating fast_convert in Python and comparing with the agent's reported correct output. Additional tests verify formatting rules (no trailing zeros, no exponent padding, lowercase e), notation optimality, special value exactness, known-value spot checks, summary consistency, and structural schema compliance."""
category = "numerical_computing"
tags = ["ieee754", "multi-tool-pipeline"]
expert_time_estimate_hours = 3.0

