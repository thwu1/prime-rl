server:
    bind:
        host: 0.0.0.0
        port: 5000
    url: http://localhost:5000/
    mimetype: application/json; charset=UTF-8
    encoding: utf-8
    gzip: false
    language: en-US
    cors: true
    pretty_print: true
    limits:
        default_items: 10
        max_items: 100
    map:
        url: https://tile.openstreetmap.org/{z}/{x}/{y}.png
        attribution: '&copy; <a href="https://openstreetmap.org/copyright">OpenStreetMap contributors</a>'
    manager:
        name: TinyDB
        connection: /tmp/pygeoapi-process-manager.db
        output_dir: /tmp/

logging:
    level: ERROR

metadata:
    identification:
        title: Meteorological Sensor Stations API
        description: OGC API providing access to global meteorological sensor station data
        keywords:
            - meteorology
            - sensors
            - stations
        keywords_type: theme
        terms_of_service: https://creativecommons.org/licenses/by/4.0/
        url: http://example.org
    license:
        name: CC-BY 4.0 license
        url: https://creativecommons.org/licenses/by/4.0/
    provider:
        name: Weather Data Organization
        url: https://example.org
    contact:
        name: Admin
        position: Data Manager
        email: admin@example.org
        role: pointOfContact

resources:
    stations:
        type: collection
        title: Meteorological Sensor Stations
        description: Global meteorological sensor station data
        keywords:
            - meteorology
            - weather
        extents:
            spatial:
                bbox: [-180, -90, 180, 90]
                crs: http://www.opengis.net/def/crs/OGC/1.3/CRS84
            temporal:
                begin: 2024-01-01T00:00:00Z
                end: 2024-12-31T23:59:59Z
        providers:
            - type: feature
              name: plugins.station_provider.StationProvider
              data: /app/data/stations.db
              table: stations
              id_field: id
              geometry:
                  x_field: longitude
                  y_field: latitude
