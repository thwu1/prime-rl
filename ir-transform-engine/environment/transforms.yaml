transforms:
  - MergeFieldsets:
      from: "xdma::regs::Ch\\d+Ctrl"
      to: "xdma::regs::ChCtrl"
  - MergeFieldsets:
      from: "xdma::regs::Ch\\d+Xfer"
      to: "xdma::regs::ChXfer"
  - MergeFieldsets:
      from: "xdma::regs::Ch\\d+Count"
      to: "xdma::regs::ChCount"
  - MergeEnums:
      from: "xdma::vals::Ch\\d+DataSize"
      to: "xdma::vals::DataSize"
  - MergeEnums:
      from: "xdma::vals::Ch\\d+TreqSel"
      to: "xdma::vals::TreqSel"
  - MergeEnums:
      from: "xdma::vals::Ch\\d+BurstLen"
      to: "xdma::vals::BurstLen"
  - MergeFieldsets:
      from: "xdma::regs::Timer\\d+"
      to: "xdma::regs::Timer"
  - MergeFieldsets:
      from: "xdma::regs::Int[serf]"
      to: "xdma::regs::Int"
  - MakeFieldArray:
      fieldsets: "xdma::regs::Int"
      from: "ch\\d+_(.*)"
      to: "$1"
  - MakeBlock:
      blocks: "xdma::Xdma"
      from: "ch(\\d+)_(.*)"
      to_block: "xdma::Channel"
      to_outer: "ch$1"
      to_inner: "$2"
  - MakeRegisterArray:
      blocks: "xdma::Xdma"
      from: "ch\\d+"
      to: "ch"
  - MakeRegisterArray:
      blocks: "xdma::Xdma"
      from: "timer\\d+"
      to: "timer"
  - Rename:
      from: "xdma::(.*)"
      to: "dma::$1"
  - Rename:
      from: "dma::Xdma"
      to: "dma::Dma"
