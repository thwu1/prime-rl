schema_version = "1.2"

[metadata]
author_name = "Task Generator"
author_email = "author@example.com"
difficulty_explanation = """Requires expert-level understanding of QUIC packet protection (RFC 9001/9369) to evaluate five implementations for RFC conformance. The solver must independently derive the correct cryptographic pipeline from the RFCs (HKDF key derivation, AEAD nonce construction, header protection sampling, Retry pseudo-packet framing, ChaCha20 counter encoding), test each implementation against Appendix A test vectors for both QUIC v1 and v2, distinguish between correct behavior and five distinct classes of subtle violations, and create a correct reference implementation including the inverse operation (packet unprotection) requiring QUIC variable-length integer parsing."""
solution_explanation = """Tests each implementation against RFC test vectors: (1) beta fails v2 key derivation due to transposed salt bytes (a6db vs dba6), (2) gamma fails initial packet protection due to left-aligned instead of right-aligned packet number in AEAD nonce, (3) delta fails initial packet protection due to sample offset at pn_offset+3 instead of +4, (4) epsilon fails retry integrity (missing ODCID length prefix) and ChaCha20 header protection (big-endian counter interpretation). Distinguishes gamma from delta by comparing AEAD ciphertext — correct ciphertext but wrong mask means sample offset bug, wrong ciphertext means nonce bug. Creates a reference implementation with correct cryptographic pipeline plus unprotect_initial_packet using varint parsing."""
verification_explanation = """20 pytest tests: 5 compliance report tests verify each implementation is correctly classified (PASS/FAIL with exact violation set), 7 reference key derivation tests verify v1/v2 intermediate values, 4 reference protection tests verify v1/v2 client and server Initial packets against RFC vectors, 2 retry integrity tag tests, 2 ChaCha20 short header tests, and 2 round-trip unprotect tests verifying decrypt(encrypt(x)) equals x with correct header recovery for both v1 and v2."""
category = "cryptography"
tags = ["quic-protocol", "compliance-evaluation"]
expert_time_estimate_hours = 3.5

