worker_processes 1;
error_log /var/log/nginx/error.log;
pid /tmp/nginx.pid;

events {
    worker_connections 512;
}

http {
    access_log /var/log/nginx/access.log;

    upstream backends {
        server 127.0.0.1:8001;
        server 127.0.0.1:8002;
        server 127.0.0.1:8003;
        server 127.0.0.1:8004;
    }

    server {
        listen 8080;

        location / {
            proxy_pass http://backends;
        }
    }
}
