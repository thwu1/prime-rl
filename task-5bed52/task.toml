difficulty_explanation = """Requires implementing a complete compiler analysis framework from scratch (parsing a custom IR, building CFGs, computing four distinct fixpoint-based dataflow properties with correct lattice semantics, and applying multiple optimization passes to a global fixpoint), then orchestrating a multi-tool pipeline: writing a Makefile with proper target dependencies, converting CFG data to DOT format for graphviz SVG rendering, and using jq to merge JSON analysis results into a summary report. Each dataflow property has subtle correctness requirements around direction, initialization, meet operators, and transfer functions that require expert-level compiler engineering knowledge to get right."""
solution_explanation = """Build a TAC parser that tokenizes instructions into an IR, construct the CFG by identifying leaders and linking blocks via jump targets/fallthroughs, implement each dataflow property as a worklist-based iterative solver with appropriate lattice and direction, use liveness to eliminate dead stores, available expressions to replace redundant computations, and constant propagation to fold expressions. Write a Makefile that orchestrates running the optimizer, piping CFG JSON through a DOT converter to graphviz, and merging constprop JSON via jq."""
verification_explanation = """Tests verify: CFG adjacency correctness, live/reaching/available/constprop sets match expected values per block, optimized TAC preserves semantics when interpreted with strictly fewer instructions, Makefile exists with required targets, SVG files are produced with correct graph nodes, and summary.json merges constprop data correctly."""
