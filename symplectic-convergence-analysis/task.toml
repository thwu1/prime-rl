difficulty_explanation = """Requires specialized knowledge of symplectic integration theory: the Forest-Ruth triple-jump composition theorem (theta = 1/(2-2^(1/3))), the PEFRL optimized coefficients from Omelyan et al. (2002), and the critical requirement that forces must be recomputed after each position update within a multi-stage integrator. The agent must look up or derive specific numerical coefficients, correctly implement interleaved drift-kick stages, and perform convergence analysis via log-log regression. An incorrect coefficient ordering, a missing force re-evaluation, or a sign error yields a method that is no longer 4th order — requiring the agent to diagnose and fix subtle numerical issues."""
solution_explanation = """Implement Forest-Ruth by computing theta = 1/(2 - 2^(1/3)) and building the 7-stage XVXVXVX pattern with coefficients c1=c4=theta/2, c2=c3=(1-theta)/2, d1=d3=theta, d2=1-2*theta, recomputing forces after each position drift. Implement PEFRL with its 9-stage XVXVXVXVX pattern using optimized coefficients xi=0.1786178958448091, lambda=-0.2123418310626054, chi=-0.06626458266981849. Run the convergence analysis at multiple timesteps and fit log-log slopes to verify 4th-order convergence."""
verification_explanation = """Tests verify: (1) convergence orders are within expected ranges (2±0.2 for Velocity Verlet, 4±0.4 for Forest-Ruth and PEFRL); (2) PEFRL achieves strictly lower error than Forest-Ruth at the same timestep; (3) errors decrease monotonically with timestep; (4) correct force evaluation counts (3 for FR, 4 for PEFRL); (5) 4th-order methods achieve at least 2 orders higher convergence than 2nd-order."""
