schema_version = "1.2"

[metadata]
author_name = "Task Generator"
author_email = "author@example.com"
difficulty_explanation = """Requires expert-level knowledge across multiple domains: (1) deep familiarity with AFL++'s Python custom mutator interface — the agent must discover and correctly implement every required entry point without guidance; (2) binary protocol engineering — reverse-engineering the XPROTO spec to build a generator that handles TLV nesting, version-gated types, zlib compression, and IEEE CRC32 integrity; (3) AFL++ instrumentation internals — knowing how to produce both standard and CmpLog-instrumented binaries; (4) fuzzer corpus design — constructing seeds that maximize initial coverage across protocol versions and type variants. The instruction provides only outcome requirements, so the agent must synthesize knowledge across security tooling, binary formats, and compiler instrumentation."""
solution_explanation = """Implement a Python module (/app/mutator.py) exporting all 8 AFL++ custom mutator API functions (init, fuzz, post_process, init_trim, trim, post_trim, havoc_mutation, havoc_mutation_probability). The fuzz function constructs random valid XPROTO messages with correct magic, version-appropriate TLV entries, optional zlib compression, and valid CRC32 checksum. post_process recomputes CRC32 over the full pre-checksum buffer. init_trim/trim/post_trim parse and iteratively remove TLV entries while maintaining structural validity. havoc_mutation applies byte-level mutations with CRC fixup. Compile target.c with afl-clang-fast for the instrumented binary and with AFL_LLVM_CMPLOG=1 for the CmpLog binary. Generate 5+ seed files spanning protocol versions 1-3 and multiple TLV types."""
verification_explanation = """Tests verify outcomes without requiring knowledge of implementation details: (1) mutator module exists and exports all required AFL++ API callables; (2) fuzz() produces messages passing the reference validator across 20 iterations; (3) post_process() correctly recomputes CRC32 on deliberately corrupted messages; (4) trimming produces shorter but structurally valid messages; (5) havoc_mutation returns valid-length buffers without crashing; (6) AFL++-instrumented binary exists, is executable, and contains instrumentation markers; (7) CmpLog binary exists and differs from the standard binary; (8) instrumented binary correctly processes valid XPROTO input; (9) seed corpus has 5+ files passing validation with coverage of 2+ protocol versions and 3+ TLV types."""
category = "security"
tags = ["fuzzing", "afl++"]
