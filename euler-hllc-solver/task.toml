[metadata]
author_name = "Task Generator"
author_email = "author@example.com"
difficulty_explanation = """Requires implementing both the HLLC approximate Riemann solver and an exact Riemann solver for the 1D Euler equations, extended to handle multi-material (variable gamma) flows. The multi-gamma HLLC solver demands understanding wave structure with material-dependent equations of state, correct gamma advection using the contact-wave speed, and consistent energy-pressure conversion with local gamma. The exact Riemann solver for different left/right gammas requires Newton iteration with gamma-dependent pressure functions on each side — a problem absent from standard textbooks (Toro covers only single-gamma). The non-standard initial conditions prevent lookup of known solutions."""
solution_explanation = """Implements a first-order Godunov finite volume method with HLLC flux supporting per-cell gamma. Gamma is advected as rho*gamma using the HLLC contact speed S_star for upwinding. The multi-gamma exact Riemann solver uses gamma_L for left-wave pressure function and gamma_R for right-wave pressure function in Newton iteration, then samples using the appropriate gamma on each side of the contact. Convergence rate is estimated via least-squares on log-log error data."""
verification_explanation = """Tests independently implement the multi-gamma exact Riemann solver to compute ground-truth solutions. L1 density error norms are checked against calibrated thresholds. The multigamma problem additionally verifies that the gamma profile transitions correctly between 1.4 and 1.6667 at the contact position — this can only pass if gamma advection is implemented. Energy thermodynamic consistency E = p/(rho*(gamma-1)) + 0.5*u^2 is verified pointwise using local gamma. Convergence rate must fall in [0.4, 1.3] with monotonically decreasing errors."""
